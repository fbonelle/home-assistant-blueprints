# ==============================================================================
# Example package: complete notification system
# ==============================================================================
# Copy into /config/packages/ (homeassistant: packages: !include_dir_named packages) after
# importing the four blueprints. Replace the example entities with your own. Script
# identifiers are free; these ones are used by the automations that send notifications
# (script.notify_dispatch_global).
# ==============================================================================

# Mute switch of text-to-speech.
input_boolean:
  tts_muted:
    name: Text-to-speech muted
    icon: mdi:volume-mute

# Duplicate filter memory of the dispatcher: up to 10 slots « <epoch>:<truncated md5> »
# separated by « | », that is 219 characters. `max: 255` is required: the default of a
# Text helper is 100 characters, which would cut the memory down to 4 slots with no
# visible error.
input_text:
  notify_dedup_slots:
    name: Notifications — duplicate filter memory
    icon: mdi:fingerprint
    max: 255

script:
  # A single sender script for the three channels.
  notify_send_channel:
    alias: Notifications — Channel sender
    use_blueprint:
      path: fbonelle/notification_system/channel_sender.yaml
      input:
        mobile_service: notify.mobile_app_my_phone
        family_service: notify.family
        default_link: /lovelace/0
        ntfy_entity: notify.ntfy_technical
        email_entity: notify.smtp_alerts
        home_url: https://ha.example.org
  # Entry point called by every automation.
  notify_dispatch_global:
    alias: Notifications — Dispatcher
    use_blueprint:
      path: fbonelle/notification_system/dispatcher.yaml
      input:
        sender_script: script.notify_send_channel
        tts_script: script.tts_engine
        dedup_memory: input_text.notify_dedup_slots
        home_url: https://ha.example.org
        default_link: /lovelace/0
  tts_engine:
    alias: Notifications — Text-to-speech
    use_blueprint:
      path: fbonelle/notification_system/text_to_speech.yaml
      input:
        tts_entity: tts.piper
        speaker_label: tts
        mute_entity: input_boolean.tts_muted

automation:
  - id: notifications_relay_mobile
    alias: Notifications — Mobile relay
    use_blueprint:
      path: fbonelle/notification_system/mobile_relay.yaml
      input:
        dispatcher_script: script.notify_dispatch_global
        clear_service: notify.mobile_app_my_phone
        dismissed_prefixes:
          - capfile_energy_manual_
