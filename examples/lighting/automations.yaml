# Fictional identifiers. Replace remotes, lights, helpers and the timer before enabling.
# One example per typical use; every input that differs from the default is shown.

# Philips Hue Dimmer: On/Off toggles, Up and Down change by one step or continuously, Hue
# switches on at full brightness. Every setting at its default.
- id: living_room_lamp_hue_dimmer
  alias: Living room lamp — Hue Dimmer remote
  use_blueprint:
    path: fbonelle/hue_dimmer_remote.yaml
    input:
      remote: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa1
      light: light.living_room_lamp

# Philips Hue Dimmer whose Hue button does nothing.
- id: desk_lamp_hue_dimmer
  alias: Retro lamp — Hue Dimmer remote
  use_blueprint:
    path: fbonelle/hue_dimmer_remote.yaml
    input:
      remote: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa2
      light: light.retro_lamp
      hue_press_action: none

# Philips Hue Tap Dial: one lamp per button; the dial acts on the lamp switched on most recently.
- id: bedroom_tap_dial
  alias: Bedroom — Hue Tap Dial remote
  use_blueprint:
    path: fbonelle/hue_tap_dial_remote.yaml
    input:
      remote: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa3
      light_1: light.bedroom_ceiling
      light_2: light.bedroom_lamp
      light_3: light.bedroom_shelf_top
      light_4: light.bedroom_shelf_bottom
      dial_scale: 1

# IKEA on/off switch: one-second transition, hold in steps of 10 % every second.
- id: wardrobe_ikea_on_off
  alias: Wardrobe — IKEA switch
  use_blueprint:
    path: fbonelle/ikea_on_off_switch.yaml
    input:
      remote: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa4
      light: light.wardrobe
      hold_step_pct: 10
      hold_interval: 1
      hold_limit: 10
      transition: 1

# IKEA 5-button remote on a color lamp: Left and Right cycle through the palette; holding
# the center button restores the reference color at 100 %.
- id: bedside_ikea_5_buttons_colours
  alias: Bedside lamp — IKEA 5-button remote
  use_blueprint:
    path: fbonelle/ikea_5_button_remote.yaml
    input:
      remote: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa5
      light: light.bedside_lamp
      palette: [default, warm_amber, candlelight, warm_glow, warm_white, sunrise, cool_white,
                peach, dark_peach, saturated_red, pink, light_pink, saturated_pink,
                light_purple, saturated_purple, blue, light_blue, cold_sky, cool_daylight, lime, yellow]

# IKEA 5-button remote on an adjustable white lamp: Left warms and Right cools the white;
# holding the center button goes back to the reference white.
- id: decoration_ikea_5_buttons_whites
  alias: Decoration lamp — IKEA 5-button remote
  use_blueprint:
    path: fbonelle/ikea_5_button_remote.yaml
    input:
      remote: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa6
      light: light.decoration_lamp
      left_press_action: warmer
      left_hold_action: warmer_hold
      right_press_action: cooler
      right_hold_action: cooler_hold
      kelvin_step: 150
      reference_kelvin: 2500

# IKEA STYRBAR remote with a memory helper: settings of the former STYRBAR blueprint
# (default values); a double press on Up recalls the chosen color.
- id: bedside_styrbar
  alias: Bedside lamp — STYRBAR remote
  use_blueprint:
    path: fbonelle/ikea_styrbar_remote.yaml
    input:
      remote: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa8
      light: light.bedside_left
      memory: input_text.bedside_left_remote
      recall_color: [255, 192, 140]

# eWeLink button: single click toggles (on at 25 %), double click alternates between 25 % and 100 %.
- id: garden_ewelink_button
  alias: Garden — eWeLink button
  use_blueprint:
    path: fbonelle/ewelink_button.yaml
    input:
      remote: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa7
      light: light.garden_lamps
      single_press_action: toggle_level
      double_press_action: alternate
      on_level_pct: 25
      high_level_pct: 100

# Aqara button: single press toggles with a one-second transition, double press goes to
# full brightness, hold dims until release.
- id: living_room_aqara_button
  alias: Living room — Aqara button
  use_blueprint:
    path: fbonelle/aqara_button.yaml
    input:
      remote: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa9
      light: light.living_room_lamps
      single_press_action: toggle
      double_press_action: full
      button_hold_action: dimmer_hold
      transition: 1

# Stairs switched off automatically three minutes after every switch-on.
- id: stairs_auto_off
  alias: Stairs — automatic switch-off
  use_blueprint:
    path: fbonelle/auto_off.yaml
    input:
      entities: [light.stairs]
      duration: {hours: 0, minutes: 3, seconds: 0}
      timer: timer.stairs
