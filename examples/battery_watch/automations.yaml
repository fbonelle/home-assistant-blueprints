# Fictional identifiers. Replace the to-do list and the notification actions before enabling.
# Create the list with the Local To-do integration; it cannot be declared in YAML.
- id: battery_watch_house
  alias: Surveillance des piles et batteries — maison
  use_blueprint:
    path: fbonelle/surveillance_piles.yaml
    input:
      memory: todo.piles_et_batteries
      threshold: 20
      recovery_margin: 5
      unavailable_hours: 6
      summary_time: '09:00:00'
      summary_weekdays: [mon, tue, wed, thu, fri, sat, sun]
      excluded_integrations: [mobile_app, icloud, icloud3, nut]
      excluded_manufacturers: [Apple]
      alert_actions:
      - action: notify.mobile_app_example_phone
        data:
          title: '{{ battery_title }}'
          message: '{{ battery_message }}'
      summary_actions:
      - action: notify.mobile_app_example_phone
        data:
          title: '{{ battery_title }}'
          message: '{{ battery_message }}'
