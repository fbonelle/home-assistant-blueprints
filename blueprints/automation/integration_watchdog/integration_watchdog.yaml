# SPDX-License-Identifier: GPL-3.0-only
# Version 2026.11.3.1 — self-contained blueprint: no shared configuration file.
# Memory: p reservation, f 0 reserved, 1-2 admitted or started, >2 end of the reload.
blueprint:
  name: Integration watchdog — 2026.11.3.1
  description: 'Watches the entities of an integration and tries to reload it when it fails. The number of attempts,
    the delays, the notifications and the logs can be set. Create a Text helper, then one automation per integration
    configuration; no other file is needed. Guide: https://github.com/fbonelle/home-assistant-blueprints/blob/main/docs/integration_watchdog.en.md'
  domain: automation
  homeassistant:
    min_version: 2026.8.0
  input:
    monitoring:
      name: Integration and entities to watch
      input:
        name:
          selector:
            text: {}
          name: Name in notifications
          default: Watched integration
        entry_id:
          selector:
            config_entry: {}
          name: Configuration of the integration to watch
          description: Choose the account or gateway concerned. Two accounts or two gateways of the same integration
            are set up separately.
        entities:
          selector:
            entity:
              multiple: true
          name: Entities to watch
          description: 'Choose active entities of this integration: for example a temperature, a cover or a thermostat.
            Their state shows when something is wrong.'
        memory:
          selector:
            entity:
              filter:
              - domain: input_text
          name: Text helper that keeps the history
          description: Create a Text helper in Home Assistant, minimum length 0 and maximum 255. It keeps the attempts
            and their state across a restart. Use a different helper for every watched configuration.
        policy:
          default: all
          selector:
            select:
              options:
              - label: When every entity is failing
                value: all
              - label: When at least one entity is failing
                value: any
          name: When should the integration be reloaded?
        max_age:
          selector:
            number:
              min: 0
              max: 604800
              step: 1
              mode: box
          default: 0
          name: Maximum delay without new data (seconds)
          description: 0 disables this check. Use it for measurements sent regularly. When the integration gives
            no measurement date, the check relies on the data received by Home Assistant.
        stagger_seconds:
          selector:
            number:
              min: 0
              max: 600
              step: 1
              mode: box
          default: 0
          name: Extra delay before a reload (seconds)
          description: Spreads the reloads of several integrations so that they are not all requested at the same
            moment.
        source_time_entity:
          selector:
            entity: {}
          name: Entity giving the date of the last measurement (optional)
          default: ''
          description: Fill in only when an entity gives the real date of the measurement. The delay without new
            data must then be above 0.
        source_time_attribute:
          selector:
            text: {}
          name: Attribute holding the measurement date (optional)
          default: ''
          description: Leave empty when the date is directly in the state of the entity chosen above.
        uptime_entity:
          name: Home Assistant Uptime sensor
          selector:
            entity:
              filter:
              - domain: sensor
                integration: uptime
        scan_minutes:
          name: Check frequency
          default: /1
          selector:
            select:
              options:
              - label: Every minute
                value: /1
              - label: Every 2 minutes
                value: /2
              - label: Every 5 minutes
                value: /5
              - label: Every 10 minutes
                value: /10
        fault_seconds:
          name: Minimum failure duration before a reload (seconds)
          default: 300
          selector:
            number:
              min: 30
              max: 86400
              step: 1
              mode: box
        include_unknown:
          name: Count the « unknown » state as a failure
          description: The unknown state means that Home Assistant does not know the value. This option triggers
            a reload when that state lasts long enough. It never confirms a recovery.
          default: false
          selector:
            boolean: {}
        startup_seconds:
          name: Wait after Home Assistant start-up (seconds)
          default: 600
          selector:
            number:
              min: 60
              max: 86400
              step: 1
              mode: box
          description: Gives the integrations time to connect before a reload is attempted.
    recovery:
      name: Reloads and number of attempts
      input:
        observation_only:
          name: Observe without reloading the integration
          default: false
          selector:
            boolean: {}
        logging_enabled:
          name: Record events in the logs
          default: true
          description: integration_watchdog logger. The watchdog sets its level itself (info, or debug with detailed
            logs); no configuration is needed.
          selector:
            boolean: {}
        detailed_logging:
          name: Enable detailed logs
          default: false
          description: Adds a line at every check. Keep it for diagnosis; the messages do not contain the sensor
            values.
          selector:
            boolean: {}
        excluded_instances:
          name: Configurations to exclude
          default: []
          selector:
            object:
              multiple: true
              fields:
                entry_id:
                  label: Configuration to exclude
                  required: true
                  selector:
                    config_entry: {}
        max_attempts:
          name: Maximum number of attempts for one failure
          default: 3
          selector:
            number:
              min: 1
              max: 10
              step: 1
              mode: box
          description: Once this limit is reached, reloads stop and a notification is sent. The counter is reset
            after a lasting recovery or a manual action.
        max_daily:
          name: Maximum number of attempts over the last 24 hours
          default: 6
          selector:
            number:
              min: 1
              max: 6
              step: 1
              mode: box
          description: 'This limit still applies after a new failure or a normal Home Assistant restart. Maximum:
            6 attempts, to keep the history in a single Text helper.'
        recovery_seconds:
          name: Time given to the integration to recover after a reload (seconds)
          default: 600
          selector:
            number:
              min: 60
              max: 3600
              step: 1
              mode: box
          description: Must be at least equal to the recovery confirmation delay.
        stable_seconds:
          name: Normal operation time before confirmation (seconds)
          default: 180
          selector:
            number:
              min: 60
              max: 3600
              step: 1
              mode: box
          description: Every watched entity must stay available during this time. A new unknown or unavailable state
            starts this wait again.
        incident_reset_seconds:
          name: Normal operation time before the attempts are reset (seconds)
          default: 1800
          selector:
            number:
              min: 60
              max: 86400
              step: 1
              mode: box
          description: This delay avoids resetting the counter after a very short improvement. The limit over the
            last 24 hours is kept.
        retry_seconds:
          name: Wait before a new attempt (seconds)
          default: 300
          selector:
            number:
              min: 60
              max: 86400
              step: 1
              mode: box
        max_backoff:
          name: Maximum wait between two attempts (seconds)
          default: 3600
          selector:
            number:
              min: 60
              max: 86400
              step: 1
              mode: box
          description: The wait grows after every failure, up to this value.
        reload_timeout:
          name: Delay before an alert when a reload does not finish (seconds)
          default: 180
          selector:
            number:
              min: 30
              max: 3600
              step: 1
              mode: box
          description: An alert is sent when the reload has not finished after this delay. The reload is not cancelled;
            watching resumes as soon as it finishes, and no other reload is started for this integration in the
            meantime.
        native_timeout:
          name: Delay before an alert when Home Assistant is already reconnecting the integration (seconds)
          default: 1800
          selector:
            number:
              min: 60
              max: 86400
              step: 1
              mode: box
          description: The watchdog lets Home Assistant carry on reconnecting and only reports a wait that lasts
            too long.
        additional_conditions:
          name: Extra conditions allowing reloads
          description: Checks and alerts go on when these conditions prevent a new reload.
          default: []
          selector:
            condition: {}
    notifications:
      name: Notifications
      input:
        failure_actions:
          name: Actions when an intervention is needed
          description: 'Default: a notification in Home Assistant. Variables available to customise the message:
            entry_id, integration_title, reason, attempts_used, daily_attempts, failed_entities, status. A notification
            that fails is retried at a later check.'
          selector:
            action: {}
          default:
          - action: persistent_notification.create
            data:
              notification_id: integration_watchdog_{{ entry_id }}
              title: 'Integration to check: {{ integration_title }}'
              message: |-
                {{ reason }}
                Attempts for this failure: {{ attempts_used }}; over the last 24 h: {{ daily_attempts }}.
                Failing entities: {{ failed_entities | join(", ") }}.
        success_actions:
          name: Actions after recovery
          description: By default, clears the failure notification. The same variables as for the alert are available.
          selector:
            action: {}
          default:
          - action: persistent_notification.dismiss
            data:
              notification_id: integration_watchdog_{{ entry_id }}
        configuration_error_actions:
          name: Actions when the watchdog configuration is wrong
          description: 'Default: a notification explaining the settings to fix. Available variable: configuration_errors.'
          selector:
            action: {}
          default:
          - action: persistent_notification.create
            data:
              notification_id: integration_watchdog_configuration_{{ owner_id }}
              title: Integration watchdog unavailable
              message: '{{ configuration_errors | join("\n") }}'
        configuration_resolved_actions:
          name: Actions when the configuration is correct
          description: 'By default, clears the configuration alert. These actions run at every valid check: they
            must be quick and safe to run several times.'
          selector:
            action: {}
          default:
          - action: persistent_notification.dismiss
            data:
              notification_id: integration_watchdog_configuration_{{ owner_id }}
  source_url: https://github.com/fbonelle/home-assistant-blueprints/blob/main/blueprints/automation/integration_watchdog/integration_watchdog.yaml
  author: fbonelle
mode: queued
max: 10
max_exceeded: silent
trace:
  stored_traces: 20
variables:
  name: !input 'name'
  entry_id: !input 'entry_id'
  entities: !input 'entities'
  policy: !input 'policy'
  max_age: !input 'max_age'
  stagger_seconds: !input 'stagger_seconds'
  source_time_entity: !input 'source_time_entity'
  source_time_attribute: !input 'source_time_attribute'
  uptime_entity: !input 'uptime_entity'
  scan_minutes: !input 'scan_minutes'
  fault_seconds: !input 'fault_seconds'
  include_unknown: !input 'include_unknown'
  startup_seconds: !input 'startup_seconds'
  observation_only: !input 'observation_only'
  logging_enabled: !input 'logging_enabled'
  detailed_logging: !input 'detailed_logging'
  excluded_instances: !input 'excluded_instances'
  max_attempts: !input 'max_attempts'
  max_daily: !input 'max_daily'
  recovery_seconds: !input 'recovery_seconds'
  stable_seconds: !input 'stable_seconds'
  incident_reset_seconds: !input 'incident_reset_seconds'
  retry_seconds: !input 'retry_seconds'
  max_backoff: !input 'max_backoff'
  reload_timeout: !input 'reload_timeout'
  native_timeout: !input 'native_timeout'
  memory_entity: !input 'memory'
  legacy_owner: w_{{ this.attributes.id | default(this.entity_id,true) }}
  owner_id: w_{{ sha256(this.attributes.id | default(this.entity_id,true) | string)[:16] }}
  entry_key: e_{{ sha256(entry_id | string)[:16] }}
  manual: '{{ trigger is not defined or trigger.id is not defined }}'
triggers:
- trigger: time_pattern
  minutes: !input 'scan_minutes'
  id: scan
- trigger: state
  entity_id: !input 'entities'
  id: availability
- trigger: homeassistant
  event: start
  id: start
conditions:
- condition: template
  value_template: '{{ trigger is not defined or trigger.id != ''availability'' or trigger.from_state is none or
    trigger.to_state is none or ((trigger.from_state.state in [''unknown'',''unavailable''] or trigger.from_state.attributes.get(''restored'',false))
    != (trigger.to_state.state in [''unknown'',''unavailable''] or trigger.to_state.attributes.get(''restored'',false)))
    }}'
actions:
- variables:
    clock_ts: '{{ as_timestamp(now()) | int }}'
- &id002
  variables:
    read: |
      {# Only this validated record may be written back by the supervision itself. #}
      {% set ns = namespace(errors=[],data=none) %}
      {% set raw = states(memory_entity) if memory_entity is string else '' %}
      {% if memory_entity is not string or not memory_entity.startswith('input_text.') %}
        {% set ns.errors = ns.errors + ['Choose a Text helper used by this watchdog only.'] %}
      {% elif states[memory_entity] is none or raw == 'unavailable' or state_attr(memory_entity,'min') | int(-1) != 0 or state_attr(memory_entity,'max') | int(0) != 255 %}
        {% set ns.errors = ns.errors + ['Text helper missing or badly set up: minimum length 0 and maximum length 255 required.'] %}
      {% elif raw in ['', 'unknown'] %}
        {% set ns.data = {'v':3,'o':owner_id,'e':entry_key,'a':[],'i':0,'n':0,'p':0,'f':0,'h':0,'t':0,'s':'new','k':''} %}
      {% else %}
        {% set d = raw[4:] | from_json(none) if raw.startswith('iw3:') or raw.startswith('iw2:') else none %}
        {% if d is not mapping %}
          {% set ns.errors = ns.errors + ['The history held in the Text helper is unreadable. It was not cleared.'] %}
        {% elif (d.get('v') == 3 and (not raw.startswith('iw3:') or d.get('o') != owner_id or d.get('e') != entry_key)) or (d.get('v') == 2 and (not raw.startswith('iw2:') or d.get('o') != legacy_owner)) or d.get('v') not in [2,3] %}
          {% set ns.errors = ns.errors + ['The Text helper holds the history of another watchdog or an unknown format.'] %}
        {% elif d.get('s') not in ['new','startup','healthy','degraded','waiting','running','verify','limited','suspended','auth','fatal','timeout','paused','disabled','native','observation','deferred','duplicate','interrupted'] or d.get('k') is not string %}
          {% set ns.errors = ns.errors + ['The state recorded in the history is wrong.'] %}
        {% else %}
          {% for key in ['i','n','p','f','h','t'] %}
            {% set value = d.get(key) %}
            {% set upper = 4294967295000000 if key == 'p' and d.v == 3 else 4294967295 %}
            {% if value is not number or value is boolean or not (0 <= value <= upper) %}
              {% set ns.errors = ns.errors + ['Invalid counter or timestamp: ' ~ key] %}
            {% elif value != value | int or (key == 'i' and value > 10) or (key in ['h','t'] and value > clock_ts + 60) or (key == 'f' and value > clock_ts + 60) or (key == 'p' and value > (clock_ts + 60) * (1000000 if d.v == 3 else 1)) %}
              {% set ns.errors = ns.errors + ['Inconsistent history or clock: ' ~ key] %}
            {% endif %}
          {% endfor %}
          {% if d.get('a') is not sequence or d.get('a') is string or d.get('a') is mapping or d.a | count > 6 %}
            {% set ns.errors = ns.errors + ['Invalid request history.'] %}
          {% else %}
            {% for value in d.a %}
              {% if value is not number or value is boolean or not (0 <= value <= clock_ts + 60) %}
                {% set ns.errors = ns.errors + ['Inconsistent history or clock.'] %}
              {% elif value != value | int %}
                {% set ns.errors = ns.errors + ['Timestamp is not an integer.'] %}
              {% endif %}
            {% endfor %}
          {% endif %}
          {% if ns.errors | count == 0 %}
            {% if d.v == 2 %}
              {% set ns.data = dict(d,v=3,o=owner_id,e=entry_key,p=d.p * 1000000,f=(2 if d.p > 0 else d.f + 1 if d.f > 0 else 0)) %}
            {% else %}{% set ns.data = d %}{% endif %}
          {% endif %}
        {% endif %}
      {% endif %}
      {{ {'raw':raw,'data':ns.data,'errors':ns.errors} }}
- &id003
  if: '{{ read.errors | count > 0 }}'
  then:
  - variables:
      configuration_errors: '{{ read.errors }}'
  - sequence: !input 'configuration_error_actions'
  - stop: Invalid memory; no reset.
- &id004
  variables:
    normalized: |-
      {% set d = read.data %}
      {% set window = recovery_seconds if recovery_seconds is number and recovery_seconds is not boolean and 60 <= recovery_seconds <= 3600 else 600 %}
      {% if d.p > 0 and d.f > 2 %}
       {{ dict(d,p=0,h=0,n=clock_ts+window,s='verify') }}
      {% elif d.p > 0 and d.f == 0 %}
       {{ dict(d,p=0,n=clock_ts,s='deferred') }}
      {% elif d.p > 0 and config_entry_attr(entry_id,'state') == 'not_loaded' %}
       {{ dict(d,p=0,f=clock_ts+1,h=0,n=0,s='interrupted') }}
      {% elif d.p > 0 %}
       {{ dict(d,p=0,f=clock_ts+1,h=0,n=clock_ts+window,s='verify') }}
      {% else %}{{ d }}{% endif %}
- &id005
  if: '{{ read.raw not in ['''', ''unknown''] and read.raw != ''iw3:'' ~ (normalized | to_json) }}'
  then:
  - variables:
      new_memory: iw3:{{ normalized | to_json }}
  - if: '{{ new_memory | length > 255 }}'
    then: &id001
    - variables:
        configuration_errors:
        - The history could not be saved. No new reload was started.
    - sequence: !input 'configuration_error_actions'
    - stop: Memory write not confirmed.
  - if: '{{ states(memory_entity) != new_memory }}'
    then:
    - action: input_text.set_value
      target:
        entity_id: '{{ memory_entity }}'
      data:
        value: '{{ new_memory }}'
  - if: '{{ states(memory_entity) != new_memory }}'
    then: *id001
- variables:
    configuration_errors: |
      {% set ns = namespace(errors=[]) %}
      {% for name, value, lo, hi in [
       ('fault_seconds',fault_seconds,30,86400),('startup_seconds',startup_seconds,60,86400),
       ('max_attempts',max_attempts,1,10),('max_daily',max_daily,1,6),
       ('recovery_seconds',recovery_seconds,60,3600),('stable_seconds',stable_seconds,60,3600),
       ('incident_reset_seconds',incident_reset_seconds,60,86400),('retry_seconds',retry_seconds,60,86400),
       ('max_backoff',max_backoff,60,86400),('reload_timeout',reload_timeout,30,3600),
       ('native_timeout',native_timeout,60,86400),('max_age',max_age,0,604800),('stagger_seconds',stagger_seconds,0,600)] %}
       {% if value is not number or value is boolean or not (lo <= value <= hi) %}
        {% set ns.errors = ns.errors + ['Invalid numeric setting: ' ~ name] %}
       {% elif value != value | int %}{% set ns.errors = ns.errors + ['An integer is required: ' ~ name] %}{% endif %}
      {% endfor %}
      {% if ns.errors | count == 0 and (recovery_seconds < stable_seconds or incident_reset_seconds < stable_seconds or max_backoff < retry_seconds) %}
       {% set ns.errors = ns.errors + ['The recovery and attempt reset delays must cover the confirmation delay. The maximum wait must be at least equal to the initial wait.'] %}
      {% endif %}
      {% for value in [include_unknown,logging_enabled,detailed_logging,observation_only] %}
       {% if value is not boolean %}{% set ns.errors = ns.errors + ['Options must be switched on or off.'] %}{% endif %}
      {% endfor %}
      {% if scan_minutes not in ['/1','/2','/5','/10'] or policy not in ['all','any'] or name is not string or not name | trim %}
       {% set ns.errors = ns.errors + ['Invalid frequency, name or failure criterion.'] %}
      {% endif %}
      {% if entry_id is not string or not entry_id or config_entry_attr(entry_id,'state') is none %}
       {% set ns.errors = ns.errors + ['Choose an existing integration configuration.'] %}
      {% endif %}
      {% if issues is not defined %}{% set ns.errors = ns.errors + ['Native issues() function required.'] %}{% endif %}
      {% if uptime_entity is not string or not uptime_entity.startswith('sensor.') or as_timestamp(states(uptime_entity),none) is none %}
       {% set ns.errors = ns.errors + ['Uptime sensor unavailable.'] %}
      {% elif as_timestamp(states(uptime_entity)) > clock_ts + 60 %}
       {% set ns.errors = ns.errors + ['The date given by the Uptime sensor is inconsistent.'] %}
      {% endif %}
      {% if entities is not sequence or entities is string or entities is mapping or entities | count == 0 %}
       {% set ns.errors = ns.errors + ['Choose at least one entity to watch.'] %}
      {% else %}
       {% for entity in entities %}
        {% if entity is not string or config_entry_id(entity) != entry_id %}
         {% set ns.errors = ns.errors + ['A selected entity does not belong to the chosen integration.'] %}
        {% elif states[entity] is none and config_entry_attr(entry_id,'state') == 'loaded' %}
         {% set ns.errors = ns.errors + ['Entity with no available value: ' ~ entity] %}
        {% endif %}
       {% endfor %}
      {% endif %}
      {% if source_time_entity is not string or source_time_attribute is not string %}
       {% set ns.errors = ns.errors + ['The entity giving the measurement date is wrong.'] %}
      {% elif source_time_entity != '' and (states[source_time_entity] is none or max_age is not number or max_age <= 0) %}
       {% set ns.errors = ns.errors + ['Check the entity giving the measurement date and the maximum delay without new data.'] %}
      {% endif %}
      {% if excluded_instances is not sequence or excluded_instances is string or excluded_instances is mapping %}
       {% set ns.errors = ns.errors + ['Invalid exclusion list.'] %}
      {% else %}
       {% for item in excluded_instances %}
        {% if item is not mapping or item.get('entry_id') is not string or not item.get('entry_id') %}
         {% set ns.errors = ns.errors + ['An exclusion is invalid.'] %}
        {% endif %}
       {% endfor %}
      {% endif %}
      {% for helper in states.input_text %}
       {% if helper.entity_id != memory_entity and helper.state.startswith('iw3:') %}
        {% set other = helper.state[4:] | from_json({}) %}
        {% if other is mapping and other.get('e') == entry_key %}
         {% set ns.errors = ns.errors + ['Another watchdog uses this configuration with the helper ' ~ helper.entity_id ~ '. Delete the copy and its unused helper after checking.'] %}
        {% endif %}
       {% endif %}
      {% endfor %}
      {{ ns.errors | unique | list }}
- if: '{{ configuration_errors | count > 0 }}'
  then:
  - sequence: !input 'configuration_error_actions'
  - stop: Invalid settings; reload endings kept.
- variables:
    excluded: '{{ entry_id in (excluded_instances | map(attribute=''entry_id'') | list) }}'
- if: '{{ excluded }}'
  then:
  - stop: Configuration excluded; reload endings kept.
- sequence: !input 'configuration_resolved_actions'
- variables:
    interventions_allowed: false
- if:
  - condition: template
    value_template: '{{ not observation_only }}'
  - condition: and
    conditions: !input 'additional_conditions'
  then:
  - variables:
      interventions_allowed: true
- variables:
    row: '{{ dict(name=name,entry_id=entry_id,entities=entities,max_age=max_age,policy=policy,source_time_entity=source_time_entity,source_time_attribute=source_time_attribute,stagger_seconds=stagger_seconds)
      }}'
- repeat:
    count: 2
    sequence:
    - if: '{% set c = states(memory_entity)[4:] | from_json({}) if states(memory_entity).startswith(''iw3:'') else
        {} %}{{ repeat.index == 1 or (c is mapping and c.get(''o'') == owner_id and c.get(''p'', 0) > 0 and c.get(''f'',
        0) > 2) }}'
      then:
      - if: '{{ repeat.index > 1 }}'
        then:
        - variables:
            clock_ts: '{{ as_timestamp(now()) | int }}'
        - *id002
        - *id003
        - *id004
        - *id005
      - *id002
      - *id003
      - variables:
          memory: '{{ read.data }}'
      - if: '{{ manual and repeat.index == 1 }}'
        then:
        - variables:
            memory: '{{ dict(memory,i=0,n=0,h=0,s=(''interrupted'' if memory.s == ''interrupted'' else ''new''))
              }}'
      - variables:
          health: |
            {% set ns = namespace(bad=[], recovered=true, source_invalid=false) %}
            {% set started = as_timestamp(states(uptime_entity), clock_ts) %}
            {% set age = row.get('max_age',0) | int %}
            {% set after = memory.get('f',0) %}
            {% set source = row.get('source_time_entity','') %}
            {% for entity in row.entities | unique %}
              {% set s = states[entity] %}
              {% set bad_state = s is none or s.state == 'unavailable' or (include_unknown and s.state == 'unknown') %}
              {% set since = as_timestamp(s.last_changed,started) if s is not none else started %}
              {% set report = as_timestamp(s.last_reported,0) if s is not none else 0 %}
              {% set stale = age > 0 and source == '' and (clock_ts - report >= age or report > clock_ts + 60) %}
              {% if (bad_state and clock_ts - since >= fault_seconds) or stale %}
                {% set ns.bad = ns.bad + [entity] %}
              {% endif %}
              {% if s is none or s.state in ['unknown','unavailable'] or s.attributes.get('restored',false) or (age > 0 and source == '' and (stale or (after > 0 and report <= after))) %}
                {% set ns.recovered = false %}
              {% endif %}
            {% endfor %}
            {% if source != '' %}
              {% set attr = row.get('source_time_attribute','') %}
              {% set stamp = as_timestamp(state_attr(source,attr) if attr != '' else states(source),none) %}
              {% if stamp is none or stamp > clock_ts + 60 or clock_ts - stamp >= age %}
                {% set ns.bad = ns.bad + [source] %}
                {% set ns.recovered = false %}
                {% if stamp is none or stamp > clock_ts + 60 %}{% set ns.source_invalid = true %}{% endif %}
              {% elif after > 0 and stamp <= after %}
                {% set ns.recovered = false %}
              {% endif %}
            {% endif %}
            {% set witness_bad = ns.bad | reject('equalto',source) | list %}
            {% set fault = (witness_bad | count > 0 if row.get('policy','all') == 'any' else witness_bad | count == row.entities | unique | list | count) or (source != '' and source in ns.bad) %}
            {{ {'bad':ns.bad,'fault':fault,'source_invalid':ns.source_invalid,'recovered':ns.recovered and config_entry_attr(row.entry_id,'state') == 'loaded'} }}
      - variables:
          reservation_ts: '{{ (as_timestamp(now()) * 1000000) | int }}'
      - variables:
          plan: |
            {% set now_ts = clock_ts | int %}
            {% set boot = as_timestamp(states(uptime_entity),now_ts) | int %}
            {% set period = (scan_minutes[1:] | int) * 60 %}
            {% set history = memory.get('a',[]) | select('gt',now_ts - 86400) | list %}
            {% set old_status = memory.get('s','new') %}
            {% set old_notice = memory.get('k','') %}
            {% set ns = namespace(a=history,i=memory.get('i',0),n=memory.get('n',0),p=memory.get('p',0),f=memory.get('f',0),h=memory.get('h',0),s=old_status,reason='',reload=false,notice='none') %}
            {% if boot > memory.get('t',0) or now_ts - memory.get('t',0) > period * 2 + 30 %}
              {% set ns.h = 0 %}
            {% endif %}
            {# Reload cut short by a stop of the run while the entry stayed unloaded: resume it. #}
            {% set force = old_status == 'interrupted' %}
            {% if trigger is defined and trigger.id == 'availability' %}{% set ns.h = 0 %}{% endif %}
            {% set entry_state = config_entry_attr(row.entry_id,'state') %}
            {% set domain = config_entry_attr(row.entry_id,'domain') %}
            {% set auth = ('homeassistant','config_entry_reauth_' ~ domain ~ '_' ~ row.entry_id) in issues() %}
            {% set startup_ok = now_ts - boot >= startup_seconds %}
            {% set alarm = false %}
            {% if old_status == 'native' and entry_state == 'loaded' %}
              {% set ns.n = 0 %}
            {% endif %}
            {% set force = force and entry_state == 'not_loaded' %}
            {% if auth %}
              {% set ns.h = 0 %}
              {% set ns.s = 'auth' %}
              {% set ns.reason = 'Reauthentication is required. Renew the connection in Home Assistant; no automatic reload.' %}
              {% set alarm = true %}
            {% elif config_entry_attr(row.entry_id,'disabled_by') is not none %}
              {% set ns.h = 0 %}
              {% set ns.s = 'disabled' %}
              {% set ns.reason = 'This integration configuration is disabled.' %}
            {% elif not startup_ok %}
              {% set ns.h = 0 %}
              {% set ns.s = 'startup' %}
              {% set ns.reason = 'Waiting after Home Assistant start-up.' %}
            {% elif entry_state in ['migration_error','failed_unload','setup_error','not_loaded'] and not force %}
              {% set ns.h = 0 %}
              {% set ns.s = 'fatal' %}
              {% set ns.reason = 'State ' ~ entry_state ~ ': manual intervention needed; no forced reload.' %}
              {% set alarm = true %}
            {% elif config_entry_attr(row.entry_id,'pref_disable_polling') %}
              {% set ns.h = 0 %}
              {% set ns.n = 0 %}
              {% set ns.s = 'native' %}
              {% set ns.reason = 'Polling deliberately disabled; no forced reload.' %}
            {% elif entry_state != 'loaded' and not force %}
              {% set ns.h = 0 %}
              {% if old_status != 'native' or ns.n == 0 %}{% set ns.n = now_ts + native_timeout %}{% endif %}
              {% set ns.s = 'native' %}
              {% set ns.reason = 'Home Assistant is already trying to reconnect the integration.' %}
              {% if now_ts >= ns.n %}
                {% set ns.reason = 'The reconnection handled by Home Assistant is taking too long. Check the errors of the integration.' %}
                {% set alarm = true %}
              {% endif %}
            {% elif health.source_invalid %}
              {% set ns.h = 0 %}
              {% set ns.s = 'fatal' %}
              {% set ns.reason = 'The source timestamp is missing or inconsistent: check where it comes from and the clock. Reloads suspended.' %}
              {% set alarm = true %}
            {% elif health.recovered %}
              {% if ns.h == 0 %}
                {% set ns.h = now_ts %}
              {% endif %}
              {% if now_ts - ns.h >= stable_seconds %}
                {% set ns.s = 'healthy' %}
                {% set ns.reason = 'Every watched entity has been working for the planned confirmation time.' %}
                {% if old_notice != '' or (old_status != 'healthy' and ns.i > 0) %}
                  {% set ns.notice = 'success' %}
                {% endif %}
                {% if now_ts - ns.h >= incident_reset_seconds %}
                  {% set ns.i = 0 %}
                {% endif %}
                {% set ns.n = 0 %}
              {% else %}
                {% set ns.reason = 'The entities are available again. Waiting for the recovery to be confirmed.' %}
                {% if ns.s != 'verify' %}{% set ns.s = 'degraded' %}{% endif %}
              {% endif %}
            {% else %}
              {% set ns.h = 0 %}
              {% if ns.s == 'verify' and now_ts < ns.n %}
                {% set ns.reason = 'Waiting for the data to come back after the reload.' %}
              {% elif ns.s == 'verify' %}
                {% set ns.s = 'waiting' %}
                {% set ns.n = now_ts + [retry_seconds * (2 ** ([ns.i - 1,0] | max)),max_backoff] | min + row.get('stagger_seconds',0) %}
                {% set ns.reason = 'The expected data did not come back. A new attempt will be offered after the planned delay.' %}
                {% if ns.i >= max_attempts %}
                  {% set ns.s = 'suspended' %}
                  {% set ns.reason = 'The maximum number of attempts for this failure is reached. Reloads are suspended until a lasting recovery or a manual reset.' %}
                  {% set alarm = true %}
                {% endif %}
              {% elif not health.fault and not force and not (ns.i > 0 and old_status in ['verify','waiting','running','limited','suspended','timeout']) %}
                {% set ns.s = 'degraded' %}
                {% set ns.reason = 'Some entities are failing, but the reload conditions are not met yet.' %}
              {% elif ns.i >= max_attempts %}
                {% set ns.s = 'suspended' %}
                {% set ns.reason = 'The maximum number of attempts for this failure is reached. Reloads are suspended until a lasting recovery or a manual reset.' %}
                {% set alarm = true %}
              {% elif not interventions_allowed %}
                {% set ns.s = 'observation' if observation_only else 'paused' %}
                {% set ns.reason = 'Observation only; no new reload request.' if observation_only else 'Interventions suspended by the extra conditions.' %}
              {% elif ns.a | count >= max_daily %}
                {% set ns.s = 'limited' %}
                {% set ns.n = (ns.a | min) + 86400 %}
                {% set ns.reason = 'The maximum number of attempts over the last 24 hours is reached. Reloads will resume when this limit allows it.' %}
                {% set alarm = true %}
              {% elif now_ts < ns.n %}
                {% set ns.s = 'waiting' %}
                {% set ns.reason = 'Pause before the next allowed request.' %}
              {% elif old_status not in ['waiting','limited','suspended','verify'] and ns.i == 0 and row.get('stagger_seconds',0) > 0 %}
                {% set ns.s = 'waiting' %}
                {% set ns.n = now_ts + row.get('stagger_seconds',0) %}
                {% set ns.reason = 'Initial offset between integrations.' %}
              {% else %}
                {% set ns.s = 'running' %}
                {% set ns.p = reservation_ts %}
                {% set ns.f = 0 %}
                {% set ns.reload = true %}
                {% set ns.reason = 'Resuming the interrupted reload: the integration stayed unloaded.' if force else 'Reloading the integration. The attempt is counted when it starts.' %}
              {% endif %}
            {% endif %}
            {% if alarm and old_notice != ns.s %}{% set ns.notice = 'failure' %}{% endif %}
            {% set data = {'v':3,'o':owner_id,'e':entry_key,'a':ns.a,'i':ns.i,'n':ns.n,'p':ns.p,'f':ns.f,'h':ns.h,'t':now_ts,'s':ns.s,'k':old_notice} %}
            {% set acknowledged = dict(data,k=(ns.s if ns.notice == 'failure' else '' if ns.notice == 'success' else old_notice)) %}
            {{ {'memory':data,'acknowledged':acknowledged,'reload':ns.reload,'force':force,'notice':ns.notice,'reason':ns.reason,'status':ns.s,'bad':health.bad,'attempts':ns.i,'daily':ns.a | count} }}
      - variables:
          memory_json: iw3:{{ plan.memory | to_json }}
          ack_json: iw3:{{ plan.acknowledged | to_json }}
      - if: '{{ memory_json | length > 255 or ack_json | length > 255 }}'
        then: *id001
      - variables:
          new_memory: '{{ memory_json }}'
      - if: '{{ new_memory | length > 255 }}'
        then: *id001
      - if: '{{ states(memory_entity) != new_memory }}'
        then:
        - action: input_text.set_value
          target:
            entity_id: '{{ memory_entity }}'
          data:
            value: '{{ new_memory }}'
      - if: '{{ states(memory_entity) != new_memory }}'
        then: *id001
      - variables:
          integration_title: '{{ name }}'
          reason: '{{ plan.reason }}'
          attempts_used: '{{ plan.attempts }}'
          daily_attempts: '{{ plan.daily }}'
          failed_entities: '{{ plan.bad }}'
          status: '{{ plan.status }}'
      - if: '{{ plan.notice == ''failure'' }}'
        then:
        - sequence: !input 'failure_actions'
        else:
        - if: '{{ plan.notice == ''success'' }}'
          then:
          - sequence: !input 'success_actions'
      - if: '{{ plan.notice != ''none'' }}'
        then:
        - *id002
        - *id003
        - variables:
            new_memory: iw3:{{ dict(read.data, k=(status if plan.notice == 'failure' else '')) | to_json }}
        - if: '{{ new_memory | length > 255 }}'
          then: *id001
        - if: '{{ states(memory_entity) != new_memory }}'
          then:
          - action: input_text.set_value
            target:
              entity_id: '{{ memory_entity }}'
            data:
              value: '{{ new_memory }}'
        - if: '{{ states(memory_entity) != new_memory }}'
          then: *id001
      - if: '{{ logging_enabled and (detailed_logging or plan.reload or plan.notice != "none" or plan.status !=
          memory.s) }}'
        then:
        - if: '{{ logging_enabled }}'
          then:
          - action: logger.set_level
            continue_on_error: true
            data:
              integration_watchdog: '{{ ''debug'' if detailed_logging else ''info'' }}'
          - action: system_log.write
            continue_on_error: true
            data:
              logger: integration_watchdog
              level: '{{ ''warning'' if plan.notice == ''failure'' else ''debug'' if detailed_logging and plan.status
                == memory.s and not plan.reload else ''info'' }}'
              message: '{{ name }} [{{ entry_id }}]: {{ status }}; incident={{ attempts_used }}, 24h={{ daily_attempts
                }}. {{ reason }}'
      - if: '{{ plan.reload }}'
        then:
        - variables:
            admitted_at: '{{ as_timestamp(now()) | int }}'
            reservation: '{{ plan.memory.p }}'
        - variables:
            history: '{{ plan.memory.a | select(''gt'', admitted_at - 86400) | list }}'
            contenders: |-
              {% set mine = as_timestamp(states[memory_entity].last_updated) %}
              {% set ns = namespace(running=0, ahead=0, tie=false, conflict=false) %}
              {% for s in states.input_text %}
                {% if s.entity_id != memory_entity and s.state.startswith('iw3:') %}
                  {% set m = s.state[4:] | from_json({}) %}
                  {% set p = m.get('p', 0) if m is mapping else 0 %}
                  {% set f = m.get('f', 0) if m is mapping else 0 %}
                  {% if p is number and p > 0 and f is number and f <= 2 and admitted_at - p / 1000000 < 3600 %}
                    {% if m.get('e') == entry_key %}{% set ns.conflict = true %}
                    {% elif f > 0 %}{% set ns.running = ns.running + 1 %}
                    {% elif as_timestamp(s.last_updated) < mine %}{% set ns.ahead = ns.ahead + 1 %}
                    {% elif as_timestamp(s.last_updated) == mine %}{% set ns.tie = true %}
                    {% endif %}
                  {% endif %}
                {% endif %}
              {% endfor %}
              {{ {'running': ns.running, 'ahead': ns.ahead, 'tie': ns.tie, 'conflict': ns.conflict} }}
        - variables:
            admitted: '{{ not contenders.conflict and not contenders.tie and contenders.running + contenders.ahead
              < 50 and plan.memory.i < max_attempts and history | count < max_daily and (config_entry_attr(entry_id,''state'')
              == ''loaded'' or (plan.force and config_entry_attr(entry_id,''state'') == ''not_loaded'')) and config_entry_attr(entry_id,''disabled_by'')
              is none and not config_entry_attr(entry_id,''pref_disable_polling'') and issues is defined and (''homeassistant'',''config_entry_reauth_''
              ~ config_entry_attr(entry_id,''domain'') ~ ''_'' ~ entry_id) not in issues() }}'
        - if: '{{ admitted }}'
          then:
          - variables:
              new_memory: iw3:{{ dict(plan.memory, f=2, i=plan.memory.i + 1, a=history + [admitted_at]) | to_json
                }}
          - if: '{{ new_memory | length > 255 }}'
            then: *id001
          - if: '{{ states(memory_entity) != new_memory }}'
            then:
            - action: input_text.set_value
              target:
                entity_id: '{{ memory_entity }}'
              data:
                value: '{{ new_memory }}'
          - if: '{{ states(memory_entity) != new_memory }}'
            then: *id001
          else:
          - variables:
              new_memory: iw3:{{ dict(plan.memory, p=0, f=0, n=admitted_at + 60, s=('duplicate' if contenders.conflict
                else 'deferred')) | to_json }}
          - if: '{{ new_memory | length > 255 }}'
            then: *id001
          - if: '{{ states(memory_entity) != new_memory }}'
            then:
            - action: input_text.set_value
              target:
                entity_id: '{{ memory_entity }}'
              data:
                value: '{{ new_memory }}'
          - if: '{{ states(memory_entity) != new_memory }}'
            then: *id001
          - if: '{{ logging_enabled }}'
            then:
            - action: logger.set_level
              continue_on_error: true
              data:
                integration_watchdog: '{{ ''debug'' if detailed_logging else ''info'' }}'
            - action: system_log.write
              continue_on_error: true
              data:
                logger: integration_watchdog
                level: info
                message: '{{ name }} [{{ entry_id }}]: reload postponed by one minute ({{ ''another watchdog of
                  this integration'' if contenders.conflict else ''limit of simultaneous reloads reached'' }}).'
        - if: '{{ admitted }}'
          then:
          - parallel:
            - sequence:
              - variables:
                  reload_started: '{{ as_timestamp(now()) }}'
              - if: '{{ (config_entry_attr(entry_id,''state'') == ''loaded'' or (plan.force and config_entry_attr(entry_id,''state'')
                  == ''not_loaded'')) and config_entry_attr(entry_id,''disabled_by'') is none and not config_entry_attr(entry_id,''pref_disable_polling'')
                  and issues is defined and (''homeassistant'',''config_entry_reauth_'' ~ config_entry_attr(entry_id,''domain'')
                  ~ ''_'' ~ entry_id) not in issues() }}'
                then:
                - action: homeassistant.reload_config_entry
                  continue_on_error: true
                  data:
                    entry_id: '{{ entry_id }}'
              - variables:
                  finished_at: '{{ as_timestamp(now()) | round(0, ''ceil'') | int }}'
                  timed_out: '{{ as_timestamp(now()) - reload_started >= reload_timeout }}'
                  current: '{{ states(memory_entity)[4:] | from_json({}) if states(memory_entity).startswith(''iw3:'')
                    else {} }}'
              - if: '{{ current is mapping and current.get(''p'') == reservation and current.get(''f'') == 2 }}'
                then:
                - variables:
                    new_memory: iw3:{{ dict(current, f=finished_at, k=('timeout' if timed_out else current.k)) |
                      to_json }}
                - if: '{{ new_memory | length > 255 }}'
                  then: *id001
                - if: '{{ states(memory_entity) != new_memory }}'
                  then:
                  - action: input_text.set_value
                    target:
                      entity_id: '{{ memory_entity }}'
                    data:
                      value: '{{ new_memory }}'
                - if: '{{ states(memory_entity) != new_memory }}'
                  then: *id001
            - sequence:
              - wait_template: '{% set c = states(memory_entity)[4:] | from_json({}) if states(memory_entity).startswith(''iw3:'')
                  else {} %}{{ c is not mapping or c.get(''p'') != reservation or c.get(''f'', 0) > 2 }}'
                timeout: '{{ reload_timeout }}'
                continue_on_timeout: true
              - if: '{{ not wait.completed }}'
                then:
                - variables:
                    status: timeout
                    reason: The reload has been running for more than {{ reload_timeout }} seconds. It is not cancelled;
                      watching resumes when it ends. Check the traces and the logs of the integration.
                    integration_title: '{{ name }}'
                    attempts_used: '{{ plan.attempts + 1 }}'
                    daily_attempts: '{{ plan.daily + 1 }}'
                    failed_entities: '{{ plan.bad }}'
                - sequence: !input 'failure_actions'
                - if: '{{ logging_enabled }}'
                  then:
                  - action: logger.set_level
                    continue_on_error: true
                    data:
                      integration_watchdog: '{{ ''debug'' if detailed_logging else ''info'' }}'
                  - action: system_log.write
                    continue_on_error: true
                    data:
                      logger: integration_watchdog
                      level: warning
                      message: '{{ name }} [{{ entry_id }}]: reload not finished after {{ reload_timeout }} s.'
