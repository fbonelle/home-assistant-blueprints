# Generated by tools/build_notifications.py; edit src/notification_system/.
blueprint:
  name: Notifications — Mobile relay — 2026.11.3.1
  description: 'Forwards to the dispatcher every persistent notification created by Home Assistant or an integration,
    with a level deduced from the title, and clears the notification on the phone when it is dismissed in Home Assistant.
    Notifications whose identifier starts with a chosen prefix can be ignored, or dismissed as soon as they appear
    without ever reaching the phone. Guide: https://github.com/fbonelle/home-assistant-blueprints/blob/main/docs/notification_system.en.md'
  domain: automation
  homeassistant:
    min_version: 2026.8.0
  source_url: https://github.com/fbonelle/home-assistant-blueprints/blob/main/blueprints/automation/notification_system/mobile_relay.yaml
  author: fbonelle
  input:
    delivery:
      name: Delivery
      input:
        dispatcher_script:
          name: Notification dispatcher
          description: Script created from the « Notifications — Dispatcher » blueprint.
          selector:
            entity:
              filter:
              - domain: script
        target:
          name: Recipient
          description: « all » for the whole family, « main » for the main phone.
          default: main
          selector:
            select:
              options:
              - main
              - all
        clear_service:
          name: Notification action used for clearing
          description: notify action of the mobile app that receives the order to clear a notification dismissed
            in Home Assistant, for example notify.mobile_app_my_phone. Leave empty to clear nothing on the phone.
          default: ''
          selector:
            text: {}
    filters:
      name: Filters
      input:
        ignored_prefixes:
          name: Prefixes never forwarded
          description: Notifications whose identifier starts with one of these prefixes stay in Home Assistant without
            being sent. The dispatcher's notifications (sys_disp_) are always ignored, which prevents any loop.
          default: []
          selector:
            text:
              multiple: true
        dismissed_prefixes:
          name: Prefixes dismissed automatically
          description: 'Notifications whose identifier starts with one of these prefixes are dismissed as soon as
            they appear and are never sent to the phone. Example: capfile_energy_manual_.'
          default: []
          selector:
            text:
              multiple: true
    levels:
      name: Level deduced from the title
      input:
        critical_markers:
          name: « critical » level markers
          description: A title containing one of these texts is sent as « critical ».
          default:
          - 🚨
          - Emergency
          - Failure
          selector:
            text:
              multiple: true
        warning_markers:
          name: « warning » level markers
          default:
          - ⚠️
          - Alert
          selector:
            text:
              multiple: true
        technical_markers:
          name: « technical » level markers
          description: Other titles are sent as « info ».
          default:
          - 🔧
          - 📡
          - 🔴
          - 🟢
          selector:
            text:
              multiple: true
mode: queued
max: 30
max_exceeded: warning
variables:
  dispatcher_script: !input 'dispatcher_script'
  target: !input 'target'
  clear_service: !input 'clear_service'
  ignored_prefixes: !input 'ignored_prefixes'
  dismissed_prefixes: !input 'dismissed_prefixes'
  critical_markers: !input 'critical_markers'
  warning_markers: !input 'warning_markers'
  technical_markers: !input 'technical_markers'
  notification_id: '{{ trigger.notification.notification_id | default('''', true) | string | trim }}'
  own_notification: '{{ notification_id.startswith(''sys_disp_'') }}'
  auto_dismissed: |
    {% set ns = namespace(hit=false) %} {% for p in dismissed_prefixes | default([], true) %}
      {% if p is string and p != '' and notification_id.startswith(p) %}{% set ns.hit = true %}{% endif %}
    {% endfor %} {{ ns.hit }}
  ignored: |
    {% set ns = namespace(hit=false) %} {% for p in ignored_prefixes | default([], true) %}
      {% if p is string and p != '' and notification_id.startswith(p) %}{% set ns.hit = true %}{% endif %}
    {% endfor %} {{ ns.hit }}
triggers:
- trigger: persistent_notification
  update_type:
  - added
  - updated
  id: relay
- trigger: persistent_notification
  update_type:
  - removed
  id: removed
actions:
- choose:
  - conditions:
    - condition: template
      value_template: '{{ trigger.id == ''relay'' and auto_dismissed }}'
    sequence:
    - action: persistent_notification.dismiss
      data:
        notification_id: '{{ notification_id }}'
  - conditions:
    - condition: template
      value_template: |
        {{ trigger.id == 'relay' and not own_notification and not ignored }}
    sequence:
    - variables:
        title_text: '{{ trigger.notification.title | default('''', true) | string }}'
        level: |
          {% if critical_markers | select('in', title_text) | list | count > 0 %}critical {% elif warning_markers | select('in', title_text) | list | count > 0 %}warning {% elif technical_markers | select('in', title_text) | list | count > 0 %}technical {% else %}info{% endif %}
    - action: '{{ dispatcher_script }}'
      data:
        title: '{{ trigger.notification.title | default(''System alert'', true) }}'
        message: '{{ trigger.notification.message | default(''No details given.'', true) }}'
        target: '{{ target }}'
        level: '{{ level }}'
        data:
          skip_trace: true
          notif_id: '{{ notification_id }}'
  - conditions:
    - condition: template
      value_template: |
        {{ trigger.id == 'removed' and not auto_dismissed
           and clear_service | default('') | string | trim != '' }}
    sequence:
    - action: '{{ clear_service }}'
      continue_on_error: true
      data:
        message: clear_notification
        data:
          tag: |
            {% if notification_id in ['', 'None'] %}sys_unknown {% elif notification_id.startswith('sys_disp_') %}{{ notification_id }} {% else %}sys_disp_{{ notification_id }}{% endif %}
