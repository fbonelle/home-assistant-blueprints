conditions:
- condition: template
  value_template: |-
    {% if trigger is not defined or trigger.id is not defined or trigger.id is none %}true {% elif trigger.id == 'tick' %}
      {% set raw=states(memory_entity) %}
      {% set m=raw[4:]|from_json({}) if raw.startswith('sl1:') else {} %}
      {{ m is mapping and m.get('h') in ['up','down'] }}
    {% elif trigger.id in ['reset','capabilities'] %}true {% elif trigger.id == 'availability' %}
      {{ trigger.from_state is none or trigger.to_state is none or
         trigger.from_state.state in ['unavailable','unknown'] or trigger.to_state.state in ['unavailable','unknown'] }}
    {% elif trigger.id == 'remote' and trigger.event is defined %}
      {{ trigger.event.data.get('command') in
      ['on','off','move','move_with_on_off','stop','stop_with_on_off','press','hold','release'] }}
    {% else %}false{% endif %}
actions:
- variables:
    clock: '{{ as_timestamp(now()) }}'
    owner: '{{ sha256(this.entity_id ~ ":" ~ remote ~ ":" ~ lamp)[:16] }}'
    palette_key: '{{ sha256(palette | to_json)[:8] }}'
    raw: '{{ states(memory_entity) }}'
    command: |
      {# Ignore unrecognized commands before they can cancel a valid hold. #}
      {% if trigger is not defined or trigger.id is not defined or trigger.id is none %}check
      {% elif trigger.id in ['tick','reset','capabilities'] %}{{ trigger.id }}
      {% elif trigger.id == 'availability' %}capabilities
      {% elif trigger.id != 'remote' %}invalid
      {% else %}
       {% set e=trigger.event.data %}{% set c=e.get('command','') %}
       {% set a=e.get('args',[]) %}
       {% set a=a if a is sequence and a is not string and a is not mapping else [] %}
       {% if c in ['on','off'] %}{{ c }}
       {% elif c in ['stop','stop_with_on_off','release'] %}release
       {% elif c == 'move_with_on_off' and a|count > 0 and (a[0]|string in ['0','MoveMode.Up']) %}up_hold
       {% elif c == 'move' and a|count > 0 and (a[0]|string in ['1','MoveMode.Down']) %}down_hold
       {% elif c == 'press' and a|count > 0 and a[0] == 256 %}right
       {% elif c == 'press' and a|count > 0 and a[0] == 257 %}left
       {% elif c == 'hold' and a|count > 0 and a[0] == 3328 %}right_hold
       {% elif c == 'hold' and a|count > 0 and a[0] == 3329 %}left_hold
       {% else %}invalid{% endif %}
      {% endif %}
- if: '{{ command == ''invalid'' }}'
  then:
  - stop: Événement sans action reconnue.
- variables:
    check: |
      {% set ns=namespace(errors=[]) %}
      {% if not lamp.startswith('light.') or not remote %}
       {% set ns.errors=ns.errors+['Choisir une lampe et une télécommande.'] %}
      {% endif %}
      {% if not memory_entity.startswith('input_text.') or states[memory_entity] is none or raw == 'unavailable'
       or state_attr(memory_entity,'min') != 0 or state_attr(memory_entity,'max') != 255 %}
       {% set ns.errors=ns.errors+['Créer un assistant Texte distinct, de longueur minimale 0 et maximale 255.'] %}
      {% endif %}
      {% if palette is not sequence or palette is string or palette is mapping or palette|count == 0
       or palette|count > catalog|count %}
       {% set ns.errors=ns.errors+['La palette doit être une liste non vide sans doublons.'] %}
      {% else %}
       {% for key in palette %}{% if key is not string or key not in catalog %}
        {% set ns.errors=ns.errors+['La palette contient un préréglage inconnu.'] %}
       {% elif key in palette[:loop.index0] %}
        {% set ns.errors=ns.errors+['La palette contient des doublons.'] %}
       {% endif %}{% endfor %}
      {% endif %}
      {% if default_color is not sequence or default_color is string or default_color|count != 3 %}
       {% set ns.errors=ns.errors+['La couleur de rappel doit contenir trois composantes RGB.'] %}
      {% else %}{% for v in default_color %}
       {% if v is not number or v is boolean or not 0 <= v <= 255 or v != v|int %}
        {% set ns.errors=ns.errors+['Chaque composante RGB doit être un entier de 0 à 255.'] %}
       {% endif %}{% endfor %}
       {% if default_color|select('number')|list|count == 3 and default_color|sum == 0 %}
        {% set ns.errors=ns.errors+['Choisir une couleur de rappel lumineuse, différente du noir.'] %}
       {% endif %}
      {% endif %}
      {% for value,lower,upper in [(brightness_step,1,25),(min_brightness,1,100),(max_brightness,1,100),
       (on_brightness,0,100),(dim_interval,1,5),(hold_limit,2,30),(transition,0,2),
       (double_press_ms,250,1500),(debounce_ms,0,200)] %}
       {% if value is not number or value is boolean or not lower <= value <= upper %}
        {% set ns.errors=ns.errors+['Un réglage numérique dépasse ses limites.'] %}
       {% endif %}
      {% endfor %}
      {% if (min_brightness is number and max_brightness is number and min_brightness > max_brightness) or
       (debounce_ms is number and double_press_ms is number and debounce_ms >= double_press_ms) or
       recall_fallback not in ['right_hold','left_hold','none'] or
       colors_turn_on is not boolean or recall_turns_on is not boolean or logging is not boolean or smooth_dimming is not boolean %}
       {% set ns.errors=ns.errors+['Les réglages de variation ou de rappel sont incohérents.'] %}
      {% endif %}
      {% if raw not in ['','unknown'] %}
       {% set m=raw[4:]|from_json(none) if raw.startswith('sl1:') else none %}
       {% if m is not mapping or m.get('v') is not integer or m.v != 1 or m.get('o') != owner %}
        {% set ns.errors=ns.errors+['L’assistant Texte est illisible ou appartient à une autre automatisation. Ne pas le partager.'] %}
       {% else %}
        {% if m.keys()|reject('eq','f')|list|sort != ['c','h','i','k','o','p','s','t','u','v','x'] or
         m.get('c') not in ['','on','off','left','right','up_hold','down_hold','left_hold','right_hold','release','paired'] or
         m.get('h') not in ['','up','down'] or m.get('i') is not integer or not -1 <= m.i < catalog|count or
         m.get('k') is not string or m.k|length not in [0,8] or m.get('p') is not string or m.p|length not in [0,8] %}
         {% set ns.errors=ns.errors+['L’état des boutons est invalide ; vider cet assistant lorsque l’automatisation est arrêtée.'] %}
        {% endif %}
        {% for k in ['t','s','u'] %}
         {% set v=m.get(k) %}
         {% if v is not number or v is boolean or not 0 <= v <= 7258118400 %}
          {% set ns.errors=ns.errors+['Horodatage invalide dans l’assistant Texte.'] %}
         {% endif %}
        {% endfor %}
        {% set x=m.get('x') %}
        {% if x is not sequence or x is string or x is mapping or x|count not in [0,2] %}
         {% set ns.errors=ns.errors+['Coordonnées de couleur invalides dans l’assistant Texte.'] %}
        {% else %}{% for value in x %}{% if value is not number or value is boolean or not 0 <= value <= 1 %}
         {% set ns.errors=ns.errors+['Coordonnées de couleur invalides dans l’assistant Texte.'] %}
        {% endif %}{% endfor %}{% endif %}
        {% set f=m.get('f',[]) %}
        {% if f is not sequence or f is string or f is mapping or f|count not in [0,4] %}
         {% set ns.errors=ns.errors+['Le fondu mémorisé est invalide.'] %}
        {% elif f|count == 4 %}
         {% for value,lower,upper in [(f[0],0,100),(f[1],0,100),(f[2],0,7258118400),(f[3],0.001,6)] %}
          {% if value is not number or value is boolean or not lower <= value <= upper %}
           {% set ns.errors=ns.errors+['Le fondu mémorisé est invalide.'] %}
          {% endif %}
         {% endfor %}
        {% endif %}
       {% endif %}
      {% endif %}
      {{ ns.errors|unique|list }}
    capabilities: |
      {# Capabilities are metadata, never a claim that a physical command was tested. #}
      {% set raw_modes=state_attr(lamp,'supported_color_modes') %}
      {% set valid=raw_modes is sequence and raw_modes is not string and raw_modes is not mapping %}
      {% set modes=raw_modes|list if valid else [] %}
      {% set colors=modes|select('in',['xy','hs','rgb','rgbw','rgbww'])|list|count > 0 %}
      {% set brightness=modes|select('in',['brightness','color_temp','xy','hs','rgb','rgbw','rgbww','white'])|list|count > 0 %}
      {% set online=states(lamp) in ['on','off'] and not state_attr(lamp,'restored') %}
      {% set features=state_attr(lamp,'supported_features')|int(0) %}
      {% set lo=state_attr(lamp,'min_color_temp_kelvin') %}{% set hi=state_attr(lamp,'max_color_temp_kelvin') %}
      {% set ct='color_temp' in modes %}
      {% set range_ok=ct and lo is number and hi is number and lo is not boolean and hi is not boolean and 0 < lo <= hi < 100000 %}
      {% set ns=namespace(errors=[]) %}
      {% if not online %}{% set ns.errors=ns.errors+['Lampe indisponible : contrôle en attente de sa connexion.'] %}
      {% elif not valid or modes|count == 0 %}{% set ns.errors=ns.errors+['Home Assistant ne fournit pas les capacités de cette lampe.'] %}
      {% else %}
       {% if not brightness %}{% set ns.errors=ns.errors+['Cette lampe ne déclare pas de variation de luminosité.'] %}{% endif %}
       {% if not colors %}{% set ns.errors=ns.errors+['Cette lampe ne déclare pas les couleurs nécessaires à la palette et au rappel RGB.'] %}{% endif %}
      {% endif %}
      {{ dict(online=online,modes=modes,color=colors,brightness=brightness,
       preset_white=colors,white_channel=('white' in modes or 'rgbw' in modes or 'rgbww' in modes),
       color_temperature=ct,temperature_range=([lo,hi] if range_ok else []),
       transition=(features|bitwise_and(32) != 0),errors=ns.errors) }}
    diagnostic_id: '{{ "styrbar_capabilities_" ~ sha256(this.entity_id)[:16] }}'
    diagnostic: |
      {% set c=capabilities %}
      {% if check or c.errors %}**Contrôle en attente ou configuration incompatible.**
      {% else %}**Configuration compatible avec les capacités déclarées.**
      {% endif %}

      Lampe : {{ state_attr(lamp,'friendly_name') or lamp }} (`{{ lamp }}`).

      - Communication : {{ 'joignable' if c.online else 'indisponible' }}.
      - Variation de luminosité : {{ 'oui' if c.brightness else 'non déclarée' }}.
      - Couleurs : {{ 'oui' if c.color else 'non déclarées' }}.
      - Blancs de la palette : {{ 'oui, via le mode couleur' if c.preset_white else 'non disponibles avec cette palette RGB/xy' }}.
      - Canal blanc distinct : {{ 'déclaré' if c.white_channel else 'non déclaré' }}.
      - Température de blanc native : {{ ('oui, de ' ~ c.temperature_range[0] ~ ' à ' ~ c.temperature_range[1] ~ ' K') if c.temperature_range else 'déclarée, plage inconnue' if c.color_temperature else 'non déclarée' }}.
      - Fondus de transition : {{ 'oui' if c.transition else 'non déclarés ; variation par pas' }}.
      - Modes Home Assistant : {{ c.modes|join(', ') if c.modes else 'inconnus' }}.
      {% for error in check + c.errors %}
      - **{{ error }}**
      {% endfor %}

      Contrôle des informations fournies par Home Assistant ; aucune commande d’éclairage n’a été envoyée par ce diagnostic.
      Un blanc obtenu en mode couleur ne prouve pas la présence d’un canal blanc dédié. Le rendu et la réception radio ne sont pas testés.
- if: '{{ check | count > 0 }}'
  then:
  - if: '{{ command != ''tick'' }}'
    then:
    - action: persistent_notification.create
      data:
        notification_id: '{{ diagnostic_id }}'
        title: Compatibilité de la lampe STYRBAR
        message: '{{ diagnostic }}'
    - action: system_log.write
      data:
        logger: ikea_styrbar_light
        level: warning
        message: '{{ this.entity_id }} : {{ check | join(" ") }}'
  - stop: Configuration invalide ; aucune commande de lampe envoyée.
- variables:
    m: |
      {% set m=raw[4:]|from_json({}) if raw.startswith('sl1:') else
         dict(v=1,o=owner,c='',t=0,h='',s=0,u=0,i=-1,x=[],k='',p='') %}
      {% set m=dict(m,f=m.get('f',[])) %}
      {# Wall-clock correction invalidates only transient gestures; never replay one. #}
      {{ dict(m,c='',t=0,h='',s=0,u=0,f=[]) if m.t > clock + 1 or m.s > clock + 1 or m.u > clock + 6
       or (m.f|count == 4 and m.f[2] > clock + 1) else m }}
- if: '{{ capabilities.errors | count > 0 }}'
  then:
  - action: input_text.set_value
    target:
      entity_id: '{{ memory_entity }}'
    data:
      value: sl1:{{ dict(m,h="",s=0,u=0,f=[]) | to_json }}
  - if: '{{ command != ''tick'' }}'
    then:
    - action: persistent_notification.create
      data:
        notification_id: '{{ diagnostic_id }}'
        title: Compatibilité de la lampe STYRBAR
        message: '{{ diagnostic }}'
    - action: system_log.write
      data:
        logger: ikea_styrbar_light
        level: '{{ "warning" if capabilities.online else "info" }}'
        message: '{{ this.entity_id }} : {{ capabilities.errors | join(" ") }}'
  - stop: Contrôle des capacités non concluant ; aucune commande de lampe envoyée.
- if: '{{ command == ''check'' }}'
  then:
  - action: persistent_notification.create
    data:
      notification_id: '{{ diagnostic_id }}'
      title: Compatibilité de la lampe STYRBAR
      message: '{{ diagnostic }}'
  - stop: Diagnostic affiché ; lampe inchangée.
- if: '{{ command in [''reset'',''capabilities''] }}'
  then:
  - action: input_text.set_value
    target:
      entity_id: '{{ memory_entity }}'
    data:
      value: sl1:{{ dict(m,c="",t=0,h="",s=0,u=0,f=[]) | to_json }}
  - action: persistent_notification.dismiss
    data:
      notification_id: '{{ diagnostic_id }}'
  - stop: Gestes en cours annulés ; couleur et luminosité inchangées.
- variables:
    event_time: '{{ as_timestamp(trigger.event.time_fired) if command != "tick" else clock }}'
- if: |-
    {{ command != 'tick' and (event_time < m.t or event_time > clock + 1 or
       (command != 'release' and clock - event_time > 5) or
       (m.c == command and 0 <= event_time - m.t < debounce_ms / 1000)) }}
  then:
  - stop: Événement ancien, désordonné ou doublon ignoré.
- if: |-
    {{ command in ['up_hold','down_hold','left_hold','right_hold'] and m.c == command
       and m.s > 0 }}
  then:
  - action: input_text.set_value
    target:
      entity_id: '{{ memory_entity }}'
    data:
      value: sl1:{{ dict(m,t=event_time) | to_json }}
  - stop: Paquet de maintien répété ; durée et prochain pas conservés.
- variables:
    frame_active: |-
      {{ m.f|count == 4 and capabilities.transition and is_state(lamp,'on') and
         m.f[2] <= clock < m.f[2]+m.f[3] and state_attr(lamp,'brightness') is number and
         ((state_attr(lamp,'brightness')/255*100)-m.f[1])|abs < 0.6 and
         sha256(states[lamp].context.id)[:8] == m.k }}
    current_level: |-
      {{ (m.f[0]+(m.f[1]-m.f[0])*(clock-m.f[2])/m.f[3])|round(3) if frame_active
         else state_attr(lamp,'brightness')|float(0)/255*100 }}
- variables:
    operation: '{% if command == ''tick'' %}dim {% elif command in [''up_hold'',''down_hold''] %}dim {% elif command
      == ''on'' and m.c == ''on'' and 0 < event_time - m.t <= double_press_ms / 1000 %}recall {% elif command ==
      recall_fallback and command in [''left_hold'',''right_hold''] %}recall {% elif command == ''left'' %}previous
      {% elif command == ''right'' %}next {% elif command == ''release'' and frame_active %}freeze {% elif command
      in [''on'',''off''] %}{{ command }} {% else %}none{% endif %}'
    direction: '{{ m.h if command == ''tick'' else ''up'' if command == ''up_hold'' else ''down'' if command ==
      ''down_hold'' else '''' }}'
    hold_started: |-
      {{ m.s if command == 'tick'
         else event_time if command in ['up_hold','down_hold','left_hold','right_hold'] else 0 }}
    enabled_since: '{% set stamp=as_timestamp(this.last_changed,0) %} {{ stamp if stamp <= clock + 1 else 0 }}'
- if: '{{ command == ''tick'' and direction not in [''up'',''down''] }}'
  then:
  - action: input_text.set_value
    target:
      entity_id: '{{ memory_entity }}'
    data:
      value: sl1:{{ m | to_json }}
  - stop: Ancien geste annulé après une correction d’horloge.
- if: |-
    {{ command == 'tick' and clock < m.u - 0.05 and clock >= hold_started and
       clock - hold_started < hold_limit and hold_started >= enabled_since }}
  then:
  - stop: Aucun pas de variation à exécuter.
- variables:
    updated: |-
      {{ dict(m,h='',c=(m.c if command == 'tick' else 'paired' if operation == 'recall' and command == 'on' else command),
         t=(m.t if command == 'tick' else event_time),s=hold_started,u=0,f=[]) }}
- action: input_text.set_value
  target:
    entity_id: '{{ memory_entity }}'
  data:
    value: sl1:{{ updated | to_json }}
- if: |-
    {{ operation == 'none' or states(lamp) not in ['on','off'] or
       (operation == 'freeze' and not is_state(lamp,'on')) or
       (operation == 'dim' and (hold_started < enabled_since or clock - hold_started >= hold_limit or
                               clock < hold_started or (is_state(lamp,'off') and (command == 'tick' or direction == 'down')))) or
       (operation in ['next','previous'] and not colors_turn_on and is_state(lamp,'off')) or
       (operation == 'recall' and not recall_turns_on and is_state(lamp,'off')) }}
  then:
  - stop: Geste terminé, maintien expiré ou lampe indisponible ; aucune commande différée.
- variables:
    selected_index: -1
    keep_hold: false
    next_deadline: 0
    new_frame: []
    stop_effect: |-
      {{ dict(effect='off') if state_attr(lamp,'effect') not in [none,'off'] and
         'off' in (state_attr(lamp,'effect_list') or []) else {} }}
    color_options: '{% set options=dict(stop_effect,brightness_pct=current_level) if frame_active else stop_effect
      %} {{ dict(options,transition=transition) if capabilities.transition else options }}'
- choose:
  - conditions: '{{ operation == ''freeze'' }}'
    sequence:
    - action: light.turn_on
      target:
        entity_id: '{{ lamp }}'
      data: '{{ dict(brightness_pct=current_level,transition=0) }}'
  - conditions: '{{ operation == ''off'' }}'
    sequence:
    - action: light.turn_off
      target:
        entity_id: '{{ lamp }}'
  - conditions: '{{ operation == ''on'' }}'
    sequence:
    - action: light.turn_on
      target:
        entity_id: '{{ lamp }}'
      data: |-
        {{ dict(brightness_pct=on_brightness) if on_brightness > 0 else
           dict(brightness_pct=current_level,transition=0) if frame_active else {} }}
  - conditions: '{{ operation == ''recall'' }}'
    sequence:
    - action: light.turn_on
      target:
        entity_id: '{{ lamp }}'
      data: '{{ dict(color_options,rgb_color=default_color) }}'
  - conditions: '{{ operation in [''next'',''previous''] }}'
    sequence:
    - variables:
        selected_index: |
          {# Prefer the successful previous selection only while both actual color and context still agree.
             An external change invalidates that cursor; continue from the closest actual xy color. #}
          {% set xy=state_attr(lamp,'xy_color') %}
          {% set valid=xy is sequence and xy is not string and xy|count == 2 and xy[0] is number and xy[1] is number %}
          {% set ns=namespace(index=-1,distance=999) %}
          {% if valid and m.p == palette_key and 0 <= m.i < palette|count and [xy[0]|round(6),xy[1]|round(6)] == m.x
           and sha256(states[lamp].context.id)[:8] == m.k %}
           {% set ns.index=m.i %}
          {% elif valid %}
           {% for key in palette %}
            {% set x=catalog[key].xy %}{% set distance=(xy[0]-x[0])**2 + (xy[1]-x[1])**2 %}
            {% if distance < ns.distance %}{% set ns.index=loop.index0 %}{% set ns.distance=distance %}{% endif %}
           {% endfor %}
          {% endif %}
          {{ (ns.index + 1) % (palette|count) if operation == 'next'
           else ((ns.index - 1) % (palette|count) if ns.index >= 0 else palette|count - 1) }}
        color: '{{ catalog[palette[selected_index]] }}'
    - action: light.turn_on
      target:
        entity_id: '{{ lamp }}'
      data: |-
        {{ dict(color_options,rgb_color=color.rgb_color) if 'rgb_color' in color
           else dict(color_options,xy_color=color.xy_color) }}
  - conditions: '{{ operation == ''dim'' }}'
    sequence:
    - if: '{{ is_state(lamp,''on'') and state_attr(lamp,''brightness'') is not number }}'
      then:
      - stop: Luminosité inconnue ; variation annulée.
    - variables:
        old_level: '{{ current_level }}'
        next_deadline: '{% set end=[clock|round(0,''floor'')+dim_interval,hold_started+hold_limit]|min %} {{ [end+dim_interval,hold_started+hold_limit]|min
          if end-clock < 0.05 else end }}'
        fade_duration: |-
          {{ ([0,([dim_interval,hold_started+hold_limit-clock]|min)]|max)|round(3) if smooth_dimming and capabilities.transition and
             is_state(lamp,'on') else 0 }}
        new_level: |-
          {{ min_brightness if is_state(lamp,'off') else
             ([min_brightness, old_level + (brightness_step if direction == 'up' else -brightness_step)*
               (fade_duration/dim_interval if fade_duration > 0 else 1), max_brightness] | sort)[1] | round(3) }}
        keep_hold: |-
          {{ fade_duration > 0 or (direction == 'up' and new_level < max_brightness) or
             (direction == 'down' and new_level > min_brightness) }}
        new_frame: '{{ [old_level|round(3),new_level,clock,fade_duration] if fade_duration > 0 else [] }}'
    - if: '{{ is_state(lamp,''on'') and (new_level-old_level)|abs < 0.01 }}'
      then:
      - stop: Butée de luminosité atteinte ; maintien terminé.
    - action: light.turn_on
      target:
        entity_id: '{{ lamp }}'
      data: |-
        {{ dict(brightness_pct=new_level,transition=fade_duration) if capabilities.transition
           else dict(brightness_pct=new_level) }}
- variables:
    actual_xy: '{{ state_attr(lamp,"xy_color") }}'
    observed_xy: |-
      {{ [actual_xy[0]|round(6),actual_xy[1]|round(6)] if actual_xy is sequence and
         actual_xy is not string and actual_xy|count == 2 else [] }}
    cursor: |-
      {{ selected_index if operation in ['next','previous'] else m.i
         if operation in ['dim','freeze','on','off'] and m.p == palette_key and observed_xy == m.x else -1 }}
    completed: |-
      {{ dict(updated,h=(direction if keep_hold else ''),u=(next_deadline|round(3) if keep_hold else 0),f=new_frame,
         i=cursor,p=palette_key,x=observed_xy,
         k=sha256(states[lamp].context.id)[:8]) }}
- action: input_text.set_value
  target:
    entity_id: '{{ memory_entity }}'
  data:
    value: sl1:{{ completed | to_json }}
- if: '{{ logging and command != "tick" }}'
  then:
  - action: system_log.write
    data:
      logger: ikea_styrbar_light
      level: info
      message: '{{ this.entity_id }} : {{ command }} → {{ operation }}.'
