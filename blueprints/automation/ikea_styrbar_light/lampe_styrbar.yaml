blueprint:
  name: Lampe avec télécommande IKEA STYRBAR — ZHA — 1.1.0
  description: 'Marche/arrêt, variation par maintien, palette de blancs Home Assistant et de couleurs IKEA, rappel
    d’une couleur configurable. Un assistant Texte distinct par automatisation (0 à 255 caractères). ZHA et STYRBAR
    uniquement ; lampe couleur requise. Le double appui en haut exige deux événements réellement transmis par la
    télécommande. Le maintien à droite sert aussi de rappel par défaut. Les capacités déclarées sont contrôlées
    à l’activation. Menu → Exécuter les actions affiche un diagnostic sans allumer la lampe. Les blancs en mode
    couleur ne nécessitent pas de mode color_temp. Guide : https://github.com/fbonelle/home-assistant-blueprints/blob/main/docs/ikea_styrbar_light.md'
  domain: automation
  homeassistant:
    min_version: 2026.10.0
  source_url: https://github.com/fbonelle/home-assistant-blueprints/blob/main/blueprints/automation/ikea_styrbar_light/lampe_styrbar.yaml
  input:
    remote:
      name: Télécommande STYRBAR
      selector:
        device:
          filter:
          - integration: zha
            manufacturer: IKEA of Sweden
            model: Remote Control N2
    light:
      name: Lampe couleur à piloter
      description: 'Les capacités sont vérifiées après enregistrement et avant toute commande. Utiliser Menu → Exécuter
        les actions pour consulter le diagnostic : luminosité, couleurs, blancs, température et transitions.'
      selector:
        entity:
          filter:
          - domain: light
    memory:
      name: Assistant Texte réservé à cette télécommande
      description: Longueur minimale 0, maximale 255. Ne pas partager cet assistant avec une autre automatisation.
      selector:
        entity:
          filter:
          - domain: input_text
    palette:
      name: Palette et ordre de défilement
      description: L’ordre de la liste sélectionnée est utilisé. Les trois premiers choix sont les blancs de référence
        de la capture Home Assistant, les suivants les préréglages IKEA. La liste peut aussi être réordonnée en
        YAML.
      default:
      - ha_warm
      - ha_soft
      - ha_white
      - ikea_amber
      - ikea_peach
      - ikea_dark_peach
      - ikea_dark_red
      - ikea_pink
      - ikea_light_pink
      - ikea_dark_pink
      - ikea_light_purple
      - ikea_dark_purple
      - ikea_blue
      - ikea_light_blue
      - ikea_lime
      - ikea_yellow
      selector:
        select:
          multiple: true
          sort: false
          options:
          - value: ha_warm
            label: Home Assistant — blanc chaud de référence
          - value: ha_soft
            label: Home Assistant — blanc intermédiaire de référence
          - value: ha_white
            label: Home Assistant — blanc clair de référence
          - value: ikea_cold_sky
            label: IKEA — ciel froid
          - value: ikea_cool_daylight
            label: IKEA — lumière du jour froide
          - value: ikea_cool_white
            label: IKEA — blanc froid
          - value: ikea_sunrise
            label: IKEA — lever de soleil
          - value: ikea_warm_white
            label: IKEA — blanc chaud
          - value: ikea_warm_glow
            label: IKEA — lueur chaude
          - value: ikea_candle
            label: IKEA — bougie
          - value: ikea_amber
            label: IKEA — ambre
          - value: ikea_peach
            label: IKEA — pêche
          - value: ikea_dark_peach
            label: IKEA — pêche foncée
          - value: ikea_dark_red
            label: IKEA — rouge foncé
          - value: ikea_pink
            label: IKEA — rose
          - value: ikea_light_pink
            label: IKEA — rose clair
          - value: ikea_dark_pink
            label: IKEA — rose foncé
          - value: ikea_light_purple
            label: IKEA — mauve clair
          - value: ikea_dark_purple
            label: IKEA — mauve foncé
          - value: ikea_blue
            label: IKEA — bleu
          - value: ikea_light_blue
            label: IKEA — bleu clair
          - value: ikea_lime
            label: IKEA — vert citron
          - value: ikea_yellow
            label: IKEA — jaune
    default_color:
      name: Couleur de rappel
      description: Par défaut, la pastille de gauche de la capture Home Assistant. La luminosité est conservée.
      default:
      - 255
      - 192
      - 140
      selector:
        color_rgb: {}
    double_press_ms:
      name: Délai maximal du double appui en haut
      description: Le premier appui allume immédiatement. Le second rappelle la couleur. Aucun logiciel ne peut
        détecter un second appui filtré par le micrologiciel ; utiliser alors le maintien à droite.
      default: 800
      selector:
        number:
          min: 250
          max: 1500
          step: 50
          unit_of_measurement: ms
          mode: box
    recall_fallback:
      name: Geste de rappel supplémentaire
      default: right_hold
      selector:
        select:
          options:
          - value: right_hold
            label: Maintien à droite
          - value: left_hold
            label: Maintien à gauche
          - value: none
            label: Aucun
    brightness_step:
      name: Pas de variation de luminosité
      default: 10
      selector:
        number:
          min: 1
          max: 25
          step: 1
          unit_of_measurement: '%'
          mode: box
    min_brightness:
      name: Luminosité minimale pendant la variation
      default: 1
      selector:
        number:
          min: 1
          max: 100
          step: 1
          unit_of_measurement: '%'
          mode: box
    max_brightness:
      name: Luminosité maximale pendant la variation
      default: 100
      selector:
        number:
          min: 1
          max: 100
          step: 1
          unit_of_measurement: '%'
          mode: box
    on_brightness:
      name: Luminosité imposée lors d’un appui simple en haut
      description: 0 conserve la luminosité mémorisée par la lampe. Le rappel de couleur ne force jamais cette valeur.
      default: 0
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: '%'
          mode: box
    dim_interval:
      name: Intervalle entre les pas de variation
      default: 1
      selector:
        number:
          min: 1
          max: 5
          step: 1
          unit_of_measurement: s
          mode: box
    hold_limit:
      name: Durée maximale d’un maintien
      description: Arrêt automatique si le relâchement radio est perdu. Un autre bouton arrête aussi la variation.
      default: 15
      selector:
        number:
          min: 2
          max: 30
          step: 1
          unit_of_measurement: s
          mode: box
    transition:
      name: Durée de transition des changements de couleur
      default: 0.3
      selector:
        number:
          min: 0
          max: 2
          step: 0.1
          unit_of_measurement: s
          mode: box
    smooth_dimming:
      name: Lisser la variation pendant un maintien
      description: Utilise les fondus natifs si la lampe les déclare. Le relâchement fige le niveau estimé atteint,
        car Home Assistant annonce souvent le niveau cible avant la fin du fondu.
      default: true
      selector:
        boolean: {}
    colors_turn_on:
      name: Les flèches de couleur peuvent allumer la lampe
      default: true
      selector:
        boolean: {}
    recall_turns_on:
      name: Le rappel de couleur peut allumer la lampe
      default: true
      selector:
        boolean: {}
    debounce_ms:
      name: Ignorer les événements identiques trop rapprochés
      description: 0 désactive ce filtre. Ne doit pas dépasser le délai de double appui.
      default: 50
      selector:
        number:
          min: 0
          max: 200
          step: 10
          unit_of_measurement: ms
          mode: box
    logging:
      name: Journaliser les boutons et les actions
      description: Niveau INFO, journal ikea_styrbar_light. Les erreurs restent signalées par Home Assistant.
      default: false
      selector:
        boolean: {}
mode: queued
max: 30
max_exceeded: warning
