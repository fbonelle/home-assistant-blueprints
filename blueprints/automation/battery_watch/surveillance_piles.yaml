# Generated by tools/build_battery.py; edit src/battery_watch/.
blueprint:
  name: Surveillance des piles et batteries — 1.0.0
  description: 'Signale tout de suite chaque pile ou batterie qui passe sous le seuil, chaque appareil devenu muet
    et chaque alerte « pile faible », puis envoie un récapitulatif à l’heure choisie. Téléphones, montres, ordinateurs
    et onduleurs sont exclus par défaut (intégrations mobile_app, icloud, icloud3, nut et fabricant Apple). Une
    liste de tâches locale réservée à cette automatisation, sans limite de taille, mémorise les appareils signalés
    : une pile n’est pas signalée à nouveau tant qu’elle n’a pas été remplacée. Cocher un élément de la liste le
    retire du récapitulatif jusqu’au remplacement. Menu → Exécuter les actions envoie le récapitulatif immédiatement.
    Guide : https://github.com/fbonelle/home-assistant-blueprints/blob/main/docs/battery_watch.md'
  domain: automation
  homeassistant:
    min_version: 2026.10.0
  source_url: https://github.com/fbonelle/home-assistant-blueprints/blob/main/blueprints/automation/battery_watch/surveillance_piles.yaml
  author: fbonelle
  input:
    detection:
      name: Détection
      input:
        memory:
          name: Liste de tâches réservée à cette automatisation
          description: 'Ajouter l’intégration « Liste de tâches locale » et créer une liste dédiée. Chaque appareil
            signalé y devient un élément, retiré automatiquement après remplacement de la pile. Cocher un élément
            indique que la pile est prise en compte : il quitte le récapitulatif, sans nouvelle alerte. Les éléments
            ajoutés à la main sont ignorés.'
          selector:
            entity:
              filter:
              - domain: todo
                integration: local_todo
        threshold:
          name: Seuil de pile faible
          description: Un niveau strictement inférieur à ce seuil déclenche une alerte.
          default: 20
          selector:
            number:
              min: 1
              max: 100
              step: 1
              unit_of_measurement: '%'
              mode: box
        recovery_margin:
          name: Marge de retour à la normale
          description: Un appareil signalé n’est considéré comme réparé qu’au-dessus du seuil plus cette marge.
            Évite de nouvelles alertes quand une pile oscille autour du seuil.
          default: 5
          selector:
            number:
              min: 0
              max: 50
              step: 1
              unit_of_measurement: '%'
              mode: box
        unavailable_hours:
          name: Délai avant de signaler un appareil muet
          description: Une pile vide rend souvent l’appareil indisponible au lieu d’annoncer un niveau bas. Au-delà
            de ce délai d’indisponibilité, l’appareil est signalé. Le délai écarte les coupures passagères d’une
            passerelle. 0 désactive cette règle.
          default: 6
          selector:
            number:
              min: 0
              max: 168
              step: 1
              unit_of_measurement: h
              mode: box
        include_binary:
          name: Prendre en compte les alertes « pile faible » des appareils
          description: Capteurs binaires de classe batterie, signalés lorsqu’ils passent à « on ».
          default: true
          selector:
            boolean: {}
        scan_minutes:
          name: Fréquence de vérification
          default: /5
          selector:
            select:
              options:
              - value: /1
                label: Toutes les minutes
              - value: /5
                label: Toutes les 5 minutes
              - value: /15
                label: Toutes les 15 minutes
              - value: /30
                label: Toutes les 30 minutes
    exclusions:
      name: Appareils exclus
      collapsed: true
      input:
        excluded_integrations:
          name: Intégrations exclues
          description: Leurs appareils sont rechargés au quotidien. Le domaine est lu sur la configuration de chaque
            entité, ce qui couvre aussi les entités qu’une intégration ne recense plus.
          default:
          - mobile_app
          - icloud
          - icloud3
          - nut
          selector:
            select:
              multiple: true
              custom_value: true
              options:
              - value: mobile_app
                label: Application mobile (mobile_app)
              - value: icloud
                label: Apple iCloud (icloud)
              - value: icloud3
                label: iCloud3 (icloud3)
              - value: nut
                label: Onduleurs NUT (nut)
        excluded_manufacturers:
          name: Fabricants exclus
          description: Comparaison sans tenir compte des majuscules.
          default:
          - Apple
          selector:
            select:
              multiple: true
              custom_value: true
              options:
              - Apple
        excluded_entities:
          name: Entités exclues
          default: []
          selector:
            entity:
              multiple: true
              filter:
              - domain:
                - sensor
                - binary_sensor
                device_class: battery
        excluded_devices:
          name: Appareils exclus
          default: []
          selector:
            device:
              multiple: true
        excluded_labels:
          name: Étiquettes exclues
          description: Les entités et appareils portant l’une de ces étiquettes sont ignorés.
          default: []
          selector:
            label:
              multiple: true
    notifications:
      name: Notifications
      input:
        immediate:
          name: Signaler immédiatement chaque nouvel appareil
          default: true
          selector:
            boolean: {}
        alert_actions:
          name: Actions d’alerte immédiate
          description: 'Exécutées lorsqu’au moins un appareil vient d’être détecté. Variables disponibles : battery_title,
            battery_message (nouveaux appareils, une ligne chacun), battery_new, battery_all (appareils non cochés)
            et battery_acknowledged (appareils cochés), listes de dictionnaires e, n, r, v, h ; battery_count.'
          default: []
          selector:
            action: {}
        summary_enabled:
          name: Envoyer un récapitulatif
          default: true
          selector:
            boolean: {}
        summary_time:
          name: Heure du récapitulatif
          default: 09:00:00
          selector:
            time: {}
        summary_weekdays:
          name: Jours du récapitulatif
          default:
          - mon
          - tue
          - wed
          - thu
          - fri
          - sat
          - sun
          selector:
            select:
              multiple: true
              options:
              - value: mon
                label: Lundi
              - value: tue
                label: Mardi
              - value: wed
                label: Mercredi
              - value: thu
                label: Jeudi
              - value: fri
                label: Vendredi
              - value: sat
                label: Samedi
              - value: sun
                label: Dimanche
        summary_when_empty:
          name: Envoyer aussi le récapitulatif lorsque tout va bien
          default: false
          selector:
            boolean: {}
        summary_actions:
          name: Actions du récapitulatif
          description: Mêmes variables ; battery_message liste alors tous les appareils à vérifier.
          default: []
          selector:
            action: {}
        persistent_notification:
          name: Tenir à jour une notification persistante
          description: Mise à jour à chaque changement de la liste, retirée lorsque plus rien n’est à vérifier.
          default: true
          selector:
            boolean: {}
        notification_conditions:
          name: Conditions supplémentaires pour envoyer les alertes et le récapitulatif
          description: La mémoire et la notification persistante restent à jour même si ces conditions échouent.
          default: []
          selector:
            condition: {}
        logging:
          name: Journaliser les détections
          description: Niveau INFO, journal battery_watch.
          default: false
          selector:
            boolean: {}
mode: queued
max: 10
max_exceeded: silent
triggers:
- trigger: time_pattern
  minutes: !input 'scan_minutes'
  id: scan
- trigger: time
  at: !input 'summary_time'
  id: summary
- trigger: state
  entity_id: !input 'memory'
  id: list
variables:
  memory_entity: !input 'memory'
  threshold: !input 'threshold'
  recovery_margin: !input 'recovery_margin'
  unavailable_hours: !input 'unavailable_hours'
  include_binary: !input 'include_binary'
  excluded_integrations: !input 'excluded_integrations'
  excluded_manufacturers: !input 'excluded_manufacturers'
  excluded_entities: !input 'excluded_entities'
  excluded_devices: !input 'excluded_devices'
  excluded_labels: !input 'excluded_labels'
  immediate: !input 'immediate'
  summary_enabled: !input 'summary_enabled'
  summary_weekdays: !input 'summary_weekdays'
  summary_when_empty: !input 'summary_when_empty'
  persistent_notification: !input 'persistent_notification'
  logging: !input 'logging'
actions:
- variables:
    mode_run: '{% if trigger is not defined or trigger.id is not defined or trigger.id is none %}manual {% else
      %}{{ trigger.id }}{% endif %}'
    notification_id: '{{ "battery_watch_" ~ sha256(this.entity_id)[:12] }}'
    errors: |
      {%- set ns = namespace(errors=[]) -%}
      {#- Liste de tâches capable d’ajouter, supprimer, modifier et décrire ses éléments (1 + 2 + 4 + 64). -#}
      {%- set features = state_attr(memory_entity, 'supported_features') | int(0) -%}
      {%- if not memory_entity.startswith('todo.') or states[memory_entity] is none
            or states(memory_entity) in ['unavailable', 'unknown']
            or (features | bitwise_and(71)) != 71 -%}
        {%- set ns.errors = ns.errors + ['Créer une liste de tâches locale réservée à cette automatisation (intégration « Liste de tâches locale »).'] -%}
      {%- endif -%}
      {%- for value, lower, upper in [(threshold, 1, 100), (recovery_margin, 0, 50), (unavailable_hours, 0, 168)] -%}
        {%- if value is not number or value is boolean or not lower <= value <= upper -%}
          {%- set ns.errors = ns.errors + ['Un réglage numérique dépasse ses limites.'] -%}
        {%- endif -%}
      {%- endfor -%}
      {%- for value in [excluded_integrations, excluded_manufacturers, excluded_entities, excluded_devices,
                        excluded_labels, summary_weekdays] -%}
        {%- if value is not sequence or value is string or value is mapping -%}
          {%- set ns.errors = ns.errors + ['Une liste d’exclusions ou de jours n’est pas une liste.'] -%}
        {%- endif -%}
      {%- endfor -%}
      {{ ns.errors | unique | list }}
- if: '{{ errors | count > 0 }}'
  then:
  - action: persistent_notification.create
    data:
      notification_id: '{{ notification_id }}'
      title: Surveillance des piles et batteries — configuration
      message: '{{ errors | join("\n") }}'
  - action: system_log.write
    data:
      logger: battery_watch
      level: warning
      message: '{{ this.entity_id }} : {{ errors | join(" ") }}'
  - stop: Configuration invalide ; mémoire inchangée.
- action: todo.get_items
  target:
    entity_id: '{{ memory_entity }}'
  data:
    status:
    - needs_action
    - completed
  response_variable: memory_items
- variables:
    listed: '{{ memory_items[memory_entity]["items"] | default([], true) }}'
- variables:
    scan: |
      {#- Analyse des piles et batteries, comparée à la liste de tâches mémoire.
          Entrée : listed, les éléments de la liste (todo.get_items) ; seuls ceux dont la
          description commence par « battery_watch: » appartiennent à cette automatisation.
          Résultat : dict(items, acknowledged, new, renames, removals).
            items : appareils en alerte non cochés, dict(e=entité, n=nom, r=raison, v=niveau, h=heures).
            acknowledged : appareils en alerte dont l’élément a été coché (pris en compte).
            new : appareils en alerte sans élément : à ajouter et à signaler tout de suite.
            renames : dict(uid, summary) des éléments dont le libellé doit être actualisé.
            removals : uid des éléments à retirer (appareil revenu à un état sûr, exclu ou disparu).
          Un élément est conservé tant que l’appareil n’est pas revenu à un état sûr (niveau au
          moins égal au seuil plus la marge, alerte binaire à « off ») : un appareil muet ou
          inconnu n’est donc jamais signalé deux fois. -#}
      {%- set prefix = 'battery_watch:' -%}
      {%- set mine = namespace(by_entity={}, orphans=[]) -%}
      {%- for i in listed if (i.description | default('', true)).startswith(prefix) -%}
        {%- set eid = i.description[prefix | length:] | trim -%}
        {%- if eid in mine.by_entity -%}{%- set mine.orphans = mine.orphans + [i.uid] -%}
        {%- else -%}{%- set mine.by_entity = dict(mine.by_entity, **{eid: i}) -%}{%- endif -%}
      {%- endfor -%}
      {%- set domains = excluded_integrations | map('lower') | list -%}
      {%- set makers = excluded_manufacturers | map('lower') | list -%}
      {%- set ex = namespace(entities=excluded_entities | list, devices=excluded_devices | list) -%}
      {%- for d in domains -%}{%- set ex.entities = ex.entities + integration_entities(d) -%}{%- endfor -%}
      {%- for l in excluded_labels -%}
        {%- set ex.entities = ex.entities + label_entities(l) -%}
        {%- set ex.devices = ex.devices + label_devices(l) -%}
      {%- endfor -%}
      {%- set silent_limit = now() - timedelta(hours=unavailable_hours) -%}
      {%- set candidates = (states.sensor | selectattr('attributes.device_class', 'defined')
           | selectattr('attributes.device_class', 'eq', 'battery') | list)
         + ((states.binary_sensor | selectattr('attributes.device_class', 'defined')
           | selectattr('attributes.device_class', 'eq', 'battery') | list) if include_binary else []) -%}
      {%- set ns = namespace(items=[], acknowledged=[], new=[], renames=[], held=[]) -%}
      {%- for s in candidates if s.entity_id not in ex.entities -%}
        {%- set entry = config_entry_id(s.entity_id) -%}
        {%- set domain = (config_entry_attr(entry, 'domain') or '') | lower if entry else '' -%}
        {%- set device = device_id(s.entity_id) -%}
        {%- set maker = (device_attr(device, 'manufacturer') or '') | lower if device else '' -%}
        {%- if domain not in domains and maker not in makers and (not device or device not in ex.devices) -%}
          {%- if s.domain == 'binary_sensor' -%}
            {%- set alert = s.state == 'on' -%}
            {%- set safe = s.state == 'off' -%}
            {%- set item = dict(e=s.entity_id, n=s.name, r='alert', v=none, h=none) -%}
            {%- set detail = 'alerte pile faible' -%}
          {%- else -%}
            {%- set number = s.state | is_number -%}
            {%- set value = s.state | float(0) -%}
            {%- set low = number and value < threshold -%}
            {%- set silent = unavailable_hours > 0 and s.state == 'unavailable' and s.last_changed < silent_limit -%}
            {%- set alert = low or silent -%}
            {%- set safe = number and value >= threshold + recovery_margin -%}
            {%- set hours = ((now() - s.last_changed).total_seconds() // 3600) | int -%}
            {%- set item = dict(e=s.entity_id, n=s.name, r=('level' if low else 'silent'),
                 v=(value | round(0) | int if low else none), h=(hours if silent and not low else none)) -%}
            {%- set detail = (item.v ~ ' %') if low else ('muet depuis ' ~ hours ~ ' h') -%}
          {%- endif -%}
          {%- set existing = mine.by_entity.get(s.entity_id) -%}
          {%- if alert -%}
            {%- set line = s.name ~ ' — ' ~ detail -%}
            {%- if existing is none -%}
              {%- set ns.new = ns.new + [dict(item, summary=line)] -%}
              {%- set ns.items = ns.items + [item] -%}
            {%- else -%}
              {%- set ns.held = ns.held + [s.entity_id] -%}
              {%- if existing.status == 'completed' -%}{%- set ns.acknowledged = ns.acknowledged + [item] -%}
              {%- else -%}{%- set ns.items = ns.items + [item] -%}{%- endif -%}
              {%- if existing.summary != line -%}
                {%- set ns.renames = ns.renames + [dict(uid=existing.uid, summary=line)] -%}
              {%- endif -%}
            {%- endif -%}
          {%- elif existing is not none and not safe -%}
            {%- set ns.held = ns.held + [s.entity_id] -%}
          {%- endif -%}
        {%- endif -%}
      {%- endfor -%}
      {%- set removals = namespace(uids=mine.orphans) -%}
      {%- for eid, i in mine.by_entity.items() if eid not in ns.held -%}
        {%- set removals.uids = removals.uids + [i.uid] -%}
      {%- endfor -%}
      {{ dict(items=ns.items | sort(attribute='n'), acknowledged=ns.acknowledged | sort(attribute='n'),
              new=ns.new | sort(attribute='n'), renames=ns.renames, removals=removals.uids) }}
- if: '{{ scan.removals | count > 0 }}'
  then:
  - action: todo.remove_item
    target:
      entity_id: '{{ memory_entity }}'
    data:
      item: '{{ scan.removals }}'
- repeat:
    for_each: '{{ scan.new }}'
    sequence:
    - action: todo.add_item
      target:
        entity_id: '{{ memory_entity }}'
      data:
        item: '{{ repeat.item.summary }}'
        description: battery_watch:{{ repeat.item.e }}
- repeat:
    for_each: '{{ scan.renames }}'
    sequence:
    - action: todo.update_item
      target:
        entity_id: '{{ memory_entity }}'
      data:
        item: '{{ repeat.item.uid }}'
        rename: '{{ repeat.item.summary }}'
- variables:
    changed: '{{ (scan.new | count + scan.renames | count + scan.removals | count) > 0 }}'
    battery_all: '{{ scan["items"] }}'
    battery_acknowledged: '{{ scan.acknowledged }}'
    battery_new: '{{ scan.new }}'
    battery_count: '{{ scan["items"] | count }}'
    weekday: '{{ [''mon'',''tue'',''wed'',''thu'',''fri'',''sat'',''sun''][now().weekday()] }}'
    lines_source: '{{ scan["items"] }}'
- variables:
    summary_text: |
      {#- Une ligne par appareil, triée par nom. Variable d’entrée : lines_source. -#}
      {%- set ns = namespace(lines=[]) -%}
      {%- for item in lines_source -%}
        {%- if item.r == 'level' -%}{%- set detail = item.v ~ ' %' -%}
        {%- elif item.r == 'silent' -%}{%- set detail = 'muet depuis ' ~ item.h ~ ' h' -%}
        {%- else -%}{%- set detail = 'alerte pile faible' -%}{%- endif -%}
        {%- set ns.lines = ns.lines + ['• ' ~ item.n ~ ' — ' ~ detail] -%}
      {%- endfor -%}
      {{ ns.lines | join('\n') }}
    lines_source: '{{ battery_new }}'
- variables:
    new_text: |
      {#- Une ligne par appareil, triée par nom. Variable d’entrée : lines_source. -#}
      {%- set ns = namespace(lines=[]) -%}
      {%- for item in lines_source -%}
        {%- if item.r == 'level' -%}{%- set detail = item.v ~ ' %' -%}
        {%- elif item.r == 'silent' -%}{%- set detail = 'muet depuis ' ~ item.h ~ ' h' -%}
        {%- else -%}{%- set detail = 'alerte pile faible' -%}{%- endif -%}
        {%- set ns.lines = ns.lines + ['• ' ~ item.n ~ ' — ' ~ detail] -%}
      {%- endfor -%}
      {{ ns.lines | join('\n') }}
- if: '{{ logging and battery_new | count > 0 }}'
  then:
  - action: system_log.write
    data:
      logger: battery_watch
      level: info
      message: '{{ this.entity_id }} : {{ battery_new | map(attribute="e") | join(", ") }}'
- if: '{{ persistent_notification and (changed or mode_run != "scan") }}'
  then:
  - if: '{{ battery_count > 0 }}'
    then:
    - action: persistent_notification.create
      data:
        notification_id: '{{ notification_id }}'
        title: Piles et batteries à vérifier ({{ battery_count }})
        message: '{{ summary_text }}'
    else:
    - action: persistent_notification.dismiss
      data:
        notification_id: '{{ notification_id }}'
- if:
  - condition: template
    value_template: '{{ immediate and battery_new | count > 0 }}'
  - condition: and
    conditions: !input 'notification_conditions'
  then:
  - variables:
      battery_title: 🔋 Pile ou batterie à remplacer ({{ battery_new | count }})
      battery_message: '{{ new_text }}'
  - sequence: !input 'alert_actions'
- if:
  - condition: template
    value_template: '{{ mode_run == ''manual'' or (mode_run == ''summary'' and summary_enabled and weekday in summary_weekdays)
      }}'
  - condition: template
    value_template: '{{ battery_count > 0 or summary_when_empty }}'
  - condition: and
    conditions: !input 'notification_conditions'
  then:
  - variables:
      battery_title: '{{ ''Piles et batteries à vérifier ('' ~ battery_count ~ '')'' if battery_count > 0 else ''Piles
        et batteries : rien à signaler'' }}'
      battery_message: '{{ summary_text if battery_count > 0 else "Aucune pile ni batterie à remplacer." }}'
  - sequence: !input 'summary_actions'
