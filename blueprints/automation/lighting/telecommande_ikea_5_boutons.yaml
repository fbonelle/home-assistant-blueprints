  memory_entity: !input 'memory'
  dial_scale: 1
  actions_map:
    center_press: !input 'center_press_action'
    center_double: !input 'center_double_action'
    center_hold: !input 'center_hold_action'
    up_press: !input 'up_press_action'
    up_double: !input 'up_double_action'
    up_hold: !input 'up_hold_action'
    down_press: !input 'down_press_action'
    down_double: !input 'down_double_action'
    down_hold: !input 'down_hold_action'
    left_press: !input 'left_press_action'
    left_double: !input 'left_double_action'
    left_hold: !input 'left_hold_action'
    right_press: !input 'right_press_action'
    right_double: !input 'right_double_action'
    right_hold: !input 'right_hold_action'
  gesture_raw: |-
    {% set p1 = params.get('param1') if params is mapping and params.get('param1') is not none
       else (args[0] if args is sequence and args is not string and args | count > 0 else none) %}
    {% if command == 'toggle' %}center_press {% elif command == 'move_to_level_with_on_off' or (command == 'release' and p1 == 0) %}center_hold {% elif command == 'step_with_on_off' %}up_press {% elif command == 'move_with_on_off' %}up_hold {% elif command == 'step' %}down_press {% elif command == 'move' %}down_hold {% elif command == 'press' and p1 == 257 %}left_press {% elif command == 'press' and p1 == 256 %}right_press {% elif command == 'hold' and p1 == 3329 %}left_hold {% elif command == 'hold' and p1 == 3328 %}right_hold {% elif command in ['stop', 'stop_with_on_off', 'release', 'move_up_release', 'move_down_release'] %}stop {% endif %}
  lamp: !input 'light'
  owner: '{{ ''a'' ~ sha256(this.entity_id if this is defined else ''manual'')[:10] }}'
  memory_raw: '{{ states(memory_entity) if memory_entity is string and memory_entity.startswith(''input_text.'')
    else '''' }}'
  memory_state: |-
    {% if not (memory_entity is string and memory_entity != '') %}none {% elif not memory_entity.startswith('input_text.') or memory_raw in ['unavailable']
         or state_attr(memory_entity, 'max') | int(0) < 255 %}invalid
    {% elif memory_raw in ['', 'unknown'] or memory_raw.startswith('sl1:') %}empty {% elif memory_raw.startswith('lr1:') %}
      {% set p = memory_raw[4:] | from_json(none) %}
      {% if p is not mapping or p.get('v') != 1 %}corrupt
      {% elif p.get('o') != owner %}foreign
      {% else %}ok{% endif %}
    {% else %}corrupt{% endif %}
  use_memory: '{{ memory_state in [''ok'', ''empty''] }}'
  m: |-
    {% set p = memory_raw[4:] | from_json({}) if memory_state == 'ok' else {} %} {% set p = p if p is mapping else {} %} {% set x = p.get('x') %} {% set m = dict(
         g=p.get('g') if p.get('g') is string else '',
         t=p.get('t') | float(0),
         h=p.get('h') if p.get('h') is string else '',
         d=p.get('d') if p.get('d') is string else '',
         s=p.get('s') | float(0),
         i=p.get('i') | int(-1),
         p=p.get('p') if p.get('p') is string else '',
         x=x if x is sequence and x is not string and x is not mapping and x | count == 2 else [],
         k=p.get('k') if p.get('k') is string else '') %}
    {{ dict(m, g='', t=0, h='', d='', s=0) if m.t > now_ts + 5 or m.s > now_ts + 5 else m }}
  gesture: |-
    {% set double = gesture_raw | replace('_press', '_double') %} {% if use_memory and gesture_raw.endswith('_press') and double in actions_map
          and actions_map[double] != 'none' and m.g == gesture_raw
          and 0 < event_ts - m.t <= double_press_ms / 1000 %}{{ double }}
    {% else %}{{ gesture_raw }}{% endif %}
  action: '{% set known = [''none'', ''toggle'', ''toggle_level'', ''on'', ''off'', ''level'', ''full'', ''full_reference'',
    ''recall'', ''alternate'', ''brighter'', ''dimmer'', ''brighter_hold'', ''dimmer_hold'', ''cooler'', ''warmer'',
    ''cooler_hold'', ''warmer_hold'', ''next_preset'', ''previous_preset'', ''next_preset_hold'', ''previous_preset_hold'',
    ''custom''] %} {% set chosen = actions_map.get(gesture, ''none'') if gesture not in ['''', ''stop''] else ''none''
    %} {{ chosen if chosen in known else ''none'' }}'
  continuous: '{{ action.endswith(''_hold'') and not repeating_hold }}'
  own_change: '{% set s = states[lamp] if lamp is string and lamp.startswith(''light.'') else none %} {{ this is
    defined and s is not none and s.context.id == this.context.id }}'
  loop_running: |-
    {% set s = states[lamp] if lamp is string and lamp.startswith('light.') else none %} {{ this is defined and this.attributes.get('current', 0) | int(0) > 0 and own_change and s is not none
       and now_ts - as_timestamp(s.last_updated) < [hold_interval, preset_hold_interval] | max + 1 }}
  fade_level: |-
    {% set s = states[lamp] if lamp is string and lamp.startswith('light.') else none %} {% if use_memory and m.h != '' and m.d in ['brighter', 'dimmer'] and own_change and smooth_dimming
          and s is not none and s.state == 'on' and s.attributes.get('brightness') is number %}
      {% set target = s.attributes.brightness / 2.55 %}
      {% set elapsed = now_ts - as_timestamp(s.last_updated) %}
      {% set tick = brightness_speed * hold_interval if brightness_speed > 0 else hold_step_pct %}
      {% set previous = target - tick if m.d == 'brighter' else target + tick %}
      {% if 0 <= elapsed < hold_interval and min_pct < target < max_pct %}
        {{ (previous + (target - previous) * elapsed / hold_interval) | round(1) }}
      {% else %}-1{% endif %}
    {% else %}-1{% endif %}
  ignore_reason: |-
    {% if manual %} {% elif gesture_raw == '' %}événement sans geste {% elif now_ts - event_ts > 5 %}événement trop ancien {% elif use_memory and event_ts < m.t - 0.001 %}événement arrivé dans le désordre {% elif debounce_ms > 0 and use_memory and m.g in [gesture_raw, gesture_raw | replace('_press', '_double')]
            and 0 <= event_ts - m.t < debounce_ms / 1000 %}doublon radio
    {# Sans mémoire, l'exécution précédente peut être horodatée quelques millisecondes après
       l'émission de cet événement si Home Assistant est occupé : l'écart est pris sans signe. #}
    {% elif debounce_ms > 0 and not use_memory and this is defined and this.attributes.get('last_triggered')
            and (event_ts - as_timestamp(this.attributes.last_triggered, 0)) | abs < debounce_ms / 1000 %}doublon radio
    {% elif continuous and use_memory and m.h == gesture and 0 <= event_ts - m.s < hold_limit %}répétition du maintien en cours {% elif continuous and not use_memory and loop_running %}maintien déjà en cours {% elif gesture == 'stop' or action == 'custom' %} {% elif action == 'none' %}geste sans action {% elif not (lamp is string and lamp.startswith('light.')) %}geste sans lampe {% endif %}
conditions:
- condition: template
  value_template: '{{ ignore_reason | trim == '''' }}'
actions:
- variables:
    notification_id: '{{ ''lighting_remote_'' ~ owner }}'
    presets: '{{ palette | select(''in'', catalog) | list if palette is sequence and palette is not string else
      [] }}'
    config_errors: |-
      {% set ns = namespace(errors=[]) %} {% if memory_state == 'invalid' %}
        {% set ns.errors = ns.errors + ["L'assistant de mémoire doit être un assistant Texte existant, de longueur maximale 255."] %}
      {% endif %} {% if min_pct > max_pct %}
        {% set ns.errors = ns.errors + ['La luminosité minimale dépasse la luminosité maximale.'] %}
      {% endif %} {% if debounce_ms > 0 and debounce_ms >= double_press_ms %}
        {% set ns.errors = ns.errors + ["Le filtre des doublons doit être plus court que le délai du double appui."] %}
      {% endif %} {% if palette is not sequence or palette is string or presets | count != palette | count
            or presets | unique | list | count != presets | count %}
        {% set ns.errors = ns.errors + ['La palette contient un préréglage inconnu ou en double.'] %}
      {% endif %} {% if recall_color is not sequence or recall_color is string or recall_color | count != 3
            or recall_color | select('number') | list | count != 3
            or recall_color | select('ge', 0) | select('le', 255) | list | count != 3
            or recall_color | sum == 0 %}
        {% set ns.errors = ns.errors + ['La couleur de rappel doit être une couleur RGB lumineuse (trois valeurs de 0 à 255).'] %}
      {% endif %} {{ ns.errors }}
    memory_warning: '{% if memory_state == ''foreign'' %}L''assistant de mémoire appartient à une autre automatisation
      : il n''est pas modifié et la télécommande fonctionne sans mémoire. Choisir un assistant propre à cette automatisation.
      {% elif memory_state == ''corrupt'' %}L''assistant de mémoire est illisible : il n''est pas modifié et la
      télécommande fonctionne sans mémoire. Le vider pendant que l''automatisation est désactivée. {% endif %}'
    doubles_configured: '{% set ns = namespace(count=0) %} {% for key in double_keys %}{% if actions_map.get(key,
      ''none'') != ''none'' %}{% set ns.count = ns.count + 1 %}{% endif %}{% endfor %} {{ ns.count > 0 }}'
- if: '{{ config_errors | count > 0 }}'
  then:
  - action: persistent_notification.create
    data:
      notification_id: '{{ notification_id }}'
      title: Télécommande d'éclairage — configuration à corriger
      message: '{{ this.attributes.friendly_name | default(''Automatisation'') }} : {{ config_errors | join('' '')
        }}'
  - action: system_log.write
    data:
      logger: lighting_remote
      level: warning
      message: '{{ this.entity_id | default("automation") }} : {{ config_errors | join(" ") }}'
  - stop: Configuration invalide ; aucune commande envoyée.
- if: '{{ manual }}'
  then:
  - variables:
      targets: '{{ (lamps if lamps is defined else [lamp]) | select(''string'') | select(''match'', ''^light[.]'')
        | list }}'
  - action: persistent_notification.create
    data:
      notification_id: '{{ notification_id }}'
      title: Télécommande d'éclairage — diagnostic
      message: |-
        **{{ this.attributes.friendly_name | default('Automatisation') }}** — aucune commande envoyée par ce diagnostic.
        {%- for target in targets %}
        {%- set modes = state_attr(target, 'supported_color_modes') or [] %}
        {%- set features = state_attr(target, 'supported_features') | int(0) %}

        Lampe {{ state_attr(target, 'friendly_name') or target }} (`{{ target }}`) :
        - communication : {{ 'joignable' if states(target) in ['on', 'off'] else 'indisponible' }}
        - luminosité : {{ 'oui' if modes | reject('in', ['onoff']) | list | count > 0 else 'non' }}
        - couleurs : {{ 'oui' if modes | select('in', ['hs', 'xy', 'rgb', 'rgbw', 'rgbww']) | list | count > 0 else 'non' }}
        - blanc réglable : {{ ('oui, de ' ~ state_attr(target, 'min_color_temp_kelvin') ~ ' à ' ~ state_attr(target, 'max_color_temp_kelvin') ~ ' K') if 'color_temp' in modes else 'non (les blancs passent par les couleurs si la lampe en a)' }}
        - fondus : {{ 'oui' if features | bitwise_and(32) != 0 else 'non' }}
        - modes : {{ modes | join(', ') if modes else 'inconnus' }}
        {%- endfor %}

        Mémoire : {{ {'none': 'aucun assistant ; double appui inactif', 'empty': 'assistant prêt',
                      'ok': 'assistant en service', 'foreign': "assistant d'une autre automatisation, ignoré",
                      'corrupt': 'assistant illisible, ignoré'}[memory_state] }}.
        {%- if doubles_configured and not use_memory %}

        **Un double appui est configuré mais ne peut pas fonctionner sans assistant de mémoire.**
        {%- endif %}
        {%- if memory_warning | trim != '' %}

        {{ memory_warning | trim }}
        {%- endif %}
  - stop: Diagnostic affiché.
- if: '{{ memory_warning | trim != "" }}'
  then:
  - action: persistent_notification.create
    data:
      notification_id: '{{ notification_id }}'
      title: Télécommande d'éclairage — assistant de mémoire
      message: '{{ this.attributes.friendly_name | default(''Automatisation'') }} : {{ memory_warning }}'
- if: '{{ use_memory }}'
  then:
  - action: input_text.set_value
    target:
      entity_id: '{{ memory_entity }}'
    data:
      value: |-
        lr1:{{ dict(m, v=1, o=owner, g=gesture, t=event_ts | round(3),
                    h=(gesture if continuous else ''),
                    d=(action | replace('_hold', '') if continuous else ''),
                    s=(event_ts | round(3) if continuous else 0)) | to_json }}
- if: '{{ logging }}'
  then:
  - action: logger.set_level
    continue_on_error: true
    data:
      lighting_remote: info
  - action: system_log.write
    continue_on_error: true
    data:
      logger: lighting_remote
      level: info
      message: '{{ this.entity_id | default("automation") }} : {{ command }} → {{ gesture }} → {{ action }}.'
- if: '{{ gesture == ''stop'' }}'
  then:
  - if: '{{ fade_level | float(-1) >= 0 }}'
    then:
    - action: light.turn_on
      target:
        entity_id: '{{ lamp }}'
      data:
        brightness_pct: '{{ fade_level }}'
        transition: 0
  - stop: Relâchement reçu ; variation en cours arrêtée.
- if: '{{ action == ''custom'' }}'
  then:
  - choose:
    - conditions: '{{ gesture == ''center_press'' }}'
      sequence: !input 'center_press_custom'
    - conditions: '{{ gesture == ''center_double'' }}'
      sequence: !input 'center_double_custom'
    - conditions: '{{ gesture == ''center_hold'' }}'
      sequence: !input 'center_hold_custom'
    - conditions: '{{ gesture == ''up_press'' }}'
      sequence: !input 'up_press_custom'
    - conditions: '{{ gesture == ''up_double'' }}'
      sequence: !input 'up_double_custom'
    - conditions: '{{ gesture == ''up_hold'' }}'
      sequence: !input 'up_hold_custom'
    - conditions: '{{ gesture == ''down_press'' }}'
      sequence: !input 'down_press_custom'
    - conditions: '{{ gesture == ''down_double'' }}'
      sequence: !input 'down_double_custom'
    - conditions: '{{ gesture == ''down_hold'' }}'
      sequence: !input 'down_hold_custom'
    - conditions: '{{ gesture == ''left_press'' }}'
      sequence: !input 'left_press_custom'
    - conditions: '{{ gesture == ''left_double'' }}'
      sequence: !input 'left_double_custom'
    - conditions: '{{ gesture == ''left_hold'' }}'
      sequence: !input 'left_hold_custom'
    - conditions: '{{ gesture == ''right_press'' }}'
      sequence: !input 'right_press_custom'
    - conditions: '{{ gesture == ''right_double'' }}'
      sequence: !input 'right_double_custom'
    - conditions: '{{ gesture == ''right_hold'' }}'
      sequence: !input 'right_hold_custom'
  - stop: Action personnalisée exécutée.
- if: '{{ states(lamp) not in [''on'', ''off''] }}'
  then:
  - stop: Lampe indisponible ; aucune commande envoyée.
- variables:
    lamp_on: '{{ is_state(lamp, ''on'') }}'
    level: '{{ ((state_attr(lamp, ''brightness'') | float(0)) / 2.55) | round(1) if is_state(lamp, ''on'') else
      0 }}'
    color_modes: '{{ state_attr(lamp, ''supported_color_modes'') or [] }}'
    has_color: '{{ color_modes | select(''in'', [''hs'', ''xy'', ''rgb'', ''rgbw'', ''rgbww'']) | list | count >
      0 }}'
    has_kelvin: '{{ ''color_temp'' in color_modes }}'
    kelvin_min: '{{ state_attr(lamp, ''min_color_temp_kelvin'') | int(2000) }}'
    kelvin_max: '{{ state_attr(lamp, ''max_color_temp_kelvin'') | int(6500) }}'
    fade: '{{ {''transition'': transition} if transition > 0 else {} }}'
    hold_freeze: '{{ {''brightness_pct'': fade_level} if fade_level | float(-1) >= 0 else {} }}'
    stop_effect: |-
      {{ {'effect': 'off'} if state_attr(lamp, 'effect') not in [none, 'off', 'none']
         and 'off' in (state_attr(lamp, 'effect_list') or []) else {} }}
    color_fade: '{{ {''transition'': color_transition} if color_transition > 0 else {} }}'
- choose:
  - conditions: '{{ action == ''toggle'' }}'
    sequence:
    - action: light.toggle
      target:
        entity_id: '{{ lamp }}'
      data: '{{ fade }}'
  - conditions: '{{ action == ''on'' }}'
    sequence:
    - action: light.turn_on
      target:
        entity_id: '{{ lamp }}'
      data: '{{ dict(hold_freeze, transition=0) if hold_freeze else fade }}'
  - conditions: '{{ action == ''off'' or (action == ''toggle_level'' and lamp_on) }}'
    sequence:
    - action: light.turn_off
      target:
        entity_id: '{{ lamp }}'
      data: '{{ fade }}'
  - conditions: '{{ action in [''level'', ''toggle_level''] }}'
    sequence:
    - action: light.turn_on
      target:
        entity_id: '{{ lamp }}'
      data: '{{ dict(fade, brightness_pct=on_level_pct) }}'
  - conditions: '{{ action == ''full'' }}'
    sequence:
    - action: light.turn_on
      target:
        entity_id: '{{ lamp }}'
      data: '{{ dict(fade, brightness_pct=100) }}'
  - conditions: '{{ action == ''full_reference'' }}'
    sequence:
    - action: light.turn_on
      target:
        entity_id: '{{ lamp }}'
      data: |-
        {% set base = dict(stop_effect, **color_fade) %} {% if has_color and presets | count > 0 %}
          {{ dict(dict(base, **catalog[presets[0]].data), brightness_pct=100) }}
        {% elif has_kelvin %}
          {{ dict(base, brightness_pct=100, color_temp_kelvin=([kelvin_min, reference_kelvin, kelvin_max] | sort)[1]) }}
        {% else %}
          {{ dict(fade, brightness_pct=100) }}
        {% endif %}
  - conditions: '{{ action == ''recall'' }}'
    sequence:
    - if: '{{ not lamp_on and not recall_turns_on }}'
      then:
      - stop: Lampe éteinte ; le rappel n'est pas autorisé à l'allumer.
    - action: light.turn_on
      target:
        entity_id: '{{ lamp }}'
      data: '{{ dict(dict(dict(stop_effect, **color_fade), **hold_freeze), rgb_color=recall_color | map(''int'')
        | list) }}'
  - conditions: '{{ action == ''alternate'' }}'
    sequence:
    - action: light.turn_on
      target:
        entity_id: '{{ lamp }}'
      data: '{{ dict(fade, brightness_pct=(high_level_pct if lamp_on and level < high_level_pct - 1 else on_level_pct))
        }}'
  default:
  - variables:
      operation: '{{ action | replace(''_hold'', '''') }}'
      colour_operation: '{{ operation in [''cooler'', ''warmer'', ''next_preset'', ''previous_preset''] }}'
      tick: '{{ preset_hold_interval if colour_operation else hold_interval }}'
      iterations: '{{ ((hold_limit / tick) | round(0, ''ceil'') | int) if continuous else 1 }}'
      amount: |-
        {% if gesture in ['dial_up', 'dial_down'] and dial_step is number and dial_step > 0 %}
          {{ ([dial_step * dial_scale, 100] | min) | round(1) }}
        {% elif action.endswith('_hold') %}
          {{ (brightness_speed * hold_interval) | round(2) if brightness_speed > 0 else hold_step_pct }}
        {% else %}{{ step_pct }}{% endif %}
      motion: |-
        {% if colour_operation %}
          {{ ([color_transition, preset_hold_interval] | min) if continuous else color_transition }}
        {% else %}
          {{ (hold_interval if smooth_dimming else 0) if continuous else transition }}
        {% endif %}
      cursor: |-
        {% set xy = state_attr(lamp, 'xy_color') %} {% set valid = lamp_on and xy is sequence and xy is not string and xy | count == 2
                       and xy[0] is number and xy[1] is number and presets | count > 0 %}
        {% set observed = [xy[0] | round(4), xy[1] | round(4)] if valid else [] %} {% if valid and use_memory and m.p == sha256(presets | to_json)[:8] and 0 <= m.i < presets | count
              and observed == m.x and m.k == sha256(states[lamp].context.id)[:8] %}{{ m.i }}
        {% elif valid %}
          {% set ns = namespace(best=-1, distance=0) %}
          {% for key in presets %}
            {% set c = catalog[key].xy %}
            {% set distance = (xy[0] - c[0]) ** 2 + (xy[1] - c[1]) ** 2 %}
            {% if ns.best < 0 or distance < ns.distance %}
              {% set ns.best = loop.index0 %}{% set ns.distance = distance %}
            {% endif %}
          {% endfor %}{{ ns.best }}
        {% else %}-1{% endif %}
  - if: '{{ colour_operation and not lamp_on and not colors_turn_on }}'
    then:
    - stop: Lampe éteinte ; les changements de couleur ne sont pas autorisés à l'allumer.
  - repeat:
      count: '{{ iterations }}'
      sequence:
      - variables:
          now_on: '{{ is_state(lamp, ''on'') }}'
          now_brightness: '{{ state_attr(lamp, ''brightness'') | int(0) if is_state(lamp, ''on'') else 0 }}'
          now_kelvin: '{{ state_attr(lamp, ''color_temp_kelvin'') | int(0) if is_state(lamp, ''on'') else 0 }}'
          index: |-
            {% set direction = 1 if operation == 'next_preset' else -1 %} {{ ((cursor + direction * repeat.index) if cursor >= 0 else ((repeat.index - 1) * direction))
               % ([presets | count, 1] | max) }}
          request: |-
            {% set now_level = now_brightness / 2.55 %} {% if repeat.index > 1 and not now_on %}{{ {} }} {% elif operation == 'brighter' %}
              {% set start = (min_pct if continuous else [amount, min_pct] | max) %}
              {% set target = ([now_level + amount, max_pct] | min) if now_on else ([start, max_pct] | min) %}
              {{ {'brightness_pct': target | round(1)}
                 if not now_on or (target * 2.55) | round(0) | int > now_brightness else {} }}
            {% elif operation == 'dimmer' %}
              {% set target = [now_level - amount, min_pct] | max %}
              {{ {'brightness_pct': target | round(1)}
                 if now_on and (target * 2.55) | round(0) | int < now_brightness else {} }}
            {% elif operation in ['cooler', 'warmer'] %}
              {% set base = now_kelvin if now_kelvin > 0 else reference_kelvin %}
              {% set target = ([kelvin_min, base + (kelvin_step if operation == 'cooler' else -kelvin_step), kelvin_max] | sort)[1] %}
              {{ dict(stop_effect, color_temp_kelvin=target) if not now_on or target != now_kelvin else {} }}
            {% elif operation in ['next_preset', 'previous_preset'] and presets | count > 0 %}
              {{ dict(stop_effect, **catalog[presets[index]].data) }}
            {% else %}{{ {} }}{% endif %}
      - if: '{{ request | count == 0 }}'
        then:
        - if: '{{ use_memory and continuous }}'
          then:
          - action: input_text.set_value
            target:
              entity_id: '{{ memory_entity }}'
            data:
              value: '{% set c = states(memory_entity)[4:] | from_json({}) if states(memory_entity).startswith(''lr1:'')
                else {} %} {% set c = c if c is mapping and c.get(''o'') == owner else dict(m, v=1, o=owner) %}
                lr1:{{ dict(c, h='''', d='''', s=0) | to_json }}'
        - stop: Butée atteinte, lampe éteinte ou rien à changer ; variation terminée.
      - action: light.turn_on
        target:
          entity_id: '{{ lamp }}'
        data: '{% set data = dict(request, transition=motion) if motion > 0 else request %} {{ dict(data, **hold_freeze)
          if repeat.index == 1 and colour_operation and hold_freeze else data }}'
      - if: '{{ use_memory and operation in [''next_preset'', ''previous_preset''] and presets | count > 0 }}'
        then:
        - variables:
            shown: '{{ state_attr(lamp, ''xy_color'') }}'
        - action: input_text.set_value
          target:
            entity_id: '{{ memory_entity }}'
          data:
            value: |-
              {% set observed = [shown[0] | round(4), shown[1] | round(4)]
                 if shown is sequence and shown is not string and shown | count == 2 else [] %}
              lr1:{{ dict(m, v=1, o=owner, g=gesture, t=event_ts | round(3),
                          h=(gesture if continuous else ''), d=(operation if continuous else ''),
                          s=(event_ts | round(3) if continuous else 0),
                          i=index, p=sha256(presets | to_json)[:8], x=observed,
                          k=sha256(states[lamp].context.id)[:8]) | to_json }}
      - if: '{{ repeat.index < iterations }}'
        then:
        - delay:
            seconds: '{{ tick }}'
  - if: '{{ use_memory and continuous }}'
    then:
    - action: input_text.set_value
      target:
        entity_id: '{{ memory_entity }}'
      data:
        value: '{% set c = states(memory_entity)[4:] | from_json({}) if states(memory_entity).startswith(''lr1:'')
          else {} %} {% set c = c if c is mapping and c.get(''o'') == owner else dict(m, v=1, o=owner) %} lr1:{{
          dict(c, h='''', d='''', s=0) | to_json }}'
