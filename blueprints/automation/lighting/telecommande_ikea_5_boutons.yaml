                label: Couleur de rappel (luminosité conservée)
              - value: alternate
                label: Alterner entre niveau d'allumage et niveau haut
              - value: brighter
                label: Augmenter la luminosité d'un pas
              - value: dimmer
                label: Baisser la luminosité d'un pas
              - value: cooler
                label: Blanc plus froid d'un pas
              - value: warmer
                label: Blanc plus chaud d'un pas
              - value: next_preset
                label: Préréglage de couleur suivant
              - value: previous_preset
                label: Préréglage de couleur précédent
              - value: custom
                label: Action personnalisée
        right_double_custom:
          name: Double appui (assistant de mémoire nécessaire) — action personnalisée
          description: Exécutée seulement si « Action personnalisée » est choisie ci-dessus.
          default: []
          selector:
            action: {}
        right_hold_action:
          name: Maintien
          default: next_preset_hold
          selector:
            select:
              mode: dropdown
              options:
              - value: none
                label: Aucune action
              - value: toggle
                label: Basculer marche/arrêt
              - value: toggle_level
                label: Basculer, en allumant au niveau d'allumage
              - value: 'on'
                label: Allumer
              - value: 'off'
                label: Éteindre
              - value: level
                label: Allumer au niveau d'allumage
              - value: full
                label: Pleine luminosité
              - value: full_reference
                label: Pleine luminosité et couleur de référence
              - value: recall
                label: Couleur de rappel (luminosité conservée)
              - value: alternate
                label: Alterner entre niveau d'allumage et niveau haut
              - value: brighter
                label: Augmenter la luminosité d'un pas
              - value: dimmer
                label: Baisser la luminosité d'un pas
              - value: brighter_hold
                label: Augmenter la luminosité en continu
              - value: dimmer_hold
                label: Baisser la luminosité en continu
              - value: cooler
                label: Blanc plus froid d'un pas
              - value: warmer
                label: Blanc plus chaud d'un pas
              - value: cooler_hold
                label: Blanc plus froid en continu
              - value: warmer_hold
                label: Blanc plus chaud en continu
              - value: next_preset
                label: Préréglage de couleur suivant
              - value: previous_preset
                label: Préréglage de couleur précédent
              - value: next_preset_hold
                label: Préréglages suivants en continu
              - value: previous_preset_hold
                label: Préréglages précédents en continu
              - value: custom
                label: Action personnalisée
        right_hold_custom:
          name: Maintien — action personnalisée
          description: Exécutée seulement si « Action personnalisée » est choisie ci-dessus.
          default: []
          selector:
            action: {}
    settings:
      name: Réglages de variation et de couleur
      icon: mdi:tune
      collapsed: true
      input:
        step_pct:
          name: Pas de luminosité
          description: Variation appliquée par un appui « d'un pas ».
          default: 20
          selector:
            number:
              min: 1
              max: 50
              step: 1
              unit_of_measurement: '%'
              mode: box
        brightness_speed:
          name: Vitesse de variation pendant un maintien
          description: Points de luminosité par seconde ; 35 traverse toute la plage en environ 3 secondes. 0 utilise
            le pas de luminosité pendant un maintien à chaque cadence.
          default: 0
          selector:
            number:
              min: 0
              max: 100
              step: 1
              unit_of_measurement: '%/s'
              mode: box
        hold_step_pct:
          name: Pas de luminosité pendant un maintien
          description: Utilisé quand la vitesse vaut 0. Pour les télécommandes qui répètent elles-mêmes le maintien
            (Philips Hue), variation à chaque répétition.
          default: 10
          selector:
            number:
              min: 1
              max: 50
              step: 1
              unit_of_measurement: '%'
              mode: box
        hold_interval:
          name: Cadence de la luminosité pendant un maintien
          description: Intervalle entre deux commandes de luminosité d'un maintien.
          default: 0.5
          selector:
            number:
              min: 0.2
              max: 2
              step: 0.1
              unit_of_measurement: s
              mode: box
        preset_hold_interval:
          name: Cadence des couleurs et des blancs pendant un maintien
          description: Intervalle entre deux préréglages ou deux pas de température d'un maintien.
          default: 0.5
          selector:
            number:
              min: 0.2
              max: 3
              step: 0.1
              unit_of_measurement: s
              mode: box
        hold_limit:
          name: Durée maximale d'un maintien
          description: Arrêt automatique d'une variation continue si le relâchement radio est perdu.
          default: 10
          selector:
            number:
              min: 2
              max: 60
              step: 1
              unit_of_measurement: s
              mode: box
        smooth_dimming:
          name: Lisser la variation pendant un maintien
          description: Chaque commande de luminosité d'un maintien est un fondu qui dure jusqu'à la suivante.
          default: true
          selector:
            boolean: {}
        min_pct:
          name: Luminosité minimale
          description: La baisse de luminosité s'arrête à ce niveau et n'éteint jamais la lampe ; un maintien vers
            le haut sur une lampe éteinte part de ce niveau.
          default: 1
          selector:
            number:
              min: 1
              max: 100
              step: 1
              unit_of_measurement: '%'
              mode: box
        max_pct:
          name: Luminosité maximale de la variation
          description: Butée haute des appuis et maintiens qui augmentent la luminosité.
          default: 100
          selector:
            number:
              min: 1
              max: 100
              step: 1
              unit_of_measurement: '%'
              mode: box
        on_level_pct:
          name: Niveau d'allumage
          description: Utilisé par « Allumer au niveau d'allumage », « Basculer, en allumant au niveau d'allumage
            » et « Alterner ».
          default: 50
          selector:
            number:
              min: 1
              max: 100
              step: 1
              unit_of_measurement: '%'
              mode: box
        high_level_pct:
          name: Niveau haut
          description: Second niveau de l'action « Alterner ».
          default: 100
          selector:
            number:
              min: 1
              max: 100
              step: 1
              unit_of_measurement: '%'
              mode: box
        transition:
          name: Fondu de la luminosité
          description: Fondu des allumages, extinctions et pas uniques de luminosité, si la lampe le prend en charge.
            0 pour aucun fondu.
          default: 0.5
          selector:
            number:
              min: 0
              max: 5
              step: 0.1
              unit_of_measurement: s
              mode: box
        color_transition:
          name: Fondu des couleurs
          description: Fondu des changements de couleur, de blanc et du rappel. Pendant un maintien, il est limité
            à la cadence des couleurs.
          default: 0.5
          selector:
            number:
              min: 0
              max: 5
              step: 0.1
              unit_of_measurement: s
              mode: box
        kelvin_step:
          name: Pas de température du blanc
          default: 250
          selector:
            number:
              min: 50
              max: 1000
              step: 50
              unit_of_measurement: K
              mode: box
        reference_kelvin:
          name: Blanc de référence
          description: Point de départ des changements de température quand la lampe n'en indique pas, et couleur
