# SPDX-License-Identifier: GPL-3.0-only
# Généré par tools/build_lighting.py ; modifier src/lighting/engine.yaml et src/lighting/models.yaml.
# Structure : les variables traduisent l'événement zha_event en geste normalisé
# (« gesture »), choisissent la lampe (« lamp ») et l'action réglée pour ce geste
# (« action »). La condition écarte les événements sans action, qui ne redémarrent donc
# jamais un maintien en cours. Les actions forment le moteur commun, identique pour
# toutes les télécommandes ; ses commentaires détaillés sont dans src/lighting/engine.yaml.
blueprint:
  name: Télécommande IKEA TRÅDFRI 5 boutons — ZHA — 1.0.4
  description: 'Bouton central, Plus, Moins, Gauche et Droite. Remplace les anciennes variantes « blancs » et «
    préréglages » : choisir pour Gauche et Droite la température du blanc ou la palette de couleurs. Actions et
    réglages communs à toutes les télécommandes de la famille ; variations continues bornées. Assistant de mémoire
    facultatif, nécessaire au double appui. Menu → Exécuter les actions affiche un diagnostic sans commander la
    lampe. Guide : https://github.com/fbonelle/home-assistant-blueprints/blob/main/docs/lighting.md'
  domain: automation
  homeassistant:
    min_version: 2026.10.0
  author: fbonelle
  source_url: https://github.com/fbonelle/home-assistant-blueprints/blob/main/blueprints/automation/lighting/telecommande_ikea_5_boutons.yaml
  input:
    remote:
      name: Télécommande
      selector:
        device:
          filter:
          - integration: zha
            manufacturer: IKEA of Sweden
            model: TRADFRI remote control
    light:
      name: Lampe
      selector:
        entity:
          filter:
          - domain: light
    memory:
      name: Assistant de mémoire (facultatif)
      description: Assistant Texte de longueur maximale 255, réservé à cette automatisation. Nécessaire pour le
        double appui ; apporte aussi la position exacte dans la palette, le rejet des événements désordonnés et
        l'arrêt au niveau atteint lors du relâchement. Sans assistant, tout le reste fonctionne.
      default: ''
      selector:
        entity:
          filter:
          - domain: input_text
    center:
      name: Bouton central
      icon: mdi:power
      input:
        center_press_action:
          name: Appui court
          default: toggle
          selector:
            select:
              mode: dropdown
              options:
              - value: none
                label: Aucune action
              - value: toggle
                label: Basculer marche/arrêt
              - value: toggle_level
                label: Basculer, en allumant au niveau d'allumage
              - value: 'on'
                label: Allumer
              - value: 'off'
                label: Éteindre
              - value: level
                label: Allumer au niveau d'allumage
              - value: full
                label: Pleine luminosité
              - value: full_reference
                label: Pleine luminosité et couleur de référence
              - value: recall
                label: Couleur de rappel (luminosité conservée)
              - value: alternate
                label: Alterner entre niveau d'allumage et niveau haut
              - value: brighter
                label: Augmenter la luminosité d'un pas
              - value: dimmer
                label: Baisser la luminosité d'un pas
              - value: cooler
                label: Blanc plus froid d'un pas
              - value: warmer
                label: Blanc plus chaud d'un pas
              - value: next_preset
                label: Préréglage de couleur suivant
              - value: previous_preset
                label: Préréglage de couleur précédent
              - value: custom
                label: Action personnalisée
        center_press_custom:
          name: Appui court — action personnalisée
          description: Exécutée seulement si « Action personnalisée » est choisie ci-dessus.
          default: []
          selector:
            action: {}
        center_double_action:
