triggers:
- trigger: event
  event_type: zha_event
  event_data:
    device_id: !input 'remote'
variables:
  manual: '{{ trigger is not defined or trigger.event is not defined }}'
  command: |-
    {{ trigger.event.data.get('command', '') | string
       if trigger is defined and trigger.event is defined and trigger.event.data is mapping else '' }}
  args: |-
    {% set raw = trigger.event.data.get('args', [])
       if trigger is defined and trigger.event is defined and trigger.event.data is mapping else [] %}
    {% set ns = namespace(items=[], fields={}) %} {% if raw is mapping %}
      {% for key, value in raw.items() %}
        {% set ns.fields = dict(ns.fields, **{key | string: (none if value is none else (value if value is boolean
             else (value | int if value is integer else (value | float if value is float else value | string))))}) %}
      {% endfor %}{{ ns.fields }}
    {% elif raw is sequence and raw is not string %}
      {% for value in raw %}
        {% set ns.items = ns.items + [none if value is none else (value if value is boolean
             else (value | int if value is integer else (value | float if value is float else value | string)))] %}
      {% endfor %}{{ ns.items }}
    {% else %}{{ [] }}{% endif %}
  params: |-
    {% set raw = trigger.event.data.get('params', {})
       if trigger is defined and trigger.event is defined and trigger.event.data is mapping else {} %}
    {% set ns = namespace(fields={}) %} {% if raw is mapping %}
      {% for key, value in raw.items() %}
        {% set ns.fields = dict(ns.fields, **{key | string: (none if value is none else (value if value is boolean
             else (value | int if value is integer else (value | float if value is float else value | string))))}) %}
      {% endfor %}
    {% endif %}{{ ns.fields }}
  dial_step: '{{ ((params.get(''step_size'', 0) | float(0)) / 2.55) | round(2) if params is mapping else 0 }}'
  now_ts: '{{ as_timestamp(now()) }}'
  event_ts: |-
