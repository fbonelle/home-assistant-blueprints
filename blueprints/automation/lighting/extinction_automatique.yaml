# Généré par tools/build_lighting.py ; modifier src/lighting/auto_off.yaml.
# Extinction automatique d'un éclairage après une durée d'allumage.
#
# Écrit pour ce dépôt. Il reprend seulement l'idée générale d'une minuterie d'extinction ;
# aucun code d'un autre blueprint n'est repris (voir NOTICE).
#
# Fonctionnement :
# - une entité suivie passe à « on » → la minuterie démarre (ou redémarre) ;
# - toutes les entités suivies sont éteintes à la main → la minuterie est annulée ;
# - la minuterie arrive à son terme → les entités encore allumées sont éteintes ;
# - au démarrage de Home Assistant, une entité restée allumée sans minuterie active
#   relance la minuterie, pour qu'aucune lampe ne reste allumée indéfiniment.
#
# Avec un assistant Minuteur, le décompte est visible dans l'interface et peut survivre
# à un redémarrage (option « Restaurer » de l'assistant). Sans assistant, l'automatisation
# attend elle-même la durée ; un redémarrage ou une modification de l'automatisation
# interrompt alors l'attente, rattrapée au démarrage suivant.
blueprint:
  name: Extinction automatique de l'éclairage — 2026.11.2.0
  description: >-
    Éteint une ou plusieurs lampes ou prises après une durée d'allumage, quelle que soit
    la façon dont elles ont été allumées. Une extinction manuelle annule le décompte.
    Assistant Minuteur facultatif pour voir le temps restant.
    Guide : https://github.com/fbonelle/home-assistant-blueprints/blob/main/docs/lighting.md
  domain: automation
  author: fbonelle
  source_url: https://github.com/fbonelle/home-assistant-blueprints/blob/main/blueprints/automation/lighting/extinction_automatique.yaml
  homeassistant:
    min_version: 2026.10.0
  input:
    entities:
      name: Éclairages à éteindre
      description: Lampes, interrupteurs ou prises. L'allumage de l'un d'eux relance le décompte.
      selector:
        entity:
          multiple: true
          filter:
          - domain: [light, switch]
    duration:
      name: Durée d'allumage
      default: {hours: 0, minutes: 3, seconds: 0}
      selector:
        duration: {}
    timer:
      name: Assistant Minuteur (facultatif)
      description: >-
        Laisser vide pour que l'automatisation attende elle-même. Un même assistant ne
        doit servir qu'à une seule automatisation de ce type.
      default: ''
      selector:
        entity:
          filter:
          - domain: timer
mode: restart
max_exceeded: silent
triggers:
- trigger: state
  entity_id: !input entities
  to: 'on'
  id: turned_on
- trigger: state
  entity_id: !input entities
  to: 'off'
  id: turned_off
- trigger: event
  event_type: timer.finished
  id: finished
- trigger: homeassistant
  event: start
  id: started
variables:
  entities: !input entities
  duration: !input duration
  timer_entity: !input timer
  use_timer: "{{ timer_entity is string and timer_entity.startswith('timer.') }}"
  lit: "{{ entities | select('is_state', 'on') | list }}"
conditions:
# L'événement de fin ne concerne que l'assistant de cette automatisation.
- condition: template
  value_template: >-
    {{ trigger.id != 'finished' or
       (use_timer and trigger.event.data.get('entity_id') == timer_entity) }}
# L'extinction d'un éclairage alors qu'un autre reste allumé ne change rien : elle ne doit
# surtout pas redémarrer (et donc interrompre) une attente en cours.
- condition: template
  value_template: "{{ trigger.id != 'turned_off' or lit | count == 0 }}"
actions:
- choose:
  # Allumage, ou démarrage avec un éclairage resté allumé.
  - conditions: >-
      {{ trigger.id == 'turned_on' or
         (trigger.id == 'started' and lit | count > 0 and
          (not use_timer or not is_state(timer_entity, 'active'))) }}
    sequence:
    - if: '{{ use_timer }}'
      then:
      - action: timer.start
        target: {entity_id: '{{ timer_entity }}'}
        data:
          duration: '{{ duration }}'
      else:
      # Sans assistant, l'attente est interrompue par tout nouveau déclenchement
      # (mode restart) ; une extinction manuelle l'annule donc naturellement.
      - delay: '{{ duration }}'
      - action: homeassistant.turn_off
        target:
          entity_id: "{{ entities | select('is_state', 'on') | list }}"
  # Extinction manuelle de tous les éclairages suivis.
  - conditions: "{{ trigger.id == 'turned_off' and lit | count == 0 and use_timer and is_state(timer_entity, 'active') }}"
    sequence:
    - action: timer.cancel
      target: {entity_id: '{{ timer_entity }}'}
  # Fin du décompte.
  - conditions: "{{ trigger.id == 'finished' and lit | count > 0 }}"
    sequence:
    - action: homeassistant.turn_off
      target:
        entity_id: '{{ lit }}'
