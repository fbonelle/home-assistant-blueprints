# Generated by tools/build_lighting.py; edit src/lighting/auto_off.yaml.
# Automatic switch-off of lighting after an on time.
#
# Written for this repository. It only takes the general idea of a switch-off timer; no
# code of another blueprint is reused (see NOTICE).
#
# Behaviour:
# - a watched entity turns « on » → the timer starts (or starts again);
# - every watched entity is switched off by hand → the timer is cancelled;
# - the timer runs out → the entities still on are switched off;
# - at Home Assistant start-up, an entity left on without an active timer starts the
#   timer again, so that no lamp stays on forever.
#
# With a Timer helper, the countdown is visible in the interface and can survive a
# restart (« Restore » option of the helper). Without a helper, the automation waits for
# the duration itself; a restart or an edit of the automation then interrupts the wait,
# which is caught up at the next start-up.
blueprint:
  name: Lighting automatic switch-off — 2026.11.3.0
  description: >-
    Switches one or more lamps or plugs off after an on time, however they were switched
    on. Switching them off by hand cancels the countdown. Optional Timer helper to see the
    remaining time.
    Guide: https://github.com/fbonelle/home-assistant-blueprints/blob/main/docs/lighting.en.md
  domain: automation
  author: fbonelle
  source_url: https://github.com/fbonelle/home-assistant-blueprints/blob/main/blueprints/automation/lighting/auto_off.yaml
  homeassistant:
    min_version: 2026.10.0
  input:
    entities:
      name: Lighting to switch off
      description: Lamps, switches or plugs. Switching one of them on restarts the countdown.
      selector:
        entity:
          multiple: true
          filter:
          - domain: [light, switch]
    duration:
      name: On time
      default: {hours: 0, minutes: 3, seconds: 0}
      selector:
        duration: {}
    timer:
      name: Timer helper (optional)
      description: >-
        Leave empty for the automation to wait by itself. A helper must serve only one
        automation of this kind.
      default: ''
      selector:
        entity:
          filter:
          - domain: timer
mode: restart
max_exceeded: silent
triggers:
- trigger: state
  entity_id: !input entities
  to: 'on'
  id: turned_on
- trigger: state
  entity_id: !input entities
  to: 'off'
  id: turned_off
- trigger: event
  event_type: timer.finished
  id: finished
- trigger: homeassistant
  event: start
  id: started
variables:
  entities: !input entities
  duration: !input duration
  timer_entity: !input timer
  use_timer: "{{ timer_entity is string and timer_entity.startswith('timer.') }}"
  lit: "{{ entities | select('is_state', 'on') | list }}"
conditions:
# The finished event only concerns the helper of this automation.
- condition: template
  value_template: >-
    {{ trigger.id != 'finished' or
       (use_timer and trigger.event.data.get('entity_id') == timer_entity) }}
# Switching one lamp off while another stays on changes nothing: above all it must not
# restart (and therefore interrupt) a running wait.
- condition: template
  value_template: "{{ trigger.id != 'turned_off' or lit | count == 0 }}"
actions:
- choose:
  # Switched on, or start-up with lighting left on.
  - conditions: >-
      {{ trigger.id == 'turned_on' or
         (trigger.id == 'started' and lit | count > 0 and
          (not use_timer or not is_state(timer_entity, 'active'))) }}
    sequence:
    - if: '{{ use_timer }}'
      then:
      - action: timer.start
        target: {entity_id: '{{ timer_entity }}'}
        data:
          duration: '{{ duration }}'
      else:
      # Without a helper, the wait is interrupted by any new trigger (restart mode);
      # switching off by hand therefore cancels it naturally.
      - delay: '{{ duration }}'
      - action: homeassistant.turn_off
        target:
          entity_id: "{{ entities | select('is_state', 'on') | list }}"
  # Every watched lamp switched off by hand.
  - conditions: "{{ trigger.id == 'turned_off' and lit | count == 0 and use_timer and is_state(timer_entity, 'active') }}"
    sequence:
    - action: timer.cancel
      target: {entity_id: '{{ timer_entity }}'}
  # End of the countdown.
  - conditions: "{{ trigger.id == 'finished' and lit | count > 0 }}"
    sequence:
    - action: homeassistant.turn_off
      target:
        entity_id: '{{ lit }}'
