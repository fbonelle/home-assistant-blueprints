# Generated by tools/build_notifications.py; edit src/notification_system/.
blueprint:
  name: Notifications — Channel sender — 2026.11.3.1
  description: 'Sends a message on ONE channel (mobile app, ntfy or e-mail) and returns « success » only when the
    send succeeded. This script is called by the « Notifications — Dispatcher »: it isolates each channel, so that
    a failing channel is detected and compensated without blocking the others. Create a single script from this
    blueprint, then choose it in the dispatcher. Guide: https://github.com/fbonelle/home-assistant-blueprints/blob/main/docs/notification_system.en.md'
  domain: script
  homeassistant:
    min_version: 2026.8.0
  source_url: https://github.com/fbonelle/home-assistant-blueprints/blob/main/blueprints/script/notification_system/channel_sender.yaml
  author: fbonelle
  input:
    mobile:
      name: Mobile app
      input:
        mobile_service:
          name: Notification action of the main phone
          description: notify action of the mobile app that receives the messages of the « main » recipient, for
            example notify.mobile_app_my_phone.
          selector:
            text: {}
        family_service:
          name: Notification action of the whole family
          description: notify action used for the « all » target, often a notification group, for example notify.family.
            Leave empty to send to the main phone.
          default: ''
          selector:
            text: {}
        default_link:
          name: Page opened by default
          description: Path opened when tapping a notification that gives no link.
          default: /lovelace/0
          selector:
            text: {}
    ntfy:
      name: ntfy
      input:
        ntfy_entity:
          name: ntfy entity
          description: 'Notification entity of the ntfy integration (publishing topic). Leave empty when ntfy is
            not used: an ntfy send then fails, and the dispatcher falls back to the mobile app.'
          default: ''
          selector:
            entity:
              filter:
              - domain: notify
        ntfy_wait:
          name: Wait for an ntfy entity that has just become unavailable
          description: 'At Home Assistant start-up, the ntfy entity stays unavailable for a few tens of seconds.
            A message sent during that time waits for its return, at most this delay counted from when it became
            « unavailable », then the dispatcher falls back to the mobile app. An entity unavailable for longer,
            or missing, fails at once. 0: no wait.'
          default: 120
          selector:
            number:
              min: 0
              max: 600
              step: 5
              unit_of_measurement: s
              mode: box
    email:
      name: E-mail
      input:
        email_entity:
          name: SMTP notification entity
          description: 'Entity of the SMTP integration that receives the e-mail (smtp.send_message action). Leave
            empty when e-mail is not used: an e-mail send then fails and the dispatcher reports it in the log.'
          default: ''
          selector:
            entity:
              filter:
              - domain: notify
        home_url:
          name: Home Assistant address
          description: Address opened by the e-mail button when the message gives no link.
          default: http://homeassistant.local:8123
          selector:
            text:
              type: url
        media_root:
          name: Media root of attached images
          description: Media source root of the files attached by their name or local path only. It must match the
            folder declared in configuration.yaml (homeassistant > media_dirs).
          default: media-source://media_source/local
          selector:
            text: {}
        email_heading:
          name: E-mail banner
          default: 🚨 HOME AUTOMATION ALERT
          selector:
            text: {}
        email_title_prefix:
          name: Start of the e-mail subject
          description: Placed before the title, separated by a space; when empty, the subject is the title alone.
          default: '🚨 ALERT:'
          selector:
            text: {}
        email_button:
          name: Text of the e-mail button
          default: OPEN THE APP
          selector:
            text: {}
        email_logo:
          name: Logo shown at the top of the e-mail
          default: https://brands.home-assistant.io/_/homeassistant/icon.png
          selector:
            text:
              type: url
mode: parallel
max: 25
icon: mdi:send-check
fields:
  channel:
    name: Channel
    description: Channel used for this send.
    required: true
    selector:
      select:
        options:
        - mobile
        - ntfy
        - email
  title:
    name: Title
    default: Notification
    selector:
      text: {}
  message:
    name: Message
    default: No details
    selector:
      text:
        multiline: true
  click_url:
    name: Link
    description: 'Link opened from the notification. Empty: default page for the mobile app, Home Assistant address
      for the e-mail, no link for ntfy.'
    default: ''
    selector:
      text: {}
  attach_file:
    name: Attachment
    description: 'Attached image, in the form the channel expects: URL for ntfy, URL or /local/… path for the mobile
      app, media source URI, file name or remote URL for the e-mail.'
    default: ''
    selector:
      text: {}
  actions:
    name: Buttons
    description: Interactive buttons, in the channel's format (ntfy or mobile app).
    default: []
    selector:
      object: {}
  target:
    name: Recipient (mobile app)
    description: « all » sends to the whole family; any other value (« main » by default) sends to the main phone.
    default: main
    selector:
      select:
        options:
        - main
        - all
  group_tag:
    name: Notification group (mobile app)
    default: ha_info
    selector:
      text: {}
  color_hex:
    name: Color
    default: '#2196F3'
    selector:
      text: {}
  subtitle:
    name: iOS subtitle (mobile app)
    default: ℹ️ INFO
    selector:
      text: {}
  sound_name:
    name: iOS sound (mobile app)
    description: « none » makes the notification silent.
    default: default
    selector:
      text: {}
  is_critical:
    name: Break through silent mode (mobile app)
    default: false
    selector:
      boolean: {}
  skip_trace:
    name: Do not create a persistent notification (mobile app)
    description: 'Set by the relay, whose message already is a persistent notification: otherwise the same notification
      would exist twice.'
    default: false
    selector:
      boolean: {}
  notif_id:
    name: Notification identifier (mobile app)
    description: 'Identifier set for 1:1 clearing from the phone. Empty: automatic identifier sys_disp_<timestamp>.'
    default: ''
    selector:
      text: {}
  icon_url:
    name: Icon (ntfy)
    default: ''
    selector:
      text: {}
  priority:
    name: Priority (ntfy)
    default: 3
    selector:
      number:
        min: 1
        max: 5
        mode: box
  tags:
    name: Emoji tags (ntfy)
    default: []
    selector:
      object: {}
  extra_html:
    name: HTML added to the body (e-mail)
    default: ''
    selector:
      text:
        multiline: true
variables:
  mobile_service: !input 'mobile_service'
  family_service: !input 'family_service'
  default_link: !input 'default_link'
  ntfy_entity: !input 'ntfy_entity'
  ntfy_wait: !input 'ntfy_wait'
  email_entity: !input 'email_entity'
  home_url: !input 'home_url'
  media_root: !input 'media_root'
  email_heading: !input 'email_heading'
  email_title_prefix: !input 'email_title_prefix'
  email_button: !input 'email_button'
  email_logo: !input 'email_logo'
sequence:
- variables:
    channel: '{{ channel | default('''', true) }}'
    title: '{{ title | default(''Notification'', true) }}'
    message: '{{ message | default(''No details'', true) }}'
    click_url: '{{ click_url | default('''', true) }}'
    attach_file: '{{ attach_file | default('''', true) }}'
    actions: '{{ actions | default([], true) }}'
    target: '{{ target | default(''main'', true) }}'
    group_tag: '{{ group_tag | default(''ha_info'', true) }}'
    color_hex: '{{ color_hex | default(''#2196F3'', true) }}'
    subtitle: '{{ subtitle | default(''ℹ️ INFO'', true) }}'
    sound_name: '{{ sound_name | default(''default'', true) }}'
    is_critical: '{{ is_critical | default(false) | bool }}'
    skip_trace: '{{ skip_trace | default(false) | bool }}'
    notif_id: '{{ notif_id | default('''', true) }}'
    icon_url: '{{ icon_url | default('''', true) }}'
    priority: '{{ priority | default(3) | int(3) }}'
    tags: '{{ tags | default([], true) }}'
    extra_html: '{{ extra_html | default('''', true) }}'
- choose:
  - conditions:
    - condition: template
      value_template: '{{ channel == ''ntfy'' }}'
    sequence:
    - variables:
        payload: |
          {% set p = {
            "entity_id": ntfy_entity,
            "title": title,
            "message": message,
            "priority": priority | int(3),
            "tags": tags,
            "click": click_url,
            "icon": icon_url,
            "markdown": true
          } %} {% if attach_file is defined and attach_file | string not in ['', 'None'] %}
            {% set p = dict(p, attach=attach_file) %}
          {% endif %} {% if actions is defined and actions | string not in ['[]', '', 'None'] %}
            {% set p = dict(p, actions=actions) %}
          {% endif %} {{ p }}
    - variables:
        ntfy_remaining: |-
          {% if ntfy_entity and expand(ntfy_entity) | count > 0 and is_state(ntfy_entity, 'unavailable') %}
            {% set elapsed = (now() - states[ntfy_entity].last_changed).total_seconds() %}
            {{ [(ntfy_wait | float(0)) - elapsed, 0] | max | round(0, 'ceil') | int }}
          {% else %}0{% endif %}
    - if:
      - condition: template
        value_template: '{{ ntfy_remaining | int(0) > 0 }}'
      then:
      - wait_template: '{{ not is_state(ntfy_entity, ''unavailable'') }}'
        timeout:
          seconds: '{{ ntfy_remaining | int(0) }}'
        continue_on_timeout: true
    - if:
      - condition: template
        value_template: '{{ expand(ntfy_entity) | count == 0 or is_state(ntfy_entity, ''unavailable'') }}'
      then:
      - stop: ntfy entity missing or unavailable; cannot send.
        error: true
    - action: ntfy.publish
      data: '{{ payload }}'
    - variables:
        result:
          status: success
    - stop: ntfy sent
      response_variable: result
  - conditions:
    - condition: template
      value_template: '{{ channel == ''mobile'' }}'
    sequence:
    - variables:
        notif_uid: |
          {% set n = notif_id | default('') | string | trim %} {% if n in ['', 'None'] %}sys_disp_{{ as_timestamp(now()) | replace('.', '') }} {% elif n.startswith('sys_disp_') %}{{ n }} {% else %}sys_disp_{{ n }}{% endif %}
        link: |
          {% set l = click_url | default('') | string | trim %} {{ default_link if l in ['', 'None'] else l }}
        service: |
          {% set f = family_service | default('') | string | trim %} {{ f if target == 'all' and f != '' else mobile_service }}
    - if:
      - condition: template
        value_template: '{{ not (skip_trace | default(false) | bool) }}'
      then:
      - action: persistent_notification.create
        continue_on_error: true
        data:
          title: '{{ title }}'
          message: '{{ message }}'
          notification_id: '{{ notif_uid }}'
    - variables:
        ha_data: |
          {% if is_critical | default(false) | bool %}
            {% set sound_dict = {"name": sound_name, "critical": 1, "volume": 1.0} %}
          {% else %}
            {% set sound_dict = {"name": sound_name} %}
          {% endif %} {% set p = {
            "group": group_tag,
            "tag": notif_uid,
            "url": link,
            "clickAction": link,
            "color": color_hex,
            "subtitle": subtitle,
            "push": {"sound": sound_dict}
          } %} {#- `push` and `subtitle` are read by iOS only. The keys below are the
              Android equivalent; both sets coexist, each platform ignoring the other.
              On Android, breaking through Do Not Disturb also requires allowing the
              channel in the phone settings. -#}
          {% if is_critical | default(false) | bool %}
            {% set p = dict(p, ttl=0, priority='high', channel='Critical alert', importance='high') %}
          {% endif %} {% if attach_file is defined and attach_file | string not in ['', 'None'] %}
            {% set p = dict(p, image=attach_file) %}
          {% endif %} {% if actions is defined and actions | string not in ['[]', '', 'None'] %}
            {% set p = dict(p, actions=actions) %}
          {% endif %} {{ p }}
    - action: '{{ service }}'
      data:
        title: '{{ title }}'
        message: '{{ message }}'
        data: '{{ ha_data }}'
    - variables:
        result:
          status: success
    - stop: Mobile app notified
      response_variable: result
  - conditions:
    - condition: template
      value_template: '{{ channel == ''email'' }}'
    sequence:
    - variables:
        attach_raw: '{{ attach_file | default('''') | string | trim }}'
        attach_kind: |
          {% if attach_raw in ['', 'None'] %}none {% elif attach_raw.startswith('http') %}remote {% else %}local{% endif %}
        attach_name: '{{ attach_raw.split(''?'')[0].split(''/'')[-1] }}'
        attach_mime: |
          {% set ext = attach_name.split('.')[-1] | lower %} {% if ext == 'png' %}image/png {% elif ext in ['jpg', 'jpeg'] %}image/jpeg {% elif ext == 'gif' %}image/gif {% elif ext == 'webp' %}image/webp {% else %}application/octet-stream{% endif %}
        attach_uri: |
          {% if attach_raw.startswith('media-source://') %}{{ attach_raw }} {% else %}{{ media_root ~ '/' ~ attach_name }}{% endif %}
        img_src: '{{ attach_raw if attach_kind == ''remote'' else ''cid:snapshot'' }}'
        link: |
          {% set l = click_url | default('') | string | trim %} {{ home_url if l in ['', 'None'] else l }}
        html_content: |
          <!DOCTYPE html> <html> <body style="font-family: Arial, sans-serif; color: #333; margin: 0; padding: 20px; background-color: #f4f4f4;"> <div style="background-color: #fff; border: 1px solid #ddd; max-width: 600px; margin: 0 auto; box-shadow: 0 2px 5px rgba(0,0,0,0.1); border-radius: 8px; overflow: hidden;"> <div style="text-align: center; padding: 20px; background-color: #ffffff; border-bottom: 1px solid #eee;"> <img src="{{ email_logo }}" width="64" height="64" alt="Home Assistant" style="display: inline-block;"> </div> <div style="background-color: {{ color_hex }}; color: white; padding: 15px; text-align: center;"> <h2 style="margin: 0; text-transform: uppercase; font-size: 20px;">{{ email_heading }}</h2> </div> <div style="padding: 25px;"> <h3 style="color: {{ color_hex }}; margin-top: 0; font-size: 18px;">{{ title }}</h3> <p style="font-size: 16px; line-height: 1.6; margin-bottom: 25px;"> {{ message | replace('\n', '<br>') }} {% if extra_html | default('') | string | length > 0 %} <br><br>{{ extra_html }} {% endif %} </p> {% if attach_kind != 'none' %} <div style="text-align: center; margin-bottom: 25px;"> <img src="{{ img_src }}" alt="Snapshot" style="max-width: 100%; height: auto; border-radius: 6px; border: 1px solid #eee;"> </div> {% endif %} <div style="text-align: center; margin-bottom: 30px;"> <a href="{{ link }}" style="background-color: {{ color_hex }}; color: white; padding: 12px 25px; text-decoration: none; font-weight: bold; border-radius: 4px; font-size: 14px;">{{ email_button }}</a> </div> </div> </div> </body> </html>
        payload: |
          {% set p = {
            "title": (email_title_prefix | trim ~ ' ' ~ title) if email_title_prefix | trim != '' else title,
            "message": message,
            "html": html_content
          } %} {% if attach_kind == 'local' %}
            {% set p = dict(p, attachments=[{
              "media_source": {"media_content_id": attach_uri, "media_content_type": attach_mime},
              "filename": attach_name,
              "content_id": "snapshot"
            }]) %}
          {% endif %} {{ p }}
    - action: smtp.send_message
      target:
        entity_id: '{{ email_entity }}'
      data: '{{ payload }}'
    - variables:
        result:
          status: success
    - stop: E-mail sent
      response_variable: result
  default:
  - stop: Unknown channel
    error: true
