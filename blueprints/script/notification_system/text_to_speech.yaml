# Generated by tools/build_notifications.py; edit src/notification_system/.
blueprint:
  name: Notifications — Text-to-speech — 2026.11.3.0
  description: 'Reads a message aloud on the speakers carrying a chosen label, one announcement after the other.
    At the « critical » level, the volume is raised and the speakers'' state is restored after the reading. A switch
    mutes all reading. Called by the « Notifications — Dispatcher »; usable on its own with the message and level
    fields. Guide: https://github.com/fbonelle/home-assistant-blueprints/blob/main/docs/notification_system.en.md'
  domain: script
  homeassistant:
    min_version: 2026.10.0
  source_url: https://github.com/fbonelle/home-assistant-blueprints/blob/main/blueprints/script/notification_system/text_to_speech.yaml
  author: fbonelle
  input:
    tts_entity:
      name: Text-to-speech engine
      description: tts entity used to speak, for example tts.piper.
      selector:
        entity:
          filter:
          - domain: tts
    speaker_label:
      name: Speaker label
      description: 'Only the media players carrying this label speak. Without an available labelled speaker, nothing
        is read and a warning is written to the log: the script never picks a speaker at random.'
      default: tts
      selector:
        label: {}
    mute_entity:
      name: Mute switch
      description: Boolean input that, when on, mutes all reading. Leave empty to never mute.
      default: ''
      selector:
        entity:
          filter:
          - domain: input_boolean
    critical_volume:
      name: Volume of critical announcements
      default: 0.8
      selector:
        number:
          min: 0.1
          max: 1
          step: 0.05
          mode: slider
    chars_per_second:
      name: Estimated reading rate
      description: 'Used to estimate the duration of a critical announcement before restoring the speakers: text
        length divided by this rate, plus 2 seconds.'
      default: 12
      selector:
        number:
          min: 5
          max: 30
          step: 1
          unit_of_measurement: characters/s
          mode: box
mode: queued
max: 15
icon: mdi:account-voice
fields:
  message:
    name: Text to say
    example: Hello
    required: true
    selector:
      text:
        multiline: true
  level:
    name: Level
    description: « critical » raises the volume, then restores the speakers' state.
    default: info
    selector:
      select:
        options:
        - info
        - warning
        - critical
        - technical
variables:
  tts_entity: !input 'tts_entity'
  speaker_label: !input 'speaker_label'
  mute_entity: !input 'mute_entity'
  critical_volume: !input 'critical_volume'
  chars_per_second: !input 'chars_per_second'
sequence:
- variables:
    message: '{{ message | default('''', true) }}'
    level: '{{ level | default(''info'', true) }}'
- condition: template
  value_template: |
    {{ mute_entity | default('') | string | trim == '' or not is_state(mute_entity, 'on') }}
- variables:
    active_speakers: |
      {{ label_entities(speaker_label) | default([], true)
         | select('match', '^media_player[.]')
         | reject('is_state', ['unavailable', 'unknown'])
         | list }}
    tts_delay: '{{ (message | length / (chars_per_second | float(12))) | int + 2 }}'
    restore_scene: '{{ ''tts_restore_'' ~ this.entity_id.split(''.'')[1] }}'
- if:
  - condition: template
    value_template: '{{ active_speakers | length == 0 }}'
  then:
  - action: system_log.write
    data:
      level: warning
      logger: notification_system
      message: '[Text-to-speech] No speaker available with the « {{ speaker_label }} » label.'
  - stop: No target speaker
- if:
  - condition: template
    value_template: '{{ level == ''critical'' }}'
  then:
  - action: scene.create
    data:
      scene_id: '{{ restore_scene }}'
      snapshot_entities: '{{ active_speakers }}'
- repeat:
    for_each: '{{ active_speakers }}'
    sequence:
    - if:
      - condition: template
        value_template: '{{ level == ''critical'' }}'
      then:
      - action: media_player.volume_set
        continue_on_error: true
        target:
          entity_id: '{{ repeat.item }}'
        data:
          volume_level: '{{ critical_volume | float(0.8) }}'
    - action: tts.speak
      continue_on_error: true
      target:
        entity_id: '{{ tts_entity }}'
      data:
        media_player_entity_id: '{{ repeat.item }}'
        message: '{{ message }}'
        cache: true
- if:
  - condition: template
    value_template: '{{ level == ''critical'' }}'
  then:
  - delay:
      seconds: '{{ tts_delay }}'
  - action: scene.turn_on
    continue_on_error: true
    target:
      entity_id: '{{ ''scene.'' ~ restore_scene }}'
