# SPDX-License-Identifier: GPL-3.0-only
# Profiles of the ZHA remotes.
#
# Every profile describes only what sets a model apart: its device filter, the
# translation of its zha_event events into normalised gestures, the list of its gestures
# and its default settings. All the lighting logic lives in engine.yaml and applies in
# the same way to every model.
#
# The event formats were read from the zha-quirks 2.4.1 profiles applied to the devices
# of the house (current SwitchAQ3B profile for the Aqara button) and confirmed by the
# existing automation traces.
#
# Variables available in « decode »: command (text), args (list or mapping), params
# (mapping). The result is a gesture name, « stop » for a release that must end a running
# change, or an empty string for an ignored event.
#
# Ignored events do not pass the automation condition: they therefore never restart a
# running action (restart mode).
#
# « repeating_hold: true » marks a model that repeats the hold event itself while the
# button is held down: every repetition then produces a single step, with no internal
# loop, to keep a steady speed.
#
# « double: true » on a short press adds the « Double press » gesture (key
# <button>_double), usable with the memory helper; « double_default » gives its default
# action (« none » otherwise). It is offered only on models whose firmware does not report
# the double press itself.
#
# « palette » replaces, for one model, the list of presets offered by default.

hue_dimmer:
  file: hue_dimmer_remote.yaml
  name: Philips Hue Dimmer remote (RWL022) — ZHA
  description: >-
    Four buttons (On/Off, Up, Down, Hue). For every short press or hold, choose the action
    from the shared list or a custom action.
  filter:
    integration: zha
    manufacturer: Signify Netherlands B.V.
    model: RWL022
  repeating_hold: true
  targets: single
  decode: >-
    {% set names = {'on_press': 'power_press', 'on_hold': 'power_hold',
                    'up_press': 'up_press', 'up_hold': 'up_hold',
                    'down_press': 'down_press', 'down_hold': 'down_hold',
                    'off_press': 'hue_press', 'off_hold': 'hue_hold'} %}
    {% if command in names %}{{ names[command] }}
    {% elif command.endswith('_long_release') %}stop
    {% endif %}
  sections:
  - key: power
    name: On/Off button
    icon: mdi:power
    gestures:
    - {key: power_press, label: Short press, default: toggle}
    - {key: power_hold, label: Hold, hold: true, default: none}
  - key: up
    name: Up button
    icon: mdi:brightness-7
    gestures:
    - {key: up_press, label: Short press, default: brighter}
    - {key: up_hold, label: Hold, hold: true, default: brighter_hold}
  - key: down
    name: Down button
    icon: mdi:brightness-5
    gestures:
    - {key: down_press, label: Short press, default: dimmer}
    - {key: down_hold, label: Hold, hold: true, default: dimmer_hold}
  - key: hue
    name: Hue button
    icon: mdi:alpha-h-circle-outline
    gestures:
    - {key: hue_press, label: Short press, default: full}
    - {key: hue_hold, label: Hold, hold: true, default: none}
  settings:
    step_pct: 10
    hold_step_pct: 10
    transition: 0

hue_tap_dial:
  file: hue_tap_dial_remote.yaml
  name: Philips Hue Tap Dial remote (RDM002) — ZHA
  description: >-
    Four buttons, one lamp per button, and a dial. The dial acts on the lamp switched on
    most recently among the four (or, when all are off, on the one used most recently),
    with no memory helper. When a group and its members change together, it acts on the
    lamp the remote commanded.
  filter:
    integration: zha
    manufacturer: Signify Netherlands B.V.
    model: RDM002
  repeating_hold: true
  targets: dial
  decode: >-
    {% if command is match('^button_[1-4]_(press|hold)$') %}{{ command }}
    {% elif command is match('^button_[1-4]_long_release$') %}stop
    {% elif command == 'step_with_on_off' %}
      {% set mode = (params.get('step_mode') if params is mapping else none) | string %}
      {% if mode in ['0', 'StepMode.Up', 'Up', 'up'] %}dial_up
      {% elif mode in ['1', 'StepMode.Down', 'Down', 'down'] %}dial_down{% endif %}
    {% endif %}
  sections:
  - key: button_1
    name: Button 1
    icon: mdi:numeric-1-circle-outline
    gestures:
    - {key: button_1_press, label: Short press, default: toggle}
    - {key: button_1_hold, label: Hold, hold: true, default: none}
  - key: button_2
    name: Button 2
    icon: mdi:numeric-2-circle-outline
    gestures:
    - {key: button_2_press, label: Short press, default: toggle}
    - {key: button_2_hold, label: Hold, hold: true, default: none}
  - key: button_3
    name: Button 3
    icon: mdi:numeric-3-circle-outline
    gestures:
    - {key: button_3_press, label: Short press, default: toggle}
    - {key: button_3_hold, label: Hold, hold: true, default: none}
  - key: button_4
    name: Button 4
    icon: mdi:numeric-4-circle-outline
    gestures:
    - {key: button_4_press, label: Short press, default: toggle}
    - {key: button_4_hold, label: Hold, hold: true, default: none}
  - key: dial
    name: Dial
    icon: mdi:knob
    gestures:
    - {key: dial_up, label: Turn right, default: brighter}
    - {key: dial_down, label: Turn left, default: dimmer}
  # The remote sometimes sends the same press twice a few tens of milliseconds apart; the
  # dial sends at most one event every 0.5 s.
  settings:
    step_pct: 10
    hold_step_pct: 10
    transition: 1
    debounce_ms: 100

ikea_on_off:
  file: ikea_on_off_switch.yaml
  name: IKEA TRÅDFRI on/off switch — ZHA
  description: >-
    Two buttons (I and O). Short press and hold can be set; a hold stops on release or,
    when the radio release is lost, after the maximum duration.
  filter:
    integration: zha
    manufacturer: IKEA of Sweden
    model: TRADFRI on/off switch
  repeating_hold: false
  targets: single
  decode: >-
    {% set names = {'on': 'on_press', 'off': 'off_press',
                    'move_with_on_off': 'on_hold', 'move': 'off_hold'} %}
    {% if command in names %}{{ names[command] }}
    {% elif command in ['stop', 'stop_with_on_off', 'move_up_release', 'move_down_release'] %}stop
    {% endif %}
  sections:
  - key: on_button
    name: I button
    icon: mdi:toggle-switch
    gestures:
    - {key: on_press, label: Short press, default: 'on', double: true}
    - {key: on_hold, label: Hold, hold: true, default: brighter_hold}
  - key: off_button
    name: O button
    icon: mdi:toggle-switch-off
    gestures:
    - {key: off_press, label: Short press, default: 'off', double: true}
    - {key: off_hold, label: Hold, hold: true, default: dimmer_hold}
  settings:
    hold_step_pct: 10
    hold_interval: 1
    transition: 1

ikea_5_buttons:
  file: ikea_5_button_remote.yaml
  name: IKEA TRÅDFRI 5-button remote — ZHA
  description: >-
    Center, Up, Down, Left and Right buttons. Replaces the former « whites » and
    « presets » variants: choose the white temperature or the color palette for Left and
    Right.
  filter:
    integration: zha
    manufacturer: IKEA of Sweden
    model: TRADFRI remote control
  repeating_hold: false
  targets: single
  # Holding the center button produces « release » with a zero first parameter (recent
  # firmware) or « move_to_level_with_on_off » (older firmware). Side releases produce
  # « release » with the hold duration.
  decode: >-
    {% set p1 = params.get('param1') if params is mapping and params.get('param1') is not none
       else (args[0] if args is sequence and args is not string and args | count > 0 else none) %}
    {% if command == 'toggle' %}center_press
    {% elif command == 'move_to_level_with_on_off' or (command == 'release' and p1 == 0) %}center_hold
    {% elif command == 'step_with_on_off' %}up_press
    {% elif command == 'move_with_on_off' %}up_hold
    {% elif command == 'step' %}down_press
    {% elif command == 'move' %}down_hold
    {% elif command == 'press' and p1 == 257 %}left_press
    {% elif command == 'press' and p1 == 256 %}right_press
    {% elif command == 'hold' and p1 == 3329 %}left_hold
    {% elif command == 'hold' and p1 == 3328 %}right_hold
    {% elif command in ['stop', 'stop_with_on_off', 'release', 'move_up_release', 'move_down_release'] %}stop
    {% endif %}
  sections:
  - key: center
    name: Center button
    icon: mdi:power
    gestures:
    - {key: center_press, label: Short press, default: toggle, double: true}
    - {key: center_hold, label: Hold, hold: true, default: full_reference}
  - key: up
    name: Up button
    icon: mdi:brightness-7
    gestures:
    - {key: up_press, label: Short press, default: brighter, double: true}
    - {key: up_hold, label: Hold, hold: true, default: brighter_hold}
  - key: down
    name: Down button
    icon: mdi:brightness-5
    gestures:
    - {key: down_press, label: Short press, default: dimmer, double: true}
    - {key: down_hold, label: Hold, hold: true, default: dimmer_hold}
  - key: left
    name: Left button
    icon: mdi:chevron-left
    gestures:
    - {key: left_press, label: Short press, default: previous_preset, double: true}
    - {key: left_hold, label: Hold, hold: true, default: previous_preset_hold}
  - key: right
    name: Right button
    icon: mdi:chevron-right
    gestures:
    - {key: right_press, label: Short press, default: next_preset, double: true}
    - {key: right_hold, label: Hold, hold: true, default: next_preset_hold}
  settings:
    step_pct: 20
    hold_step_pct: 10
    hold_interval: 0.5
    preset_hold_interval: 0.5
    transition: 0.5
    color_transition: 0.5

ikea_styrbar:
  file: ikea_styrbar_remote.yaml
  name: IKEA STYRBAR remote — ZHA
  description: >-
    Up, Down, Left and Right, short press and hold. With the memory helper, a double
    press on Up recalls the chosen color, like the former STYRBAR blueprint.
  filter:
    integration: zha
    manufacturer: IKEA of Sweden
    model: Remote Control N2
  repeating_hold: false
  targets: single
  decode: >-
    {% set p1 = params.get('param1') if params is mapping and params.get('param1') is not none
       else (args[0] if args is sequence and args is not string and args | count > 0 else none) %}
    {% if command == 'on' %}up_press
    {% elif command == 'off' %}down_press
    {% elif command == 'move_with_on_off' %}up_hold
    {% elif command == 'move' %}down_hold
    {% elif command == 'press' and p1 == 257 %}left_press
    {% elif command == 'press' and p1 == 256 %}right_press
    {% elif command == 'hold' and p1 == 3329 %}left_hold
    {% elif command == 'hold' and p1 == 3328 %}right_hold
    {% elif command in ['stop', 'stop_with_on_off', 'release', 'move_up_release', 'move_down_release'] %}stop
    {% endif %}
  sections:
  - key: up
    name: Up button
    icon: mdi:chevron-up
    gestures:
    - {key: up_press, label: Short press, default: 'on', double: true, double_default: recall}
    - {key: up_hold, label: Hold, hold: true, default: brighter_hold}
  - key: down
    name: Down button
    icon: mdi:chevron-down
    gestures:
    - {key: down_press, label: Short press, default: 'off', double: true}
    - {key: down_hold, label: Hold, hold: true, default: dimmer_hold}
  - key: left
    name: Left button
    icon: mdi:chevron-left
    gestures:
    - {key: left_press, label: Short press, default: previous_preset, double: true}
    - {key: left_hold, label: Hold, hold: true, default: previous_preset_hold}
  - key: right
    name: Right button
    icon: mdi:chevron-right
    gestures:
    - {key: right_press, label: Short press, default: next_preset, double: true}
    - {key: right_hold, label: Hold, hold: true, default: next_preset_hold}
  # Settings and palette of the former STYRBAR blueprint (version 1.0.0).
  settings:
    brightness_speed: 35
    hold_interval: 0.3
    preset_hold_interval: 0.4
    hold_limit: 15
    color_transition: 0.3
    debounce_ms: 50
  palette: [ha_warm, ha_soft, ha_white, ikea_amber, ikea_peach, ikea_dark_peach, ikea_dark_red,
            ikea_pink, ikea_light_pink, ikea_dark_pink, ikea_light_purple, ikea_dark_purple,
            ikea_blue, ikea_light_blue, ikea_lime, ikea_yellow]

ewelink_button:
  file: ewelink_button.yaml
  name: eWeLink / SONOFF button (WB01, SNZB-01P, CK-TLSR8656) — ZHA
  description: >-
    One button: single click, double click and long press. Gestures are read from the
    commands sent by the button, never from state reports, which can be sent with no press.
  filter:
    - integration: zha
      manufacturer: eWeLink
      model: WB01
    - integration: zha
      manufacturer: eWeLink
      model: SNZB-01P
    - integration: zha
      manufacturer: eWeLink
      model: CK-TLSR8656-SS5-01(7000)
  repeating_hold: false
  targets: single
  decode: >-
    {{ {'toggle': 'single_press', 'on': 'double_press', 'off': 'long_press'}.get(command, '') }}
  sections:
  - key: button
    name: Button
    icon: mdi:gesture-tap-button
    gestures:
    - {key: single_press, label: Single click, default: toggle_level}
    - {key: double_press, label: Double click, default: alternate}
    - {key: long_press, label: Long press, default: none}
  settings:
    on_level_pct: 25
    high_level_pct: 100
    transition: 0

# zha-quirks SwitchAQ3B profile: the button reports the single and double press itself, as
# well as the start and end of a hold, in attribute 0x0055 of its Multistate Input
# cluster. Every value becomes a zha_event command whose « args » is
# {'value': <received value>}: single (1), double (2), hold (0) and release (255).
# Since the firmware reports the double press, it needs no memory helper. The hold is not
# repeated: the change runs at the set tick until release.
aqara_button:
  file: aqara_button.yaml
  name: Aqara wireless button (WXKG11LM, lumi.remote.b1acn01) — ZHA
  description: >-
    One button: single press, double press and hold, all three reported by the button
    itself. A hold stops on release or, when the radio release is lost, after the maximum
    duration.
  filter:
    integration: zha
    manufacturer: LUMI
    model: lumi.remote.b1acn01
  repeating_hold: false
  targets: single
  decode: >-
    {{ {'single': 'single_press', 'double': 'double_press', 'hold': 'button_hold',
        'release': 'stop'}.get(command, '') }}
  sections:
  - key: button
    name: Button
    icon: mdi:gesture-tap-button
    gestures:
    - {key: single_press, label: Single press, default: toggle}
    - {key: double_press, label: Double press, default: none}
    - {key: button_hold, label: Hold, hold: true, default: none}
