# Palette des préréglages de couleur des télécommandes d'éclairage.
#
# La clé est l'identifiant stable utilisé dans les automatisations ; le nom est
# l'étiquette française affichée dans l'interface. Le premier préréglage de la liste
# choisie dans une instance sert aussi de « couleur de référence ».
#
# Chaque préréglage est envoyé à la lampe dans son format d'origine (hs_color,
# rgb_color ou xy_color), sans conversion. tools/build_lighting.py calcule en plus ses
# coordonnées xy, qui servent seulement à reconnaître le préréglage le plus proche de la
# couleur affichée par une lampe.
#
# Première partie : les 21 options de l'ancien assistant input_select.ikea_light_color_select,
# dans le même ordre (teinte en degrés, saturation en pour cent).
default:
  name: Défaut (blanc chaud doré)
  hs: [38, 53]
blue:
  name: Bleu
  hs: [247.559, 49.804]
light_blue:
  name: Bleu clair
  hs: [222.692, 40.784]
saturated_purple:
  name: Violet saturé
  hs: [305.455, 69.02]
lime:
  name: Vert citron
  hs: [75.821, 78.824]
light_purple:
  name: Violet clair
  hs: [312.558, 33.725]
yellow:
  name: Jaune
  hs: [65.647, 66.667]
saturated_pink:
  name: Rose saturé
  hs: [333.474, 74.51]
dark_peach:
  name: Pêche foncé
  hs: [10.971, 68.627]
saturated_red:
  name: Rouge saturé
  hs: [9.016, 75.686]
cold_sky:
  name: Ciel froid
  hs: [196.552, 11.373]
pink:
  name: Rose
  hs: [338.478, 36.078]
peach:
  name: Pêche
  hs: [16.897, 68.235]
warm_amber:
  name: Ambre chaud
  hs: [28.308, 76.471]
light_pink:
  name: Rose pâle
  hs: [316.957, 18.039]
cool_daylight:
  name: Lumière du jour froide
  hs: [196.667, 7.059]
candlelight:
  name: Bougie
  hs: [41.613, 72.941]
