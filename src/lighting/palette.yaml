# Seconde partie : la palette de l'ancien blueprint STYRBAR de cette collection,
# reprise à l'identique : trois blancs de référence Home Assistant et 20 préréglages TRÅDFRI.
# Les trois aplats de référence fournis par l'auteur, en RGB (aucune estimation en kelvins).
ha_warm:
  name: Home Assistant — blanc chaud de référence
  rgb_color: [255, 192, 140]
ha_soft:
  name: Home Assistant — blanc intermédiaire de référence
  rgb_color: [255, 228, 206]
ha_white:
  name: Home Assistant — blanc clair de référence
  rgb_color: [255, 254, 250]
# Coordonnées xy relevées dans l'application TRÅDFRI par node-tradfri-client :
# https://github.com/AlCalzone/node-tradfri-client/blob/master/src/lib/predefined-colors.ts
