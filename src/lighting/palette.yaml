# Second part: the palette of the former STYRBAR blueprint of this collection, unchanged:
# three Home Assistant reference whites and 20 TRÅDFRI presets.
# The three reference swatches supplied by the author, in RGB (no estimate in kelvins).
ha_warm:
  name: Home Assistant — reference warm white
  rgb_color: [255, 192, 140]
ha_soft:
  name: Home Assistant — reference soft white
  rgb_color: [255, 228, 206]
ha_white:
  name: Home Assistant — reference bright white
  rgb_color: [255, 254, 250]
