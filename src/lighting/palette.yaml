# Color presets of the lighting remotes.
#
# The key is the stable identifier used in automations; the name is the label shown in
# the interface. The first preset of the list chosen in an automation is also its
# « reference color ».
#
# Every preset is sent to the lamp in its original format (hs_color, rgb_color or
# xy_color), with no conversion. tools/build_lighting.py also computes its xy coordinates,
# used only to recognise the preset nearest to the color shown by a lamp.
#
# First part: the 21 options of the former input_select.ikea_light_color_select helper,
# in the same order (hue in degrees, saturation in percent).
default:
  name: Default (golden warm white)
  hs: [38, 53]
