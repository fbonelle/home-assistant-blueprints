# SPDX-License-Identifier: GPL-3.0-only
# Shared engine of the lighting remotes.
#
# tools/build_lighting.py embeds this file into every model blueprint at build time. At
# run time every blueprint is therefore self-contained: no shared script, and one
# automation trace shows the whole handling of a gesture.
#
# Principles:
# - the automation's « restart » mode stops a running change as soon as another
#   recognised gesture or a release arrives; events without an action are rejected by the
#   condition and therefore never interrupt anything;
# - a continuous change is always bounded by the maximum hold duration, even when the
#   radio release is lost;
# - the lamp state is read again at every step: a change made elsewhere is respected, and
#   a lamp switched off during a hold is never switched back on by that hold;
# - dimming stops at the minimum brightness and never switches the lamp off;
# - every command sent to the lamp starts from the state read just before it.
#
# Optional memory helper (Text helper, maximum length 255):
# - without a helper, everything works except the double press; the current preset is
#   deduced from the colour shown by the lamp; a release stops the change and the lamp
#   finishes its last transition;
# - with a helper, it adds the double press, the exact position in the palette, the
#   rejection of events received out of order, the difference between a repeated hold
#   and a new hold, and stopping at the level actually reached on release;
# - the helper is written at the start of every gesture, before any command: an
#   interrupted gesture never leaves a hold « armed »;
# - an unreadable helper, or one used by another automation, is never overwritten: a
#   notification reports it and the remote works without memory.

# Actions offered for every gesture. « hold_only » reserves an action for holds.
actions_catalog:
- {value: none, label: No action}
- {value: toggle, label: Toggle on/off}
- {value: toggle_level, label: 'Toggle, turning on at the on level'}
- {value: 'on', label: Turn on}
- {value: 'off', label: Turn off}
- {value: level, label: Turn on at the on level}
- {value: full, label: Full brightness}
- {value: full_reference, label: Full brightness and reference color}
- {value: recall, label: Recall color (brightness kept)}
- {value: alternate, label: Alternate between on level and high level}
- {value: brighter, label: Brighter by one step}
- {value: dimmer, label: Dimmer by one step}
- {value: brighter_hold, label: Brighter continuously, hold_only: true}
- {value: dimmer_hold, label: Dimmer continuously, hold_only: true}
- {value: cooler, label: Cooler white by one step}
- {value: warmer, label: Warmer white by one step}
- {value: cooler_hold, label: Cooler white continuously, hold_only: true}
- {value: warmer_hold, label: Warmer white continuously, hold_only: true}
- {value: next_preset, label: Next color preset}
- {value: previous_preset, label: Previous color preset}
- {value: next_preset_hold, label: Next presets continuously, hold_only: true}
- {value: previous_preset_hold, label: Previous presets continuously, hold_only: true}
- {value: custom, label: Custom action}

# Optional memory helper, kept outside the settings section so that it stays visible.
memory_input:
  name: Memory helper (optional)
  description: >-
    Text helper with a maximum length of 255, used by this automation only. Required for
    the double press; also brings the exact position in the palette, the rejection of
    out-of-order events and stopping at the level reached on release. Without a helper,
    everything else works.
  default: ''
  selector:
    entity:
      filter:
      - domain: input_text

# Shared settings, grouped in a collapsed section. The profiles of models.yaml may change
# the default values (« settings » key).
settings_inputs:
  step_pct:
    name: Brightness step
    description: Change applied by a « one step » press.
    default: 10
    selector:
      number: {min: 1, max: 50, step: 1, unit_of_measurement: '%', mode: box}
  brightness_speed:
    name: Dimming speed during a hold
    description: >-
      Brightness points per second; 35 covers the whole range in about 3 seconds. 0 uses
      the hold brightness step at every tick.
    default: 0
    selector:
      number: {min: 0, max: 100, step: 1, unit_of_measurement: '%/s', mode: box}
  hold_step_pct:
    name: Brightness step during a hold
    description: >-
      Used when the speed is 0. For remotes that repeat the hold themselves (Philips Hue),
      change applied at every repetition.
    default: 10
    selector:
      number: {min: 1, max: 50, step: 1, unit_of_measurement: '%', mode: box}
  hold_interval:
    name: Brightness tick during a hold
    description: Interval between two brightness commands of a hold.
    default: 0.5
    selector:
      number: {min: 0.2, max: 2, step: 0.1, unit_of_measurement: s, mode: box}
  preset_hold_interval:
    name: Color and white tick during a hold
    description: Interval between two presets or two temperature steps of a hold.
    default: 0.5
    selector:
      number: {min: 0.2, max: 3, step: 0.1, unit_of_measurement: s, mode: box}
  hold_limit:
    name: Maximum hold duration
    description: Automatic stop of a continuous change when the radio release is lost.
    default: 10
    selector:
      number: {min: 2, max: 60, step: 1, unit_of_measurement: s, mode: box}
  smooth_dimming:
    name: Smooth dimming during a hold
    description: Every brightness command of a hold is a transition that lasts until the next one.
    default: true
    selector:
      boolean: {}
  min_pct:
    name: Minimum brightness
    description: Dimming stops at this level and never switches the lamp off; a hold upwards on a lamp that is off starts from this level.
    default: 1
    selector:
      number: {min: 1, max: 100, step: 1, unit_of_measurement: '%', mode: box}
  max_pct:
    name: Maximum brightness of dimming
    description: Upper limit of the presses and holds that increase the brightness.
    default: 100
    selector:
      number: {min: 1, max: 100, step: 1, unit_of_measurement: '%', mode: box}
  on_level_pct:
    name: On level
    description: Used by « Turn on at the on level », « Toggle, turning on at the on level » and « Alternate ».
    default: 50
    selector:
      number: {min: 1, max: 100, step: 1, unit_of_measurement: '%', mode: box}
  high_level_pct:
    name: High level
    description: Second level of the « Alternate » action.
    default: 100
    selector:
      number: {min: 1, max: 100, step: 1, unit_of_measurement: '%', mode: box}
  transition:
    name: Brightness transition
    description: Transition of switching on, switching off and single brightness steps, when the lamp supports it. 0 for none.
    default: 0
    selector:
      number: {min: 0, max: 5, step: 0.1, unit_of_measurement: s, mode: box}
  color_transition:
    name: Color transition
    description: Transition of color, white and recall changes. During a hold it is limited to the color tick.
    default: 0
    selector:
      number: {min: 0, max: 5, step: 0.1, unit_of_measurement: s, mode: box}
  kelvin_step:
    name: White temperature step
    default: 250
    selector:
      number: {min: 50, max: 1000, step: 50, unit_of_measurement: K, mode: box}
  reference_kelvin:
    name: Reference white
    description: >-
      Starting point of temperature changes when the lamp reports none, and reference
      color of lamps without a color mode.
    default: 2500
    selector:
      number: {min: 1500, max: 6500, step: 50, unit_of_measurement: K, mode: box}
  palette:
    name: Color presets
    description: >-
      Cycling order of the presets. The first one is the reference color of color lamps.
      Removing a preset takes it out of the cycle.
    default: []
    selector:
      select:
        multiple: true
        sort: false
        options: []
  recall_color:
    name: Recall color
    description: Color of the « Recall color » action; the brightness is kept.
    default: [255, 192, 140]
    selector:
      color_rgb: {}
  colors_turn_on:
    name: Color and white changes may switch the lamp on
    default: true
    selector:
      boolean: {}
  recall_turns_on:
    name: Color recall may switch the lamp on
    default: true
    selector:
      boolean: {}
  double_press_ms:
    name: Maximum double press delay
    description: >-
      Requires the memory helper. The first press acts at once; the second one, when it
      arrives within this delay, runs the double press action.
    default: 800
    selector:
      number: {min: 250, max: 1500, step: 50, unit_of_measurement: ms, mode: box}
  debounce_ms:
    name: Ignore events too close together
    description: >-
      Drops a radio duplicate. With the memory helper only an identical gesture is
      dropped; without a helper, any gesture too close to the previous one. 0 disables
      this filter.
    default: 0
    selector:
      number: {min: 0, max: 200, step: 10, unit_of_measurement: ms, mode: box}
  logging:
    name: Log gestures and actions
    description: INFO level, lighting_remote logger; the automation sets this level itself. Errors are
      still reported by Home Assistant.
    default: false
    selector:
      boolean: {}

# Shared variables, computed when triggered, before the condition. The generator inserts,
# in this order: the model constants, the settings, « actions_map », « gesture_raw » (the
# translated event) and « lamp » (the target lamp), then the « derived_variables » below.
variables:
  # A manual run (Menu → Run actions) has no event: it shows the diagnostic without
  # commanding the lamp.
  manual: "{{ trigger is not defined or trigger.event is not defined }}"
  command: >-
    {{ trigger.event.data.get('command', '') | string
       if trigger is defined and trigger.event is defined and trigger.event.data is mapping else '' }}
  # ZHA sends some values as zigpy enumerations (StepMode.Down, MoveMode.Up…). Rendered as
  # they are, they would make the variable unreadable and its whole content would be lost:
  # every value is therefore converted to an integer, number, boolean, none or text.
  args: >-
    {% set raw = trigger.event.data.get('args', [])
       if trigger is defined and trigger.event is defined and trigger.event.data is mapping else [] %}
    {% set ns = namespace(items=[], fields={}) %}
    {% if raw is mapping %}
      {% for key, value in raw.items() %}
        {% set ns.fields = dict(ns.fields, **{key | string: (none if value is none else (value if value is boolean
             else (value | int if value is integer else (value | float if value is float else value | string))))}) %}
      {% endfor %}{{ ns.fields }}
    {% elif raw is sequence and raw is not string %}
      {% for value in raw %}
        {% set ns.items = ns.items + [none if value is none else (value if value is boolean
             else (value | int if value is integer else (value | float if value is float else value | string)))] %}
      {% endfor %}{{ ns.items }}
    {% else %}{{ [] }}{% endif %}
  params: >-
    {% set raw = trigger.event.data.get('params', {})
       if trigger is defined and trigger.event is defined and trigger.event.data is mapping else {} %}
    {% set ns = namespace(fields={}) %}
    {% if raw is mapping %}
      {% for key, value in raw.items() %}
        {% set ns.fields = dict(ns.fields, **{key | string: (none if value is none else (value if value is boolean
             else (value | int if value is integer else (value | float if value is float else value | string))))}) %}
      {% endfor %}
    {% endif %}{{ ns.fields }}
  # Amplitude of a dial notch, sent by remotes with a dial. The Zigbee « step » command
  # gives it in brightness units (0 to 255): converted to percent.
  dial_step: >-
    {{ ((params.get('step_size', 0) | float(0)) / 2.55) | round(2) if params is mapping else 0 }}
  now_ts: '{{ as_timestamp(now()) }}'
  event_ts: >-
    {{ as_timestamp(trigger.event.time_fired, now_ts)
       if trigger is defined and trigger.event is defined else now_ts }}

derived_variables:
  # ----- Reading the memory helper -----
  # Literal prefix: a hash made only of digits would be read as a number.
  owner: "{{ 'a' ~ sha256(this.entity_id if this is defined else 'manual')[:10] }}"
  memory_raw: >-
    {{ states(memory_entity) if memory_entity is string and memory_entity.startswith('input_text.') else '' }}
  # none: no helper; invalid: helper missing or too short (configuration error); empty:
  # empty helper, or memory of the former STYRBAR blueprint (sl1: prefix), replaced at the
  # first gesture; ok: memory of this automation; foreign: memory of another automation;
  # corrupt: unreadable content.
  memory_state: >-
    {% if not (memory_entity is string and memory_entity != '') %}none
    {% elif not memory_entity.startswith('input_text.') or memory_raw in ['unavailable']
         or state_attr(memory_entity, 'max') | int(0) < 255 %}invalid
    {% elif memory_raw in ['', 'unknown'] or memory_raw.startswith('sl1:') %}empty
    {% elif memory_raw.startswith('lr1:') %}
      {% set p = memory_raw[4:] | from_json(none) %}
      {% if p is not mapping or p.get('v') != 1 %}corrupt
      {% elif p.get('o') != owner %}foreign
      {% else %}ok{% endif %}
    {% else %}corrupt{% endif %}
  use_memory: "{{ memory_state in ['ok', 'empty'] }}"
  # Normalised memory: every field has a safe type. Timestamps in the future (corrected
  # clock) cancel the running gestures without ever replaying them.
  m: >-
    {% set p = memory_raw[4:] | from_json({}) if memory_state == 'ok' else {} %}
    {% set p = p if p is mapping else {} %}
    {% set x = p.get('x') %}
    {% set m = dict(
         g=p.get('g') if p.get('g') is string else '',
         t=p.get('t') | float(0),
         h=p.get('h') if p.get('h') is string else '',
         d=p.get('d') if p.get('d') is string else '',
         s=p.get('s') | float(0),
         i=p.get('i') | int(-1),
         p=p.get('p') if p.get('p') is string else '',
         x=x if x is sequence and x is not string and x is not mapping and x | count == 2 else [],
         k=p.get('k') if p.get('k') is string else '') %}
    {{ dict(m, g='', t=0, h='', d='', s=0) if m.t > now_ts + 5 or m.s > now_ts + 5 else m }}
  # ----- Double press (memory required) -----
  gesture: >-
    {% set double = gesture_raw | replace('_press', '_double') %}
    {% if use_memory and gesture_raw.endswith('_press') and double in actions_map
          and actions_map[double] != 'none' and m.g == gesture_raw
          and 0 < event_ts - m.t <= double_press_ms / 1000 %}{{ double }}
    {% else %}{{ gesture_raw }}{% endif %}
  action: >-
    {% set known = @known %}
    {% set chosen = actions_map.get(gesture, 'none') if gesture not in ['', 'stop'] else 'none' %}
    {{ chosen if chosen in known else 'none' }}
  continuous: "{{ action.endswith('_hold') and not repeating_hold }}"
  # ----- Lamp state and running hold -----
  # Variables cannot hold a state object: every template reads states[lamp] again.
  # True when the last change of the lamp comes from the previous run of this automation
  # (same context): this is the case during a hold.
  own_change: >-
    {% set s = states[lamp] if lamp is string and lamp.startswith('light.') else none %}
    {{ this is defined and s is not none and s.context.id == this.context.id }}
  loop_running: >-
    {% set s = states[lamp] if lamp is string and lamp.startswith('light.') else none %}
    {{ this is defined and this.attributes.get('current', 0) | int(0) > 0 and own_change and s is not none
       and now_ts - as_timestamp(s.last_updated) < [hold_interval, preset_hold_interval] | max + 1 }}
  # Level actually reached during the transition of a hold step (memory required to know
  # the direction). -1: no running transition to freeze.
  fade_level: >-
    {% set s = states[lamp] if lamp is string and lamp.startswith('light.') else none %}
    {% if use_memory and m.h != '' and m.d in ['brighter', 'dimmer'] and own_change and smooth_dimming
          and s is not none and s.state == 'on' and s.attributes.get('brightness') is number %}
      {% set target = s.attributes.brightness / 2.55 %}
      {% set elapsed = now_ts - as_timestamp(s.last_updated) %}
      {% set tick = brightness_speed * hold_interval if brightness_speed > 0 else hold_step_pct %}
      {% set previous = target - tick if m.d == 'brighter' else target + tick %}
      {% if 0 <= elapsed < hold_interval and min_pct < target < max_pct %}
        {{ (previous + (target - previous) * elapsed / hold_interval) | round(1) }}
      {% else %}-1{% endif %}
    {% else %}-1{% endif %}
  # ----- Filters applied before starting -----
  ignore_reason: >-
    {% if manual %}
    {% elif gesture_raw == '' %}event without a gesture
    {% elif now_ts - event_ts > 5 %}event too old
    {% elif use_memory and event_ts < m.t - 0.001 %}event received out of order
    {% elif debounce_ms > 0 and use_memory and m.g in [gesture_raw, gesture_raw | replace('_press', '_double')]
            and 0 <= event_ts - m.t < debounce_ms / 1000 %}radio duplicate
    {# Without memory, the previous run may be timestamped a few milliseconds after this
       event was sent when Home Assistant is busy: the gap is taken without its sign. #}
    {% elif debounce_ms > 0 and not use_memory and this is defined and this.attributes.get('last_triggered')
            and (event_ts - as_timestamp(this.attributes.last_triggered, 0)) | abs < debounce_ms / 1000 %}radio duplicate
    {% elif continuous and use_memory and m.h == gesture and 0 <= event_ts - m.s < hold_limit %}repetition of the running hold
    {% elif continuous and not use_memory and loop_running %}hold already running
    {% elif gesture == 'stop' or action == 'custom' %}
    {% elif action == 'none' %}gesture without an action
    {% elif not (lamp is string and lamp.startswith('light.')) %}gesture without a lamp
    {% endif %}

# Rejected events do not restart the running action.
condition: "{{ ignore_reason | trim == '' }}"

actions:
# ----- Configuration check -----
- variables:
    notification_id: "{{ 'lighting_remote_' ~ owner }}"
    presets: "{{ palette | select('in', catalog) | list if palette is sequence and palette is not string else [] }}"
    config_errors: >-
      {% set ns = namespace(errors=[]) %}
      {% if memory_state == 'invalid' %}
        {% set ns.errors = ns.errors + ['The memory helper must be an existing Text helper with a maximum length of 255.'] %}
      {% endif %}
      {% if min_pct > max_pct %}
        {% set ns.errors = ns.errors + ['The minimum brightness is above the maximum brightness.'] %}
      {% endif %}
      {% if debounce_ms > 0 and debounce_ms >= double_press_ms %}
        {% set ns.errors = ns.errors + ['The duplicate filter must be shorter than the double press delay.'] %}
      {% endif %}
      {% if palette is not sequence or palette is string or presets | count != palette | count
            or presets | unique | list | count != presets | count %}
        {% set ns.errors = ns.errors + ['The palette contains an unknown or duplicate preset.'] %}
      {% endif %}
      {% if recall_color is not sequence or recall_color is string or recall_color | count != 3
            or recall_color | select('number') | list | count != 3
            or recall_color | select('ge', 0) | select('le', 255) | list | count != 3
            or recall_color | sum == 0 %}
        {% set ns.errors = ns.errors + ['The recall color must be a bright RGB color (three values from 0 to 255).'] %}
      {% endif %}
      {{ ns.errors }}
    memory_warning: >-
      {% if memory_state == 'foreign' %}The memory helper belongs to another automation: it is left unchanged and the remote works without memory. Choose a helper used by this automation only.
      {% elif memory_state == 'corrupt' %}The memory helper is unreadable: it is left unchanged and the remote works without memory. Clear it while the automation is disabled.
      {% endif %}
    doubles_configured: >-
      {% set ns = namespace(count=0) %}
      {% for key in double_keys %}{% if actions_map.get(key, 'none') != 'none' %}{% set ns.count = ns.count + 1 %}{% endif %}{% endfor %}
      {{ ns.count > 0 }}
- if: '{{ config_errors | count > 0 }}'
  then:
  - action: persistent_notification.create
    data:
      notification_id: '{{ notification_id }}'
      title: Lighting remote — configuration to fix
      message: "{{ this.attributes.friendly_name | default('Automation') }}: {{ config_errors | join(' ') }}"
  - action: system_log.write
    data:
      logger: lighting_remote
      level: warning
      message: '{{ this.entity_id | default("automation") }}: {{ config_errors | join(" ") }}'
  - stop: Invalid configuration; no command sent.
# ----- Diagnostic (Menu → Run actions) -----
- if: '{{ manual }}'
  then:
  - variables:
      targets: "{{ (lamps if lamps is defined else [lamp]) | select('string') | select('match', '^light[.]') | list }}"
  - action: persistent_notification.create
    data:
      notification_id: '{{ notification_id }}'
      title: Lighting remote — diagnostic
      # Literal block: every line of the list stays on its own line in the notification.
      message: |-
        **{{ this.attributes.friendly_name | default('Automation') }}** — no command sent by this diagnostic.
        {%- for target in targets %}
        {%- set modes = state_attr(target, 'supported_color_modes') or [] %}
        {%- set features = state_attr(target, 'supported_features') | int(0) %}

        Lamp {{ state_attr(target, 'friendly_name') or target }} (`{{ target }}`):
        - communication: {{ 'reachable' if states(target) in ['on', 'off'] else 'unavailable' }}
        - brightness: {{ 'yes' if modes | reject('in', ['onoff']) | list | count > 0 else 'no' }}
        - colors: {{ 'yes' if modes | select('in', ['hs', 'xy', 'rgb', 'rgbw', 'rgbww']) | list | count > 0 else 'no' }}
        - adjustable white: {{ ('yes, from ' ~ state_attr(target, 'min_color_temp_kelvin') ~ ' to ' ~ state_attr(target, 'max_color_temp_kelvin') ~ ' K') if 'color_temp' in modes else 'no (whites go through colors when the lamp has them)' }}
        - transitions: {{ 'yes' if features | bitwise_and(32) != 0 else 'no' }}
        - modes: {{ modes | join(', ') if modes else 'unknown' }}
        {%- endfor %}

        Memory: {{ {'none': 'no helper; double press inactive', 'empty': 'helper ready',
                    'ok': 'helper in use', 'foreign': 'helper of another automation, ignored',
                    'corrupt': 'unreadable helper, ignored'}[memory_state] }}.
        {%- if doubles_configured and not use_memory %}

        **A double press is configured but cannot work without a memory helper.**
        {%- endif %}
        {%- if memory_warning | trim != '' %}

        {{ memory_warning | trim }}
        {%- endif %}
  - stop: Diagnostic shown.
- if: '{{ memory_warning | trim != "" }}'
  then:
  - action: persistent_notification.create
    data:
      notification_id: '{{ notification_id }}'
      title: Lighting remote — memory helper
      message: "{{ this.attributes.friendly_name | default('Automation') }}: {{ memory_warning }}"
# ----- Memory: the gesture is recorded before any command -----
- if: '{{ use_memory }}'
  then:
  - action: input_text.set_value
    target: {entity_id: '{{ memory_entity }}'}
    data:
      value: >-
        lr1:{{ dict(m, v=1, o=owner, g=gesture, t=event_ts | round(3),
                    h=(gesture if continuous else ''),
                    d=(action | replace('_hold', '') if continuous else ''),
                    s=(event_ts | round(3) if continuous else 0)) | to_json }}
- if: '{{ logging }}'
  then:
  # The INFO level is hidden by default: the automation sets the level of its own logger,
  # with no configuration. A logging error never interrupts the command.
  - action: logger.set_level
    continue_on_error: true
    data:
      lighting_remote: info
  - action: system_log.write
    continue_on_error: true
    data:
      logger: lighting_remote
      level: info
      message: '{{ this.entity_id | default("automation") }}: {{ command }} → {{ gesture }} → {{ action }}.'
# ----- Release: freezes the level reached when a hold transition is running -----
- if: "{{ gesture == 'stop' }}"
  then:
  - if: '{{ fade_level | float(-1) >= 0 }}'
    then:
    - action: light.turn_on
      target: {entity_id: '{{ lamp }}'}
      data:
        brightness_pct: '{{ fade_level }}'
        transition: 0
  - stop: Release received; running change stopped.
- if: "{{ action == 'custom' }}"
  then:
  - '@custom'
  - stop: Custom action run.
- if: "{{ states(lamp) not in ['on', 'off'] }}"
  then:
  - stop: Lamp unavailable; no command sent.
# ----- Lamp state and capabilities read at the start of the gesture -----
- variables:
    lamp_on: "{{ is_state(lamp, 'on') }}"
    level: "{{ ((state_attr(lamp, 'brightness') | float(0)) / 2.55) | round(1) if is_state(lamp, 'on') else 0 }}"
    color_modes: "{{ state_attr(lamp, 'supported_color_modes') or [] }}"
    has_color: "{{ color_modes | select('in', ['hs', 'xy', 'rgb', 'rgbw', 'rgbww']) | list | count > 0 }}"
    has_kelvin: "{{ 'color_temp' in color_modes }}"
    kelvin_min: "{{ state_attr(lamp, 'min_color_temp_kelvin') | int(2000) }}"
    kelvin_max: "{{ state_attr(lamp, 'max_color_temp_kelvin') | int(6500) }}"
    fade: "{{ {'transition': transition} if transition > 0 else {} }}"
    # A command sent during a hold transition freezes the brightness reached.
    hold_freeze: "{{ {'brightness_pct': fade_level} if fade_level | float(-1) >= 0 else {} }}"
    stop_effect: >-
      {{ {'effect': 'off'} if state_attr(lamp, 'effect') not in [none, 'off', 'none']
         and 'off' in (state_attr(lamp, 'effect_list') or []) else {} }}
    color_fade: "{{ {'transition': color_transition} if color_transition > 0 else {} }}"
- choose:
  - conditions: "{{ action == 'toggle' }}"
    sequence:
    - action: light.toggle
      target: {entity_id: '{{ lamp }}'}
      data: '{{ fade }}'
  - conditions: "{{ action == 'on' }}"
    sequence:
    - action: light.turn_on
      target: {entity_id: '{{ lamp }}'}
      data: "{{ dict(hold_freeze, transition=0) if hold_freeze else fade }}"
  - conditions: "{{ action == 'off' or (action == 'toggle_level' and lamp_on) }}"
    sequence:
    - action: light.turn_off
      target: {entity_id: '{{ lamp }}'}
      data: '{{ fade }}'
  - conditions: "{{ action in ['level', 'toggle_level'] }}"
    sequence:
    - action: light.turn_on
      target: {entity_id: '{{ lamp }}'}
      data: '{{ dict(fade, brightness_pct=on_level_pct) }}'
  - conditions: "{{ action == 'full' }}"
    sequence:
    - action: light.turn_on
      target: {entity_id: '{{ lamp }}'}
      data: '{{ dict(fade, brightness_pct=100) }}'
  # Reference color: first preset for a color lamp, reference white (bounded to the lamp
  # limits) for a lamp with adjustable white only.
  - conditions: "{{ action == 'full_reference' }}"
    sequence:
    - action: light.turn_on
      target: {entity_id: '{{ lamp }}'}
      data: >-
        {% set base = dict(stop_effect, **color_fade) %}
        {% if has_color and presets | count > 0 %}
          {{ dict(dict(base, **catalog[presets[0]].data), brightness_pct=100) }}
        {% elif has_kelvin %}
          {{ dict(base, brightness_pct=100, color_temp_kelvin=([kelvin_min, reference_kelvin, kelvin_max] | sort)[1]) }}
        {% else %}
          {{ dict(fade, brightness_pct=100) }}
        {% endif %}
  # Recall color: brightness kept (frozen when a hold transition is running).
  - conditions: "{{ action == 'recall' }}"
    sequence:
    - if: '{{ not lamp_on and not recall_turns_on }}'
      then:
      - stop: Lamp off; the recall is not allowed to switch it on.
    - action: light.turn_on
      target: {entity_id: '{{ lamp }}'}
      data: >-
        {{ dict(dict(dict(stop_effect, **color_fade), **hold_freeze), rgb_color=recall_color | map('int') | list) }}
  # Alternate: lamp off → on level; on below the high level → high level; already at the
  # high level → back to the on level.
  - conditions: "{{ action == 'alternate' }}"
    sequence:
    - action: light.turn_on
      target: {entity_id: '{{ lamp }}'}
      data: >-
        {{ dict(fade, brightness_pct=(high_level_pct if lamp_on and level < high_level_pct - 1 else on_level_pct)) }}
  # Single steps and continuous changes share the same loop: one pass for a step, several
  # passes bounded by the maximum duration for a hold.
  default:
  - variables:
      operation: "{{ action | replace('_hold', '') }}"
      colour_operation: "{{ operation in ['cooler', 'warmer', 'next_preset', 'previous_preset'] }}"
      tick: "{{ preset_hold_interval if colour_operation else hold_interval }}"
      iterations: "{{ ((hold_limit / tick) | round(0, 'ceil') | int) if continuous else 1 }}"
      amount: >-
        {% if gesture in ['dial_up', 'dial_down'] and dial_step is number and dial_step > 0 %}
          {{ ([dial_step * dial_scale, 100] | min) | round(1) }}
        {% elif action.endswith('_hold') %}
          {{ (brightness_speed * hold_interval) | round(2) if brightness_speed > 0 else hold_step_pct }}
        {% else %}{{ step_pct }}{% endif %}
      motion: >-
        {% if colour_operation %}
          {{ ([color_transition, preset_hold_interval] | min) if continuous else color_transition }}
        {% else %}
          {{ (hold_interval if smooth_dimming else 0) if continuous else transition }}
        {% endif %}
      # Position in the palette: exact memory when the lamp still shows the remembered
      # color with no change made elsewhere, otherwise the nearest preset (xy).
      cursor: >-
        {% set xy = state_attr(lamp, 'xy_color') %}
        {% set valid = lamp_on and xy is sequence and xy is not string and xy | count == 2
                       and xy[0] is number and xy[1] is number and presets | count > 0 %}
        {% set observed = [xy[0] | round(4), xy[1] | round(4)] if valid else [] %}
        {% if valid and use_memory and m.p == sha256(presets | to_json)[:8] and 0 <= m.i < presets | count
              and observed == m.x and m.k == sha256(states[lamp].context.id)[:8] %}{{ m.i }}
        {% elif valid %}
          {% set ns = namespace(best=-1, distance=0) %}
          {% for key in presets %}
            {% set c = catalog[key].xy %}
            {% set distance = (xy[0] - c[0]) ** 2 + (xy[1] - c[1]) ** 2 %}
            {% if ns.best < 0 or distance < ns.distance %}
              {% set ns.best = loop.index0 %}{% set ns.distance = distance %}
            {% endif %}
          {% endfor %}{{ ns.best }}
        {% else %}-1{% endif %}
  - if: '{{ colour_operation and not lamp_on and not colors_turn_on }}'
    then:
    - stop: Lamp off; color changes are not allowed to switch it on.
  - repeat:
      count: '{{ iterations }}'
      sequence:
      - variables:
          now_on: "{{ is_state(lamp, 'on') }}"
          now_brightness: "{{ state_attr(lamp, 'brightness') | int(0) if is_state(lamp, 'on') else 0 }}"
          now_kelvin: "{{ state_attr(lamp, 'color_temp_kelvin') | int(0) if is_state(lamp, 'on') else 0 }}"
          index: >-
            {% set direction = 1 if operation == 'next_preset' else -1 %}
            {{ ((cursor + direction * repeat.index) if cursor >= 0 else ((repeat.index - 1) * direction))
               % ([presets | count, 1] | max) }}
          request: >-
            {% set now_level = now_brightness / 2.55 %}
            {% if repeat.index > 1 and not now_on %}{{ {} }}
            {% elif operation == 'brighter' %}
              {% set start = (min_pct if continuous else [amount, min_pct] | max) %}
              {% set target = ([now_level + amount, max_pct] | min) if now_on else ([start, max_pct] | min) %}
              {{ {'brightness_pct': target | round(1)}
                 if not now_on or (target * 2.55) | round(0) | int > now_brightness else {} }}
            {% elif operation == 'dimmer' %}
              {% set target = [now_level - amount, min_pct] | max %}
              {{ {'brightness_pct': target | round(1)}
                 if now_on and (target * 2.55) | round(0) | int < now_brightness else {} }}
            {% elif operation in ['cooler', 'warmer'] %}
              {% set base = now_kelvin if now_kelvin > 0 else reference_kelvin %}
              {% set target = ([kelvin_min, base + (kelvin_step if operation == 'cooler' else -kelvin_step), kelvin_max] | sort)[1] %}
              {{ dict(stop_effect, color_temp_kelvin=target) if not now_on or target != now_kelvin else {} }}
            {% elif operation in ['next_preset', 'previous_preset'] and presets | count > 0 %}
              {{ dict(stop_effect, **catalog[presets[index]].data) }}
            {% else %}{{ {} }}{% endif %}
      - if: '{{ request | count == 0 }}'
        then:
        - if: '{{ use_memory and continuous }}'
          then:
          - action: input_text.set_value
            target: {entity_id: '{{ memory_entity }}'}
            data:
              value: >-
                {% set c = states(memory_entity)[4:] | from_json({}) if states(memory_entity).startswith('lr1:') else {} %}
                {% set c = c if c is mapping and c.get('o') == owner else dict(m, v=1, o=owner) %}
                lr1:{{ dict(c, h='', d='', s=0) | to_json }}
        - stop: Limit reached, lamp off or nothing to change; change finished.
      - action: light.turn_on
        target: {entity_id: '{{ lamp }}'}
        data: >-
          {% set data = dict(request, transition=motion) if motion > 0 else request %}
          {{ dict(data, **hold_freeze) if repeat.index == 1 and colour_operation and hold_freeze else data }}
      # Remembers the exact position in the palette, with the color and the context
      # observed right after the command.
      - if: "{{ use_memory and operation in ['next_preset', 'previous_preset'] and presets | count > 0 }}"
        then:
        - variables:
            shown: "{{ state_attr(lamp, 'xy_color') }}"
        - action: input_text.set_value
          target: {entity_id: '{{ memory_entity }}'}
          data:
            value: >-
              {% set observed = [shown[0] | round(4), shown[1] | round(4)]
                 if shown is sequence and shown is not string and shown | count == 2 else [] %}
              lr1:{{ dict(m, v=1, o=owner, g=gesture, t=event_ts | round(3),
                          h=(gesture if continuous else ''), d=(operation if continuous else ''),
                          s=(event_ts | round(3) if continuous else 0),
                          i=index, p=sha256(presets | to_json)[:8], x=observed,
                          k=sha256(states[lamp].context.id)[:8]) | to_json }}
      - if: '{{ repeat.index < iterations }}'
        then:
        - delay:
            seconds: '{{ tick }}'
  # Natural end of a hold (maximum duration reached): the memory is disarmed.
  - if: '{{ use_memory and continuous }}'
    then:
    - action: input_text.set_value
      target: {entity_id: '{{ memory_entity }}'}
      data:
        value: >-
          {% set c = states(memory_entity)[4:] | from_json({}) if states(memory_entity).startswith('lr1:') else {} %}
          {% set c = c if c is mapping and c.get('o') == owner else dict(m, v=1, o=owner) %}
          lr1:{{ dict(c, h='', d='', s=0) | to_json }}
