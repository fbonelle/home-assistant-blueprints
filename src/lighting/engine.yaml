# SPDX-License-Identifier: GPL-3.0-only
# Moteur commun des télécommandes d'éclairage.
#
# tools/build_lighting.py intègre ce fichier dans chaque blueprint de modèle au moment de
# la construction. À l'exécution, chaque blueprint est donc autonome : aucun script
# partagé, et une trace d'automatisation montre tout le déroulement d'un geste.
#
# Principes :
# - le mode « restart » de l'automatisation arrête une variation en cours dès qu'un
#   autre geste reconnu ou un relâchement arrive ; les événements sans action sont
#   écartés par la condition et n'interrompent donc jamais rien ;
# - une variation continue est toujours bornée par la durée maximale d'un maintien,
#   même si le relâchement radio est perdu ;
# - l'état de la lampe est relu à chaque pas : une modification extérieure est respectée,
#   et une lampe éteinte pendant un maintien n'est jamais rallumée par ce maintien ;
# - la baisse de luminosité s'arrête à la luminosité minimale et n'éteint jamais la lampe ;
# - toutes les commandes vers la lampe partent de l'état relu juste avant elles.
#
# Assistant de mémoire facultatif (assistant Texte, longueur maximale 255) :
# - sans assistant, tout fonctionne sauf le double appui ; le préréglage courant est
#   déduit de la couleur affichée par la lampe ; un relâchement arrête la variation et la
#   lampe termine son dernier fondu ;
# - avec un assistant, s'y ajoutent le double appui, la position exacte dans la palette,
#   le rejet des événements arrivés dans le désordre, la distinction entre la répétition
#   d'un maintien et un nouveau maintien, et l'arrêt au niveau réellement atteint lors du
#   relâchement ;
# - l'assistant est écrit au début de chaque geste, avant toute commande : un geste
#   interrompu ne laisse jamais un maintien « armé » ;
# - un assistant illisible ou utilisé par une autre automatisation n'est jamais écrasé :
#   une notification le signale et la télécommande fonctionne sans mémoire.

# Actions proposées pour chaque geste. « hold_only » réserve une action aux maintiens.
actions_catalog:
- {value: none, label: Aucune action}
- {value: toggle, label: Basculer marche/arrêt}
- {value: toggle_level, label: "Basculer, en allumant au niveau d'allumage"}
- {value: 'on', label: Allumer}
- {value: 'off', label: Éteindre}
- {value: level, label: Allumer au niveau d'allumage}
- {value: full, label: Pleine luminosité}
- {value: full_reference, label: Pleine luminosité et couleur de référence}
- {value: recall, label: Couleur de rappel (luminosité conservée)}
- {value: alternate, label: Alterner entre niveau d'allumage et niveau haut}
- {value: brighter, label: Augmenter la luminosité d'un pas}
- {value: dimmer, label: Baisser la luminosité d'un pas}
- {value: brighter_hold, label: Augmenter la luminosité en continu, hold_only: true}
- {value: dimmer_hold, label: Baisser la luminosité en continu, hold_only: true}
- {value: cooler, label: Blanc plus froid d'un pas}
- {value: warmer, label: Blanc plus chaud d'un pas}
- {value: cooler_hold, label: Blanc plus froid en continu, hold_only: true}
- {value: warmer_hold, label: Blanc plus chaud en continu, hold_only: true}
- {value: next_preset, label: Préréglage de couleur suivant}
- {value: previous_preset, label: Préréglage de couleur précédent}
- {value: next_preset_hold, label: Préréglages suivants en continu, hold_only: true}
- {value: previous_preset_hold, label: Préréglages précédents en continu, hold_only: true}
- {value: custom, label: Action personnalisée}

# Assistant de mémoire facultatif, placé hors de la section des réglages pour rester visible.
memory_input:
  name: Assistant de mémoire (facultatif)
  description: >-
    Assistant Texte de longueur maximale 255, réservé à cette automatisation. Nécessaire
    pour le double appui ; apporte aussi la position exacte dans la palette, le rejet des
    événements désordonnés et l'arrêt au niveau atteint lors du relâchement. Sans
    assistant, tout le reste fonctionne.
  default: ''
  selector:
    entity:
      filter:
      - domain: input_text

# Réglages communs, regroupés dans une section repliée. Les profils de models.yaml
# peuvent changer les valeurs par défaut (clé « settings »).
settings_inputs:
  step_pct:
    name: Pas de luminosité
    description: Variation appliquée par un appui « d'un pas ».
    default: 10
    selector:
      number: {min: 1, max: 50, step: 1, unit_of_measurement: '%', mode: box}
  brightness_speed:
    name: Vitesse de variation pendant un maintien
    description: >-
      Points de luminosité par seconde ; 35 traverse toute la plage en environ 3 secondes.
      0 utilise le pas de luminosité pendant un maintien à chaque cadence.
    default: 0
    selector:
      number: {min: 0, max: 100, step: 1, unit_of_measurement: '%/s', mode: box}
  hold_step_pct:
    name: Pas de luminosité pendant un maintien
    description: >-
      Utilisé quand la vitesse vaut 0. Pour les télécommandes qui répètent elles-mêmes le
      maintien (Philips Hue), variation à chaque répétition.
    default: 10
    selector:
      number: {min: 1, max: 50, step: 1, unit_of_measurement: '%', mode: box}
  hold_interval:
    name: Cadence de la luminosité pendant un maintien
    description: Intervalle entre deux commandes de luminosité d'un maintien.
    default: 0.5
    selector:
      number: {min: 0.2, max: 2, step: 0.1, unit_of_measurement: s, mode: box}
  preset_hold_interval:
    name: Cadence des couleurs et des blancs pendant un maintien
    description: Intervalle entre deux préréglages ou deux pas de température d'un maintien.
    default: 0.5
    selector:
      number: {min: 0.2, max: 3, step: 0.1, unit_of_measurement: s, mode: box}
  hold_limit:
    name: Durée maximale d'un maintien
    description: Arrêt automatique d'une variation continue si le relâchement radio est perdu.
    default: 10
    selector:
      number: {min: 2, max: 60, step: 1, unit_of_measurement: s, mode: box}
  smooth_dimming:
    name: Lisser la variation pendant un maintien
    description: Chaque commande de luminosité d'un maintien est un fondu qui dure jusqu'à la suivante.
    default: true
    selector:
      boolean: {}
  min_pct:
    name: Luminosité minimale
    description: La baisse de luminosité s'arrête à ce niveau et n'éteint jamais la lampe ; un maintien vers le haut sur une lampe éteinte part de ce niveau.
    default: 1
    selector:
      number: {min: 1, max: 100, step: 1, unit_of_measurement: '%', mode: box}
  max_pct:
    name: Luminosité maximale de la variation
    description: Butée haute des appuis et maintiens qui augmentent la luminosité.
    default: 100
    selector:
      number: {min: 1, max: 100, step: 1, unit_of_measurement: '%', mode: box}
  on_level_pct:
    name: Niveau d'allumage
    description: Utilisé par « Allumer au niveau d'allumage », « Basculer, en allumant au niveau d'allumage » et « Alterner ».
    default: 50
    selector:
      number: {min: 1, max: 100, step: 1, unit_of_measurement: '%', mode: box}
  high_level_pct:
    name: Niveau haut
    description: Second niveau de l'action « Alterner ».
    default: 100
    selector:
      number: {min: 1, max: 100, step: 1, unit_of_measurement: '%', mode: box}
  transition:
    name: Fondu de la luminosité
    description: Fondu des allumages, extinctions et pas uniques de luminosité, si la lampe le prend en charge. 0 pour aucun fondu.
    default: 0
    selector:
      number: {min: 0, max: 5, step: 0.1, unit_of_measurement: s, mode: box}
  color_transition:
    name: Fondu des couleurs
    description: Fondu des changements de couleur, de blanc et du rappel. Pendant un maintien, il est limité à la cadence des couleurs.
    default: 0
    selector:
      number: {min: 0, max: 5, step: 0.1, unit_of_measurement: s, mode: box}
  kelvin_step:
    name: Pas de température du blanc
    default: 250
    selector:
      number: {min: 50, max: 1000, step: 50, unit_of_measurement: K, mode: box}
  reference_kelvin:
    name: Blanc de référence
    description: >-
      Point de départ des changements de température quand la lampe n'en indique pas,
      et couleur de référence des lampes sans mode couleur.
    default: 2500
    selector:
      number: {min: 1500, max: 6500, step: 50, unit_of_measurement: K, mode: box}
  palette:
    name: Préréglages de couleur
    description: >-
      Ordre de défilement des préréglages. Le premier est la couleur de référence des
      lampes couleur. Retirer un préréglage le supprime du défilement.
    default: []
    selector:
      select:
        multiple: true
        sort: false
        options: []
  recall_color:
    name: Couleur de rappel
    description: Couleur de l'action « Couleur de rappel » ; la luminosité est conservée.
    default: [255, 192, 140]
    selector:
      color_rgb: {}
  colors_turn_on:
    name: Les changements de couleur et de blanc peuvent allumer la lampe
    default: true
    selector:
      boolean: {}
  recall_turns_on:
    name: Le rappel de couleur peut allumer la lampe
    default: true
    selector:
      boolean: {}
  double_press_ms:
    name: Délai maximal d'un double appui
    description: >-
      Nécessite l'assistant de mémoire. Le premier appui agit tout de suite ; le second,
      s'il arrive dans ce délai, exécute l'action de double appui.
    default: 800
    selector:
      number: {min: 250, max: 1500, step: 50, unit_of_measurement: ms, mode: box}
  debounce_ms:
    name: Ignorer les événements trop rapprochés
    description: >-
      Écarte un doublon radio. Avec l'assistant de mémoire, seul un geste identique est
      écarté ; sans assistant, tout geste trop proche du précédent. 0 désactive ce filtre.
    default: 0
    selector:
      number: {min: 0, max: 200, step: 10, unit_of_measurement: ms, mode: box}
  logging:
    name: Journaliser les gestes et les actions
    description: Niveau INFO, journal lighting_remote. Les erreurs restent signalées par Home Assistant.
    default: false
    selector:
      boolean: {}

# Variables communes, calculées au déclenchement, avant la condition. Le générateur y
# insère, dans cet ordre : les constantes du modèle, les réglages, « actions_map »,
# « gesture_raw » (traduction de l'événement) et « lamp » (lampe visée), puis les
# variables de « derived_variables » ci-dessous.
variables:
  # Une exécution manuelle (Menu → Exécuter les actions) n'a pas d'événement : elle
  # affiche le diagnostic sans commander la lampe.
  manual: "{{ trigger is not defined or trigger.event is not defined }}"
  command: >-
    {{ trigger.event.data.get('command', '') | string
       if trigger is defined and trigger.event is defined and trigger.event.data is mapping else '' }}
  args: >-
    {{ trigger.event.data.get('args', [])
       if trigger is defined and trigger.event is defined and trigger.event.data is mapping else [] }}
  params: >-
    {{ trigger.event.data.get('params', {})
       if trigger is defined and trigger.event is defined and trigger.event.data is mapping else {} }}
  # Amplitude d'un cran de molette, transmise par les télécommandes à molette.
  dial_step: >-
    {{ params.get('step_size', 0) | float(0) if params is mapping else 0 }}
  now_ts: '{{ as_timestamp(now()) }}'
  event_ts: >-
    {{ as_timestamp(trigger.event.time_fired, now_ts)
       if trigger is defined and trigger.event is defined else now_ts }}

derived_variables:
  # ----- Lecture de l'assistant de mémoire -----
  # Préfixe littéral : une empreinte faite uniquement de chiffres serait lue comme un nombre.
  owner: "{{ 'a' ~ sha256(this.entity_id if this is defined else 'manual')[:10] }}"
  memory_raw: >-
    {{ states(memory_entity) if memory_entity is string and memory_entity.startswith('input_text.') else '' }}
  # none : aucun assistant ; invalid : assistant absent ou trop court (erreur de
  # configuration) ; empty : assistant vide, ou mémoire de l'ancien blueprint STYRBAR
  # (préfixe sl1:), remplacée au premier geste ; ok : mémoire de cette automatisation ;
  # foreign : mémoire d'une autre automatisation ; corrupt : contenu illisible.
  memory_state: >-
    {% if not (memory_entity is string and memory_entity != '') %}none
    {% elif not memory_entity.startswith('input_text.') or memory_raw in ['unavailable']
         or state_attr(memory_entity, 'max') | int(0) < 255 %}invalid
    {% elif memory_raw in ['', 'unknown'] or memory_raw.startswith('sl1:') %}empty
    {% elif memory_raw.startswith('lr1:') %}
      {% set p = memory_raw[4:] | from_json(none) %}
      {% if p is not mapping or p.get('v') != 1 %}corrupt
      {% elif p.get('o') != owner %}foreign
      {% else %}ok{% endif %}
    {% else %}corrupt{% endif %}
  use_memory: "{{ memory_state in ['ok', 'empty'] }}"
  # Mémoire normalisée : chaque champ a un type sûr. Des horodatages dans le futur
  # (horloge corrigée) annulent les gestes en cours sans jamais les rejouer.
  m: >-
    {% set p = memory_raw[4:] | from_json({}) if memory_state == 'ok' else {} %}
    {% set p = p if p is mapping else {} %}
    {% set x = p.get('x') %}
    {% set m = dict(
         g=p.get('g') if p.get('g') is string else '',
         t=p.get('t') | float(0),
         h=p.get('h') if p.get('h') is string else '',
         d=p.get('d') if p.get('d') is string else '',
         s=p.get('s') | float(0),
         i=p.get('i') | int(-1),
         p=p.get('p') if p.get('p') is string else '',
         x=x if x is sequence and x is not string and x is not mapping and x | count == 2 else [],
         k=p.get('k') if p.get('k') is string else '') %}
    {{ dict(m, g='', t=0, h='', d='', s=0) if m.t > now_ts + 5 or m.s > now_ts + 5 else m }}
  # ----- Double appui (mémoire nécessaire) -----
  gesture: >-
    {% set double = gesture_raw | replace('_press', '_double') %}
    {% if use_memory and gesture_raw.endswith('_press') and double in actions_map
          and actions_map[double] != 'none' and m.g == gesture_raw
          and 0 < event_ts - m.t <= double_press_ms / 1000 %}{{ double }}
    {% else %}{{ gesture_raw }}{% endif %}
  action: >-
    {% set known = @known %}
    {% set chosen = actions_map.get(gesture, 'none') if gesture not in ['', 'stop'] else 'none' %}
    {{ chosen if chosen in known else 'none' }}
  continuous: "{{ action.endswith('_hold') and not repeating_hold }}"
  # ----- État de la lampe et maintien en cours -----
  # Les variables ne peuvent pas contenir un état : chaque modèle relit states[lamp].
  # Vrai quand le dernier changement de la lampe vient de l'exécution précédente de
  # cette automatisation (même contexte) : c'est le cas pendant un maintien.
  own_change: >-
    {% set s = states[lamp] if lamp is string and lamp.startswith('light.') else none %}
    {{ this is defined and s is not none and s.context.id == this.context.id }}
  loop_running: >-
    {% set s = states[lamp] if lamp is string and lamp.startswith('light.') else none %}
    {{ this is defined and this.attributes.get('current', 0) | int(0) > 0 and own_change and s is not none
       and now_ts - as_timestamp(s.last_updated) < [hold_interval, preset_hold_interval] | max + 1 }}
  # Niveau réellement atteint pendant le fondu d'un pas de maintien (mémoire nécessaire
  # pour connaître la direction). -1 : aucun fondu en cours à figer.
  fade_level: >-
    {% set s = states[lamp] if lamp is string and lamp.startswith('light.') else none %}
    {% if use_memory and m.h != '' and m.d in ['brighter', 'dimmer'] and own_change and smooth_dimming
          and s is not none and s.state == 'on' and s.attributes.get('brightness') is number %}
      {% set target = s.attributes.brightness / 2.55 %}
      {% set elapsed = now_ts - as_timestamp(s.last_updated) %}
      {% set tick = brightness_speed * hold_interval if brightness_speed > 0 else hold_step_pct %}
      {% set previous = target - tick if m.d == 'brighter' else target + tick %}
      {% if 0 <= elapsed < hold_interval and min_pct < target < max_pct %}
        {{ (previous + (target - previous) * elapsed / hold_interval) | round(1) }}
      {% else %}-1{% endif %}
    {% else %}-1{% endif %}
  # ----- Filtres appliqués avant de démarrer -----
  ignore_reason: >-
    {% if manual %}
    {% elif gesture_raw == '' %}événement sans geste
    {% elif now_ts - event_ts > 5 %}événement trop ancien
    {% elif use_memory and event_ts < m.t - 0.001 %}événement arrivé dans le désordre
    {% elif debounce_ms > 0 and use_memory and m.g in [gesture_raw, gesture_raw | replace('_press', '_double')]
            and 0 <= event_ts - m.t < debounce_ms / 1000 %}doublon radio
    {% elif debounce_ms > 0 and not use_memory and this is defined and this.attributes.get('last_triggered')
            and 0 <= event_ts - as_timestamp(this.attributes.last_triggered, 0) < debounce_ms / 1000 %}doublon radio
    {% elif continuous and use_memory and m.h == gesture and 0 <= event_ts - m.s < hold_limit %}répétition du maintien en cours
    {% elif continuous and not use_memory and loop_running %}maintien déjà en cours
    {% elif gesture == 'stop' or action == 'custom' %}
    {% elif action == 'none' %}geste sans action
    {% elif not (lamp is string and lamp.startswith('light.')) %}geste sans lampe
    {% endif %}

# Les événements écartés ne redémarrent pas l'action en cours.
condition: "{{ ignore_reason | trim == '' }}"

actions:
# ----- Contrôle de la configuration -----
- variables:
    notification_id: "{{ 'lighting_remote_' ~ owner }}"
    presets: "{{ palette | select('in', catalog) | list if palette is sequence and palette is not string else [] }}"
    config_errors: >-
      {% set ns = namespace(errors=[]) %}
      {% if memory_state == 'invalid' %}
        {% set ns.errors = ns.errors + ["L'assistant de mémoire doit être un assistant Texte existant, de longueur maximale 255."] %}
      {% endif %}
      {% if min_pct > max_pct %}
        {% set ns.errors = ns.errors + ['La luminosité minimale dépasse la luminosité maximale.'] %}
      {% endif %}
      {% if debounce_ms > 0 and debounce_ms >= double_press_ms %}
        {% set ns.errors = ns.errors + ["Le filtre des doublons doit être plus court que le délai du double appui."] %}
      {% endif %}
      {% if palette is not sequence or palette is string or presets | count != palette | count
            or presets | unique | list | count != presets | count %}
        {% set ns.errors = ns.errors + ['La palette contient un préréglage inconnu ou en double.'] %}
      {% endif %}
      {% if recall_color is not sequence or recall_color is string or recall_color | count != 3
            or recall_color | select('number') | list | count != 3
            or recall_color | select('ge', 0) | select('le', 255) | list | count != 3
            or recall_color | sum == 0 %}
        {% set ns.errors = ns.errors + ['La couleur de rappel doit être une couleur RGB lumineuse (trois valeurs de 0 à 255).'] %}
      {% endif %}
      {{ ns.errors }}
    memory_warning: >-
      {% if memory_state == 'foreign' %}L'assistant de mémoire appartient à une autre automatisation : il n'est pas modifié et la télécommande fonctionne sans mémoire. Choisir un assistant propre à cette automatisation.
      {% elif memory_state == 'corrupt' %}L'assistant de mémoire est illisible : il n'est pas modifié et la télécommande fonctionne sans mémoire. Le vider pendant que l'automatisation est désactivée.
      {% endif %}
    doubles_configured: >-
      {% set ns = namespace(count=0) %}
      {% for key in double_keys %}{% if actions_map.get(key, 'none') != 'none' %}{% set ns.count = ns.count + 1 %}{% endif %}{% endfor %}
      {{ ns.count > 0 }}
- if: '{{ config_errors | count > 0 }}'
  then:
  - action: persistent_notification.create
    data:
      notification_id: '{{ notification_id }}'
      title: Télécommande d'éclairage — configuration à corriger
      message: "{{ this.attributes.friendly_name | default('Automatisation') }} : {{ config_errors | join(' ') }}"
  - action: system_log.write
    data:
      logger: lighting_remote
      level: warning
      message: '{{ this.entity_id | default("automation") }} : {{ config_errors | join(" ") }}'
  - stop: Configuration invalide ; aucune commande envoyée.
# ----- Diagnostic (Menu → Exécuter les actions) -----
- if: '{{ manual }}'
  then:
  - variables:
      targets: "{{ (lamps if lamps is defined else [lamp]) | select('string') | select('match', '^light[.]') | list }}"
  - action: persistent_notification.create
    data:
      notification_id: '{{ notification_id }}'
      title: Télécommande d'éclairage — diagnostic
      # Bloc littéral : chaque ligne de la liste reste sur sa propre ligne dans la notification.
      message: |-
        **{{ this.attributes.friendly_name | default('Automatisation') }}** — aucune commande envoyée par ce diagnostic.
        {%- for target in targets %}
        {%- set modes = state_attr(target, 'supported_color_modes') or [] %}
        {%- set features = state_attr(target, 'supported_features') | int(0) %}

        Lampe {{ state_attr(target, 'friendly_name') or target }} (`{{ target }}`) :
        - communication : {{ 'joignable' if states(target) in ['on', 'off'] else 'indisponible' }}
        - luminosité : {{ 'oui' if modes | reject('in', ['onoff']) | list | count > 0 else 'non' }}
        - couleurs : {{ 'oui' if modes | select('in', ['hs', 'xy', 'rgb', 'rgbw', 'rgbww']) | list | count > 0 else 'non' }}
        - blanc réglable : {{ ('oui, de ' ~ state_attr(target, 'min_color_temp_kelvin') ~ ' à ' ~ state_attr(target, 'max_color_temp_kelvin') ~ ' K') if 'color_temp' in modes else 'non (les blancs passent par les couleurs si la lampe en a)' }}
        - fondus : {{ 'oui' if features | bitwise_and(32) != 0 else 'non' }}
        - modes : {{ modes | join(', ') if modes else 'inconnus' }}
        {%- endfor %}

        Mémoire : {{ {'none': 'aucun assistant ; double appui inactif', 'empty': 'assistant prêt',
                      'ok': 'assistant en service', 'foreign': "assistant d'une autre automatisation, ignoré",
                      'corrupt': 'assistant illisible, ignoré'}[memory_state] }}.
        {%- if doubles_configured and not use_memory %}

        **Un double appui est configuré mais ne peut pas fonctionner sans assistant de mémoire.**
        {%- endif %}
        {%- if memory_warning | trim != '' %}

        {{ memory_warning | trim }}
        {%- endif %}
  - stop: Diagnostic affiché.
- if: '{{ memory_warning | trim != "" }}'
  then:
  - action: persistent_notification.create
    data:
      notification_id: '{{ notification_id }}'
      title: Télécommande d'éclairage — assistant de mémoire
      message: "{{ this.attributes.friendly_name | default('Automatisation') }} : {{ memory_warning }}"
# ----- Mémoire : le geste est enregistré avant toute commande -----
- if: '{{ use_memory }}'
  then:
  - action: input_text.set_value
    target: {entity_id: '{{ memory_entity }}'}
    data:
      value: >-
        lr1:{{ dict(m, v=1, o=owner, g=gesture, t=event_ts | round(3),
                    h=(gesture if continuous else ''),
                    d=(action | replace('_hold', '') if continuous else ''),
                    s=(event_ts | round(3) if continuous else 0)) | to_json }}
- if: '{{ logging }}'
  then:
  - action: system_log.write
    data:
      logger: lighting_remote
      level: info
      message: '{{ this.entity_id | default("automation") }} : {{ command }} → {{ gesture }} → {{ action }}.'
# ----- Relâchement : fige le niveau atteint si un fondu de maintien est en cours -----
- if: "{{ gesture == 'stop' }}"
  then:
  - if: '{{ fade_level | float(-1) >= 0 }}'
    then:
    - action: light.turn_on
      target: {entity_id: '{{ lamp }}'}
      data:
        brightness_pct: '{{ fade_level }}'
        transition: 0
  - stop: Relâchement reçu ; variation en cours arrêtée.
- if: "{{ action == 'custom' }}"
  then:
  - '@custom'
  - stop: Action personnalisée exécutée.
- if: "{{ states(lamp) not in ['on', 'off'] }}"
  then:
  - stop: Lampe indisponible ; aucune commande envoyée.
# ----- Lecture de l'état et des capacités de la lampe au début du geste -----
- variables:
    lamp_on: "{{ is_state(lamp, 'on') }}"
    level: "{{ ((state_attr(lamp, 'brightness') | float(0)) / 2.55) | round(1) if is_state(lamp, 'on') else 0 }}"
    color_modes: "{{ state_attr(lamp, 'supported_color_modes') or [] }}"
    has_color: "{{ color_modes | select('in', ['hs', 'xy', 'rgb', 'rgbw', 'rgbww']) | list | count > 0 }}"
    has_kelvin: "{{ 'color_temp' in color_modes }}"
    kelvin_min: "{{ state_attr(lamp, 'min_color_temp_kelvin') | int(2000) }}"
    kelvin_max: "{{ state_attr(lamp, 'max_color_temp_kelvin') | int(6500) }}"
    fade: "{{ {'transition': transition} if transition > 0 else {} }}"
    # Une commande envoyée pendant le fondu d'un maintien fige la luminosité atteinte.
    hold_freeze: "{{ {'brightness_pct': fade_level} if fade_level | float(-1) >= 0 else {} }}"
    stop_effect: >-
      {{ {'effect': 'off'} if state_attr(lamp, 'effect') not in [none, 'off', 'none']
         and 'off' in (state_attr(lamp, 'effect_list') or []) else {} }}
    color_fade: "{{ {'transition': color_transition} if color_transition > 0 else {} }}"
- choose:
  - conditions: "{{ action == 'toggle' }}"
    sequence:
    - action: light.toggle
      target: {entity_id: '{{ lamp }}'}
      data: '{{ fade }}'
  - conditions: "{{ action == 'on' }}"
    sequence:
    - action: light.turn_on
      target: {entity_id: '{{ lamp }}'}
      data: "{{ dict(hold_freeze, transition=0) if hold_freeze else fade }}"
  - conditions: "{{ action == 'off' or (action == 'toggle_level' and lamp_on) }}"
    sequence:
    - action: light.turn_off
      target: {entity_id: '{{ lamp }}'}
      data: '{{ fade }}'
  - conditions: "{{ action in ['level', 'toggle_level'] }}"
    sequence:
    - action: light.turn_on
      target: {entity_id: '{{ lamp }}'}
      data: '{{ dict(fade, brightness_pct=on_level_pct) }}'
  - conditions: "{{ action == 'full' }}"
    sequence:
    - action: light.turn_on
      target: {entity_id: '{{ lamp }}'}
      data: '{{ dict(fade, brightness_pct=100) }}'
  # Couleur de référence : premier préréglage pour une lampe couleur, blanc de
  # référence (borné aux limites de la lampe) pour une lampe à blanc réglable seulement.
  - conditions: "{{ action == 'full_reference' }}"
    sequence:
    - action: light.turn_on
      target: {entity_id: '{{ lamp }}'}
      data: >-
        {% set base = dict(stop_effect, **color_fade) %}
        {% if has_color and presets | count > 0 %}
          {{ dict(dict(base, **catalog[presets[0]].data), brightness_pct=100) }}
        {% elif has_kelvin %}
          {{ dict(base, brightness_pct=100, color_temp_kelvin=([kelvin_min, reference_kelvin, kelvin_max] | sort)[1]) }}
        {% else %}
          {{ dict(fade, brightness_pct=100) }}
        {% endif %}
  # Couleur de rappel : luminosité conservée (figée si un fondu de maintien est en cours).
  - conditions: "{{ action == 'recall' }}"
    sequence:
    - if: '{{ not lamp_on and not recall_turns_on }}'
      then:
      - stop: Lampe éteinte ; le rappel n'est pas autorisé à l'allumer.
    - action: light.turn_on
      target: {entity_id: '{{ lamp }}'}
      data: >-
        {{ dict(dict(dict(stop_effect, **color_fade), **hold_freeze), rgb_color=recall_color | map('int') | list) }}
  # Alterner : lampe éteinte → niveau d'allumage ; allumée en dessous du niveau haut →
  # niveau haut ; déjà au niveau haut → retour au niveau d'allumage.
  - conditions: "{{ action == 'alternate' }}"
    sequence:
    - action: light.turn_on
      target: {entity_id: '{{ lamp }}'}
      data: >-
        {{ dict(fade, brightness_pct=(high_level_pct if lamp_on and level < high_level_pct - 1 else on_level_pct)) }}
  # Pas uniques et variations continues partagent la même boucle : un seul passage pour
  # un pas, plusieurs passages bornés par la durée maximale pour un maintien.
  default:
  - variables:
      operation: "{{ action | replace('_hold', '') }}"
      colour_operation: "{{ operation in ['cooler', 'warmer', 'next_preset', 'previous_preset'] }}"
      tick: "{{ preset_hold_interval if colour_operation else hold_interval }}"
      iterations: "{{ ((hold_limit / tick) | round(0, 'ceil') | int) if continuous else 1 }}"
      amount: >-
        {% if gesture in ['dial_up', 'dial_down'] and dial_step is number and dial_step > 0 %}
          {{ ([dial_step * dial_scale, 100] | min) | round(1) }}
        {% elif action.endswith('_hold') %}
          {{ (brightness_speed * hold_interval) | round(2) if brightness_speed > 0 else hold_step_pct }}
        {% else %}{{ step_pct }}{% endif %}
      motion: >-
        {% if colour_operation %}
          {{ ([color_transition, preset_hold_interval] | min) if continuous else color_transition }}
        {% else %}
          {{ (hold_interval if smooth_dimming else 0) if continuous else transition }}
        {% endif %}
      # Position dans la palette : mémoire exacte si la lampe affiche toujours la couleur
      # mémorisée sans changement extérieur, sinon préréglage le plus proche (xy).
      cursor: >-
        {% set xy = state_attr(lamp, 'xy_color') %}
        {% set valid = lamp_on and xy is sequence and xy is not string and xy | count == 2
                       and xy[0] is number and xy[1] is number and presets | count > 0 %}
        {% set observed = [xy[0] | round(4), xy[1] | round(4)] if valid else [] %}
        {% if valid and use_memory and m.p == sha256(presets | to_json)[:8] and 0 <= m.i < presets | count
              and observed == m.x and m.k == sha256(states[lamp].context.id)[:8] %}{{ m.i }}
        {% elif valid %}
          {% set ns = namespace(best=-1, distance=0) %}
          {% for key in presets %}
            {% set c = catalog[key].xy %}
            {% set distance = (xy[0] - c[0]) ** 2 + (xy[1] - c[1]) ** 2 %}
            {% if ns.best < 0 or distance < ns.distance %}
              {% set ns.best = loop.index0 %}{% set ns.distance = distance %}
            {% endif %}
          {% endfor %}{{ ns.best }}
        {% else %}-1{% endif %}
  - if: '{{ colour_operation and not lamp_on and not colors_turn_on }}'
    then:
    - stop: Lampe éteinte ; les changements de couleur ne sont pas autorisés à l'allumer.
  - repeat:
      count: '{{ iterations }}'
      sequence:
      - variables:
          now_on: "{{ is_state(lamp, 'on') }}"
          now_brightness: "{{ state_attr(lamp, 'brightness') | int(0) if is_state(lamp, 'on') else 0 }}"
          now_kelvin: "{{ state_attr(lamp, 'color_temp_kelvin') | int(0) if is_state(lamp, 'on') else 0 }}"
          index: >-
            {% set direction = 1 if operation == 'next_preset' else -1 %}
            {{ ((cursor + direction * repeat.index) if cursor >= 0 else ((repeat.index - 1) * direction))
               % ([presets | count, 1] | max) }}
          request: >-
            {% set now_level = now_brightness / 2.55 %}
            {% if repeat.index > 1 and not now_on %}{{ {} }}
            {% elif operation == 'brighter' %}
              {% set start = (min_pct if continuous else [amount, min_pct] | max) %}
              {% set target = ([now_level + amount, max_pct] | min) if now_on else ([start, max_pct] | min) %}
              {{ {'brightness_pct': target | round(1)}
                 if not now_on or (target * 2.55) | round(0) | int > now_brightness else {} }}
            {% elif operation == 'dimmer' %}
              {% set target = [now_level - amount, min_pct] | max %}
              {{ {'brightness_pct': target | round(1)}
                 if now_on and (target * 2.55) | round(0) | int < now_brightness else {} }}
            {% elif operation in ['cooler', 'warmer'] %}
              {% set base = now_kelvin if now_kelvin > 0 else reference_kelvin %}
              {% set target = ([kelvin_min, base + (kelvin_step if operation == 'cooler' else -kelvin_step), kelvin_max] | sort)[1] %}
              {{ dict(stop_effect, color_temp_kelvin=target) if not now_on or target != now_kelvin else {} }}
            {% elif operation in ['next_preset', 'previous_preset'] and presets | count > 0 %}
              {{ dict(stop_effect, **catalog[presets[index]].data) }}
            {% else %}{{ {} }}{% endif %}
      - if: '{{ request | count == 0 }}'
        then:
        - if: '{{ use_memory and continuous }}'
          then:
          - action: input_text.set_value
            target: {entity_id: '{{ memory_entity }}'}
            data:
              value: >-
                {% set c = states(memory_entity)[4:] | from_json({}) if states(memory_entity).startswith('lr1:') else {} %}
                {% set c = c if c is mapping and c.get('o') == owner else dict(m, v=1, o=owner) %}
                lr1:{{ dict(c, h='', d='', s=0) | to_json }}
        - stop: Butée atteinte, lampe éteinte ou rien à changer ; variation terminée.
      - action: light.turn_on
        target: {entity_id: '{{ lamp }}'}
        data: >-
          {% set data = dict(request, transition=motion) if motion > 0 else request %}
          {{ dict(data, **hold_freeze) if repeat.index == 1 and colour_operation and hold_freeze else data }}
      # Mémorise la position exacte dans la palette, avec la couleur et le contexte
      # observés juste après la commande.
      - if: "{{ use_memory and operation in ['next_preset', 'previous_preset'] and presets | count > 0 }}"
        then:
        - variables:
            shown: "{{ state_attr(lamp, 'xy_color') }}"
        - action: input_text.set_value
          target: {entity_id: '{{ memory_entity }}'}
          data:
            value: >-
              {% set observed = [shown[0] | round(4), shown[1] | round(4)]
                 if shown is sequence and shown is not string and shown | count == 2 else [] %}
              lr1:{{ dict(m, v=1, o=owner, g=gesture, t=event_ts | round(3),
                          h=(gesture if continuous else ''), d=(operation if continuous else ''),
                          s=(event_ts | round(3) if continuous else 0),
                          i=index, p=sha256(presets | to_json)[:8], x=observed,
                          k=sha256(states[lamp].context.id)[:8]) | to_json }}
      - if: '{{ repeat.index < iterations }}'
        then:
        - delay:
            seconds: '{{ tick }}'
  # Fin naturelle d'un maintien (durée maximale atteinte) : la mémoire est désarmée.
  - if: '{{ use_memory and continuous }}'
    then:
    - action: input_text.set_value
      target: {entity_id: '{{ memory_entity }}'}
      data:
        value: >-
          {% set c = states(memory_entity)[4:] | from_json({}) if states(memory_entity).startswith('lr1:') else {} %}
          {% set c = c if c is mapping and c.get('o') == owner else dict(m, v=1, o=owner) %}
          lr1:{{ dict(c, h='', d='', s=0) | to_json }}
