# Source of the « Notifications — Mobile relay » blueprint.
# tools/build_notifications.py adds the version to the name and writes the published file.
blueprint:
  name: Notifications — Mobile relay
  description: >-
    Forwards to the dispatcher every persistent notification created by Home Assistant or an
    integration, with a level deduced from the title, and clears the notification on the
    phone when it is dismissed in Home Assistant. Notifications whose identifier starts with
    a chosen prefix can be ignored, or dismissed as soon as they appear without ever
    reaching the phone.
    Guide: https://github.com/fbonelle/home-assistant-blueprints/blob/main/docs/notification_system.en.md
  domain: automation
  homeassistant:
    min_version: '@min_version'  # tools/versioning.py (MIN_HA)
  source_url: https://github.com/fbonelle/home-assistant-blueprints/blob/main/blueprints/automation/notification_system/mobile_relay.yaml
  author: fbonelle
  input:
    delivery:
      name: Delivery
      input:
        dispatcher_script:
          name: Notification dispatcher
          description: Script created from the « Notifications — Dispatcher » blueprint.
          selector:
            entity:
              filter:
                - domain: script
        target:
          name: Recipient
          description: « all » for the whole family, « main » for the main phone.
          default: main
          selector:
            select:
              options: [main, all]
        clear_service:
          name: Notification action used for clearing
          description: >-
            notify action of the mobile app that receives the order to clear a notification
            dismissed in Home Assistant, for example notify.mobile_app_my_phone. Leave empty to
            clear nothing on the phone.
          default: ''
          selector:
            text: {}
    filters:
      name: Filters
      input:
        ignored_prefixes:
          name: Prefixes never forwarded
          description: >-
            Notifications whose identifier starts with one of these prefixes stay in Home
            Assistant without being sent. The dispatcher's notifications (sys_disp_) are always
            ignored, which prevents any loop.
          default: []
          selector:
            text:
              multiple: true
        dismissed_prefixes:
          name: Prefixes dismissed automatically
          description: >-
            Notifications whose identifier starts with one of these prefixes are dismissed as
            soon as they appear and are never sent to the phone. Example:
            capfile_energy_manual_.
          default: []
          selector:
            text:
              multiple: true
    levels:
      name: Level deduced from the title
      input:
        critical_markers:
          name: « critical » level markers
          description: A title containing one of these texts is sent as « critical ».
          default: ['🚨', Emergency, Failure]
          selector:
            text:
              multiple: true
        warning_markers:
          name: « warning » level markers
          default: ['⚠️', Alert]
          selector:
            text:
              multiple: true
        technical_markers:
          name: « technical » level markers
          description: Other titles are sent as « info ».
          default: ['🔧', '📡', '🔴', '🟢']
          selector:
            text:
              multiple: true
# Queued and not `single`: notifications arrive in bursts during a cascading failure, and a
# « mark all as read » produces several simultaneous dismissals. In `single` mode the
# following ones would be dropped. The queue also handles dismissal and forwarding in the
# order of arrival.
mode: queued
max: 30
max_exceeded: warning
variables:
  dispatcher_script: !input dispatcher_script
  target: !input target
  clear_service: !input clear_service
  ignored_prefixes: !input ignored_prefixes
  dismissed_prefixes: !input dismissed_prefixes
  critical_markers: !input critical_markers
  warning_markers: !input warning_markers
  technical_markers: !input technical_markers
  notification_id: "{{ trigger.notification.notification_id | default('', true) | string | trim }}"
  # Prefix of the dispatcher's own notifications: never forwarded (loop guard).
  own_notification: "{{ notification_id.startswith('sys_disp_') }}"
  # Prefix comparison with an explicit loop: Jinja has no « starts with » test applicable to
  # a list. Empty prefixes are ignored.
  auto_dismissed: >
    {% set ns = namespace(hit=false) %}
    {% for p in dismissed_prefixes | default([], true) %}
      {% if p is string and p != '' and notification_id.startswith(p) %}{% set ns.hit = true %}{% endif %}
    {% endfor %}
    {{ ns.hit }}
  ignored: >
    {% set ns = namespace(hit=false) %}
    {% for p in ignored_prefixes | default([], true) %}
      {% if p is string and p != '' and notification_id.startswith(p) %}{% set ns.hit = true %}{% endif %}
    {% endfor %}
    {{ ns.hit }}
triggers:
  # Dedicated trigger and not a call_service event: a notification created in Python by an
  # integration (persistent_notification.async_create) does not go through the service
  # bus. This trigger catches every path.
  # `current` is never sent to automations (only to interface clients): only notifications
  # created after the automation was loaded are seen. Persistent notifications do not
  # survive a restart, and integrations create theirs again after start-up. `updated` is
  # kept: a notification republished with a changed content carries new information; with
  # identical content, the dispatcher's duplicate filter absorbs it.
  - trigger: persistent_notification
    update_type: [added, updated]
    id: relay
  # Dismissal made from the interface, by an integration or by a service: every path is
  # covered.
  - trigger: persistent_notification
    update_type: [removed]
    id: removed
actions:
  - choose:
      # Automatic dismissal: the notification disappears before any send.
      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'relay' and auto_dismissed }}"
        sequence:
          - action: persistent_notification.dismiss
            data:
              notification_id: "{{ notification_id }}"
      # Forwarding to the dispatcher.
      - conditions:
          - condition: template
            value_template: >
              {{ trigger.id == 'relay' and not own_notification and not ignored }}
        sequence:
          - variables:
              title_text: "{{ trigger.notification.title | default('', true) | string }}"
              level: >
                {% if critical_markers | select('in', title_text) | list | count > 0 %}critical
                {% elif warning_markers | select('in', title_text) | list | count > 0 %}warning
                {% elif technical_markers | select('in', title_text) | list | count > 0 %}technical
                {% else %}info{% endif %}
          - action: "{{ dispatcher_script }}"
            data:
              title: "{{ trigger.notification.title | default('System alert', true) }}"
              message: "{{ trigger.notification.message | default('No details given.', true) }}"
              target: "{{ target }}"
              level: "{{ level }}"
              # skip_trace: the message already is a persistent notification, it must not
              # create a second one. notif_id: same identifier, for 1:1 clearing.
              data:
                skip_trace: true
                notif_id: "{{ notification_id }}"
      # Clearing on the phone. The tag applies the SAME idempotent normalisation as the send
      # to the mobile app, otherwise the 1:1 match breaks. A notification dismissed
      # automatically was never sent: nothing to clear.
      - conditions:
          - condition: template
            value_template: >
              {{ trigger.id == 'removed' and not auto_dismissed
                 and clear_service | default('') | string | trim != '' }}
        sequence:
          - action: "{{ clear_service }}"
            continue_on_error: true
            data:
              message: clear_notification
              data:
                tag: >
                  {% if notification_id in ['', 'None'] %}sys_unknown
                  {% elif notification_id.startswith('sys_disp_') %}{{ notification_id }}
                  {% else %}sys_disp_{{ notification_id }}{% endif %}
