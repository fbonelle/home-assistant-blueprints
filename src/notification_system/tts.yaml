# Source du blueprint « Notifications — Lecture vocale ».
# tools/build_notifications.py ajoute la version au nom et écrit le fichier publié.
blueprint:
  name: Notifications — Lecture vocale
  description: >-
    Lit un message à voix haute sur les enceintes portant une étiquette choisie, une
    annonce après l’autre. Au niveau « critical », le volume est monté puis l’état des
    enceintes est restauré après la lecture. Un interrupteur coupe toute lecture.
    Appelé par le « Répartiteur de notifications » ; utilisable seul avec les champs
    message et level.
    Guide : https://github.com/fbonelle/home-assistant-blueprints/blob/main/docs/notification_system.md
  domain: script
  homeassistant:
    min_version: 2026.10.0
  source_url: https://github.com/fbonelle/home-assistant-blueprints/blob/main/blueprints/script/notification_system/lecture_vocale.yaml
  author: fbonelle
  input:
    tts_entity:
      name: Moteur de synthèse vocale
      description: Entité tts utilisée pour parler, par exemple tts.piper.
      selector:
        entity:
          filter:
            - domain: tts
    speaker_label:
      name: Étiquette des enceintes
      description: >-
        Seuls les lecteurs multimédias portant cette étiquette parlent. Sans enceinte
        étiquetée disponible, rien n’est lu et un avertissement est écrit dans le journal :
        le script ne choisit jamais d’enceinte au hasard.
      default: tts
      selector:
        label: {}
    mute_entity:
      name: Interrupteur de silence
      description: Entrée booléenne qui, activée, coupe toute lecture. Laisser vide pour ne jamais couper.
      default: ''
      selector:
        entity:
          filter:
            - domain: input_boolean
    critical_volume:
      name: Volume des annonces critiques
      default: 0.8
      selector:
        number: {min: 0.1, max: 1, step: 0.05, mode: slider}
    chars_per_second:
      name: Débit de lecture estimé
      description: >-
        Sert à estimer la durée d’une annonce critique avant de restaurer les enceintes :
        longueur du texte divisée par ce débit, plus 2 secondes.
      default: 12
      selector:
        number: {min: 5, max: 30, step: 1, unit_of_measurement: caractères/s, mode: box}
# File d’attente : deux annonces ne se coupent jamais, la seconde attend la fin de la
# première. Ce mode est la raison pour laquelle la lecture vocale reste un script séparé
# du répartiteur, qui lui fonctionne en parallèle.
mode: queued
max: 15
icon: mdi:account-voice
fields:
  message:
    name: Texte à dire
    example: Bonjour
    required: true
    selector:
      text:
        multiline: true
  level:
    name: Niveau
    description: « critical » monte le volume puis restaure l’état des enceintes.
    default: info
    selector:
      select:
        options: [info, warning, critical, technical]
variables:
  tts_entity: !input tts_entity
  speaker_label: !input speaker_label
  mute_entity: !input mute_entity
  critical_volume: !input critical_volume
  chars_per_second: !input chars_per_second
sequence:
  # Les valeurs par défaut des champs ne s’appliquent qu’à l’interface : un appel qui omet
  # le niveau le laisse indéfini.
  - variables:
      message: "{{ message | default('', true) }}"
      level: "{{ level | default('info', true) }}"
  - condition: template
    value_template: >
      {{ mute_entity | default('') | string | trim == '' or not is_state(mute_entity, 'on') }}
  - variables:
      # Seuls les lecteurs étiquetés et joignables sont retenus. L’absence d’étiquette est
      # une erreur de configuration, pas un cas normal : mieux vaut se taire et le
      # signaler que de parler sur un ampli, un Spotify Connect ou une enceinte invitée.
      active_speakers: >
        {{ label_entities(speaker_label) | default([], true)
           | select('match', '^media_player[.]')
           | reject('is_state', ['unavailable', 'unknown'])
           | list }}
      tts_delay: "{{ (message | length / (chars_per_second | float(12))) | int + 2 }}"
      restore_scene: "{{ 'tts_restore_' ~ this.entity_id.split('.')[1] }}"
  - if:
      - condition: template
        value_template: "{{ active_speakers | length == 0 }}"
    then:
      - action: system_log.write
        data:
          level: warning
          logger: notification_system
          message: >-
            [Lecture vocale] Aucune enceinte disponible avec l’étiquette « {{ speaker_label }} ».
      - stop: Aucune enceinte cible
  # Annonce critique : instantané de l’état des enceintes avant de monter le volume.
  - if:
      - condition: template
        value_template: "{{ level == 'critical' }}"
    then:
      - action: scene.create
        data:
          scene_id: "{{ restore_scene }}"
          snapshot_entities: "{{ active_speakers }}"
  - repeat:
      for_each: "{{ active_speakers }}"
      sequence:
        - if:
            - condition: template
              value_template: "{{ level == 'critical' }}"
          then:
            - action: media_player.volume_set
              continue_on_error: true
              target:
                entity_id: "{{ repeat.item }}"
              data:
                volume_level: "{{ critical_volume | float(0.8) }}"
        # Une enceinte en échec ne doit pas empêcher les autres de parler.
        - action: tts.speak
          continue_on_error: true
          target:
            entity_id: "{{ tts_entity }}"
          data:
            media_player_entity_id: "{{ repeat.item }}"
            message: "{{ message }}"
            cache: true
  # Restauration après la durée estimée de l’annonce critique.
  - if:
      - condition: template
        value_template: "{{ level == 'critical' }}"
    then:
      - delay:
          seconds: "{{ tts_delay }}"
      - action: scene.turn_on
        continue_on_error: true
        target:
          entity_id: "{{ 'scene.' ~ restore_scene }}"
