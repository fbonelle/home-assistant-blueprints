# Source of the « Notifications — Dispatcher » blueprint.
# tools/build_notifications.py adds the version to the name and writes the published file.
blueprint:
  name: Notifications — Dispatcher
  description: >-
    Single entry point of every notification: chooses the channels by level (info, warning,
    critical, technical), adapts links and attachments to each channel, drops duplicates,
    makes notifications silent at night, falls back from ntfy to the mobile app when ntfy
    fails, and starts text-to-speech. Messages go through the « Notifications — Channel
    sender » script, which isolates each channel. Create this script with the identifier you
    want (for example notify_dispatch_global): its fields title, message, level, target,
    entity_id, tts and data form the interface called by automations.
    Guide: https://github.com/fbonelle/home-assistant-blueprints/blob/main/docs/notification_system.en.md
  domain: script
  homeassistant:
    min_version: '@min_version'  # tools/versioning.py (minimum_ha)
  source_url: https://github.com/fbonelle/home-assistant-blueprints/blob/main/blueprints/script/notification_system/dispatcher.yaml
  author: fbonelle
  input:
    scripts:
      name: Scripts used
      input:
        sender_script:
          name: Channel sender script
          description: Script created from the « Notifications — Channel sender » blueprint.
          selector:
            entity:
              filter:
                - domain: script
        tts_script:
          name: Text-to-speech script
          description: >-
            Script created from the « Notifications — Text-to-speech » blueprint. Leave empty to
            never read notifications aloud.
          default: ''
          selector:
            entity:
              filter:
                - domain: script
    routing:
      name: Channels by level
      input:
        mobile_levels:
          name: Levels sent to the mobile app
          default: [info, warning, critical]
          selector:
            select:
              multiple: true
              options: [info, warning, critical, technical]
        ntfy_levels:
          name: Levels sent to ntfy
          default: [technical]
          selector:
            select:
              multiple: true
              options: [info, warning, critical, technical]
        ntfy_fallback:
          name: Fall back to the mobile app when ntfy fails
          description: >-
            When the ntfy send fails, the message goes to the mobile app, with the title
            prefixed by « 🚨 FALLBACK NTFY: ».
          default: true
          selector:
            boolean: {}
        email_levels:
          name: Levels sent by e-mail
          default: [critical]
          selector:
            select:
              multiple: true
              options: [info, warning, critical, technical]
        logbook_levels:
          name: Levels written to the logbook
          default: [warning, critical, technical]
          selector:
            select:
              multiple: true
              options: [info, warning, critical, technical]
        ntfy_tags:
          name: Default ntfy tags
          description: ntfy emoji tags when the message gives none (data.tags).
          default: [hammer_and_wrench, server]
          selector:
            object: {}
    links:
      name: Links and attachments
      input:
        home_url:
          name: Home Assistant address
          description: >-
            Address used for web links (e-mail), icons and the attachments sent to ntfy and to
            the mobile app. No trailing slash.
          default: http://homeassistant.local:8123
          selector:
            text:
              type: url
        default_link:
          name: Page opened by default
          description: Path opened by a notification that gives neither a link nor an entity.
          default: /lovelace/0
          selector:
            text: {}
        technical_link:
          name: Page opened by a technical notification
          default: /config/logs
          selector:
            text: {}
        media_root:
          name: Media root of attached images
          description: >-
            Media source root of the /config/www folder, used to attach images to the e-mail. It
            must match configuration.yaml (homeassistant > media_dirs).
          default: media-source://media_source/local
          selector:
            text: {}
    quiet:
      name: Night and text-to-speech
      input:
        night_start_hour:
          name: Night start
          description: Hour from which mobile notifications are silent.
          default: 21
          selector:
            number: {min: 0, max: 23, step: 1, unit_of_measurement: h, mode: box}
        night_end_hour:
          name: Night end
          default: 8
          selector:
            number: {min: 0, max: 23, step: 1, unit_of_measurement: h, mode: box}
        speak_levels:
          name: Levels always read aloud
          default: [critical]
          selector:
            select:
              multiple: true
              options: [info, warning, critical, technical]
        speak_present_levels:
          name: Levels read aloud by day when someone is home
          default: [warning]
          selector:
            select:
              multiple: true
              options: [info, warning, critical, technical]
        presence_entity:
          name: Presence
          description: Zone or entity whose numeric value is the number of people at home.
          default: zone.home
          selector:
            entity:
              filter:
                - domain: zone
    dedup:
      name: Duplicate filter
      input:
        dedup_memory:
          name: Duplicate filter memory
          description: >-
            Text helper used for this memory only, maximum length 255. It keeps the
            fingerprints of the last notifications sent.
          selector:
            entity:
              filter:
                - domain: input_text
        dedup_window:
          name: Duplicate window
          description: An identical message (same level, title and text) is not sent again during this delay.
          default: 300
          selector:
            number: {min: 0, max: 3600, step: 10, unit_of_measurement: s, mode: box}
        dedup_slots:
          name: Number of messages remembered
          description: 21 characters per message; 10 fit in a Text helper of 255 characters.
          default: 10
          selector:
            number: {min: 1, max: 11, step: 1, mode: box}
# Entry point of every notification: the default limit of 10 runs would be felt here first,
# all the more since the dispatcher waits for the e-mail to return (SMTP takes several
# seconds).
mode: parallel
max: 25
icon: mdi:call-split
fields:
  title:
    name: Title
    example: Washing machine
    selector:
      text: {}
  message:
    name: Message
    example: The cycle is finished.
    selector:
      text:
        multiline: true
  level:
    name: Level
    default: info
    selector:
      select:
        options: [info, warning, critical, technical]
  target:
    name: Recipient
    description: >-
      « all »: the whole family. Any other value (« main » by default): the main phone.
    default: main
    selector:
      select:
        options: [main, all]
  entity_id:
    name: Related entity
    description: Without an explicit link, the notification opens the history of this entity.
    selector:
      entity: {}
  tts:
    name: Force text-to-speech
    default: false
    selector:
      boolean: {}
  data:
    name: Advanced data
    description: >-
      click (link), icon (ntfy icon), snapshot_file (image), actions (buttons), priority and
      tags (ntfy), html (added to the e-mail), notif_id (identifier), skip_trace (no
      persistent notification).
    default: {}
    selector:
      object: {}
variables:
  sender_script: !input sender_script
  tts_script: !input tts_script
  mobile_levels: !input mobile_levels
  ntfy_levels: !input ntfy_levels
  ntfy_fallback: !input ntfy_fallback
  email_levels: !input email_levels
  logbook_levels: !input logbook_levels
  ntfy_tags: !input ntfy_tags
  domain_url: !input home_url
  default_link: !input default_link
  technical_link: !input technical_link
  snapshot_media_root: !input media_root
  night_start_hour: !input night_start_hour
  night_end_hour: !input night_end_hour
  speak_levels: !input speak_levels
  speak_present_levels: !input speak_present_levels
  presence_entity: !input presence_entity
  dedup_memory: !input dedup_memory
  dedup_window_s: !input dedup_window
  dedup_max_slots: !input dedup_slots
sequence:
  # Field defaults only apply in the interface: a call that omits a field leaves it
  # undefined. Every field is therefore normalised here, once.
  - variables:
      title: "{{ title | default('', true) }}"
      message: "{{ message | default('', true) }}"
      level: >
        {% set l = level | default('info', true) | string | lower | trim %}
        {{ l if l in ['info', 'warning', 'critical', 'technical'] else 'info' }}
      target: "{{ target | default('main', true) }}"
      tts: "{{ tts | default(false) | bool }}"
      sdata: "{{ data if data is defined and data is mapping else {} }}"
  - variables:
      current_hour: "{{ now().hour | int(0) }}"
      is_night: >
        {% set s = night_start_hour | int(21) %}{% set e = night_end_hour | int(8) %}
        {{ (current_hour >= s or current_hour < e) if s > e else (current_hour >= s and current_hour < e) }}
      is_occupied: "{{ states(presence_entity) | int(0) > 0 }}"
      send_ha: "{{ level in mobile_levels }}"
      send_ntfy: "{{ level in ntfy_levels }}"
      send_email: "{{ level in email_levels }}"
      # Text-to-speech: the « always read » levels are unconditional, `tts: true` forces the
      # reading whatever the level, and the « presence » levels are read only by day when
      # someone is home. Without this filter, the spontaneous Home Assistant messages
      # forwarded by the relay would be read aloud.
      should_speak: >
        {{ tts_script | default('') | string | trim != ''
           and (level in speak_levels
                or (tts | default(false) | bool)
                or (is_occupied and not is_night and level in speak_present_levels)) }}
      color_hex: >
        {% if level == 'critical' %}#D32F2F
        {% elif level == 'warning' %}#FF9800
        {% elif level == 'technical' %}#607D8B
        {% else %}#2196F3{% endif %}
      ios_subtitle: >
        {% if level == 'critical' %}🚨 EMERGENCY
        {% elif level == 'warning' %}⚠️ WARNING
        {% elif level == 'technical' %}🔧 SYSTEM
        {% else %}ℹ️ INFO{% endif %}
      notify_group: "ha_{{ level }}"
      link_path: >
        {% if sdata.get('click') %}{{ sdata.get('click') }}
        {% elif entity_id is defined and entity_id is not none and entity_id | string not in ['', 'None'] %}/history?entity_id={{ entity_id }}
        {% elif level == 'technical' %}{{ technical_link }}
        {% else %}{{ default_link }}{% endif %}
      link_clean: "{{ link_path | trim }}"
      web_url: "{{ link_clean if link_clean.startswith('http') else domain_url ~ (link_clean if link_clean.startswith('/') else '/' ~ link_clean) }}"
      app_url: "{{ link_clean if link_clean.startswith('http') else 'homeassistant://navigate' ~ (link_clean if link_clean.startswith('/') else '/' ~ link_clean) }}"
      icon_url: "{{ sdata.get('icon', domain_url ~ '/static/icons/favicon-192x192.png') }}"
      # ------------------------------------------------------------------------
      # ATTACHMENT — SINGLE SOURCE
      # data.snapshot_file is shared by three channels that do not expect the same format:
      # ntfy wants an absolute URL, the mobile app a URL or a /local/… path, and SMTP a
      # media source URI. The two useful forms are derived here.
      # ------------------------------------------------------------------------
      attach_raw: "{{ sdata.get('snapshot_file', '') | string | trim }}"
      # Text discriminant: a variable rendered as « False » would stay a truthy string if
      # native typing did not apply. Comparing strings is safe.
      attach_kind: >
        {% if attach_raw in ['', 'None'] %}none
        {% elif attach_raw.startswith('http') %}remote
        {% elif attach_raw.startswith('media-source://') %}media
        {% else %}local{% endif %}
      # Path relative to /config/www, sub-folders kept:
      #   /config/www/snapshots/cam.jpg, /local/snapshots/cam.jpg or www/snapshots/cam.jpg
      #   all give /snapshots/cam.jpg.
      attach_path: >
        {% set p = attach_raw %}
        {% if p.startswith('/config/www') %}{% set p = p[11:] %}
        {% elif p.startswith('/local') %}{% set p = p[6:] %}
        {% elif p.startswith('www/') %}{% set p = p[3:] %}
        {% endif %}
        {{ p if p.startswith('/') else '/' ~ p }}
      # Absolute URL form: ntfy (attach) and mobile app (image).
      attach_url: >
        {% if attach_kind == 'remote' %}{{ attach_raw }}
        {% elif attach_kind == 'local' %}{{ domain_url ~ '/local' ~ attach_path }}
        {% endif %}
      # Media source form: e-mail. A remote URL is passed as is: the e-mail send quotes it
      # in the HTML, since SMTP cannot attach a URL.
      attach_media: >
        {% if attach_kind in ['remote', 'media'] %}{{ attach_raw }}
        {% elif attach_kind == 'local' %}{{ snapshot_media_root ~ attach_path }}
        {% endif %}
      actions: "{{ sdata.get('actions', []) }}"
      skip_trace: "{{ sdata.get('skip_trace', false) | bool }}"
      # ------------------------------------------------------------------------
      # DUPLICATE FILTER
      # Neutralises every cause of repetition whatever the entry path: double producer,
      # double registration of the mobile app, republishing of the same identifier and
      # relay -> dispatcher loops. It is also the safeguard against flooding by a flapping
      # sensor.
      # Caveat: two truly simultaneous runs (parallel mode) may read the memory before one
      # of them writes; Home Assistant offers no atomic compare-and-swap. Since the relay is
      # queued, the main path is serialised.
      # ------------------------------------------------------------------------
      dedup_now: "{{ as_timestamp(now()) | int(0) }}"
      # Fingerprint: md5 truncated to 10 hexadecimal characters (40 bits), a collision
      # probability of about 1e-11 per send over 10 slots. The level is part of the
      # fingerprint: an info -> critical escalation of the same text goes through.
      dedup_fp: "{{ ((level ~ '::' ~ title ~ '::' ~ message) | md5)[:10] }}"
      dedup_state: "{{ states(dedup_memory) | default('', true) }}"
      # Defensive read: a malformed, non-numeric or expired slot is dropped. A corrupt,
      # « unknown » or « unavailable » state gives an empty list, so nothing is ever
      # suppressed by mistake.
      dedup_fresh: >
        {% set ns = namespace(slots=[]) %}
        {% for item in dedup_state.split('|') %}
          {% if ':' in item %}
            {% set ts = item.split(':')[0] | int(0) %}
            {% set fp = item.split(':')[1] %}
            {% if ts > 0 and fp != '' and (dedup_now | int(0)) - ts < (dedup_window_s | int(300)) %}
              {% set ns.slots = ns.slots + [item] %}
            {% endif %}
          {% endif %}
        {% endfor %}
        {{ ns.slots }}
      # Duplicate when the fingerprint is in a slot still valid, whatever its rank: this is
      # what catches the A, B, A, B alternation. A single loop gives both the verdict and
      # the age of the matching slot.
      dedup_match_age: >
        {% set ns = namespace(age=-1) %}
        {% for item in dedup_fresh %}
          {% if item.split(':')[1] == dedup_fp and ns.age < 0 %}
            {% set ns.age = (dedup_now | int(0)) - (item.split(':')[0] | int(0)) %}
          {% endif %}
        {% endfor %}
        {{ ns.age }}
      is_duplicate: "{{ (dedup_match_age | int(-1)) >= 0 }}"
      notif_uid_in: "{{ sdata.get('notif_id', '') }}"
  # Immediate exit on a duplicate, BEFORE any send and before any persistent
  # notification: no channel is used.
  - if:
      - condition: template
        value_template: "{{ is_duplicate }}"
    then:
      # Dropping a duplicate is normal operation: INFO level, not a warning. The dispatcher
      # sets this level itself, with no configuration.
      - action: logger.set_level
        continue_on_error: true
        data:
          notification_system: info
      - action: system_log.write
        continue_on_error: true
        data:
          level: info
          logger: notification_system
          message: >-
            [Dispatcher] Duplicate dropped after {{ dedup_match_age }} s (window
            {{ dedup_window_s }} s) — level {{ level }}: {{ title }}
      - stop: Duplicate dropped
  - if:
      - condition: template
        value_template: "{{ level in logbook_levels }}"
    then:
      # Same event as logbook.log; delivery also works when Logbook is disabled.
      - event: logbook_entry
        event_data:
          name: "Notification {{ level | upper }}"
          message: "{{ title }} - {{ message }}"
          entity_id: "{{ this.entity_id }}"
          domain: script
  - parallel:
      # ======================================================================
      # NTFY, then fallback to the mobile app
      # ======================================================================
      - if:
          - condition: template
            value_template: "{{ send_ntfy }}"
        then:
          # Call of the sender script: an error stops the called script, and
          # continue_on_error catches it here. A missing « success » signals the failure.
          - action: "{{ sender_script }}"
            continue_on_error: true
            response_variable: ntfy_result
            data:
              channel: ntfy
              title: "{{ title }}"
              message: "{{ message }}"
              click_url: "{{ app_url }}"
              icon_url: "{{ icon_url }}"
              attach_file: "{{ attach_url }}"
              priority: "{{ sdata.get('priority', 3) | int(3) }}"
              tags: "{{ sdata.get('tags', ntfy_tags) }}"
              actions: "{{ actions }}"
          - if: "{{ ntfy_result is mapping and ntfy_result.status == 'success' }}"
            then:
            - &remember_delivery
              action: input_text.set_value
              continue_on_error: true
              target: {entity_id: "{{ dedup_memory }}"}
              data:
                # Re-read after delivery: slow channels must preserve newer successful sends.
                value: >-
                  {% set now_s = as_timestamp(now()) | int %}
                  {% set ns = namespace(slots=[now_s | string ~ ':' ~ dedup_fp]) %}
                  {% for item in states(dedup_memory).split('|') %}
                    {% set parts = item.split(':') %}
                    {% if parts | length == 2 and parts[1] != dedup_fp and
                          0 <= now_s - (parts[0] | int(0)) < dedup_window_s | int %}
                      {% set ns.slots = ns.slots + [item] %}
                    {% endif %}
                  {% endfor %}
                  {{ ns.slots[:dedup_max_slots | int] | join('|') }}
          - if:
              - condition: template
                value_template: >
                  {% if ntfy_result is defined and ntfy_result %}
                    {{ ntfy_result.status | default('error', true) != 'success' }}
                  {% else %}true{% endif %}
            then:
              - action: system_log.write
                data:
                  level: warning
                  logger: notification_system
                  message: >-
                    [Dispatcher] ntfy failed{{ '; falling back to the mobile app' if ntfy_fallback else '' }}.
              - if:
                  - condition: template
                    value_template: "{{ ntfy_fallback }}"
                then:
                  - action: "{{ sender_script }}"
                    continue_on_error: true
                    response_variable: fallback_result
                    data:
                      channel: mobile
                      target: "{{ target }}"
                      title: "🚨 FALLBACK NTFY: {{ title }}"
                      message: "{{ message }}"
                      click_url: "{{ link_clean }}"
                      group_tag: "{{ notify_group }}"
                      color_hex: "{{ color_hex }}"
                      subtitle: "{{ ios_subtitle }}"
                      sound_name: default
                      is_critical: false
                      attach_file: "{{ attach_url }}"
                      skip_trace: "{{ skip_trace }}"
                      notif_id: "{{ notif_uid_in }}"
                      actions: "{{ actions }}"
                  - if: "{{ fallback_result is mapping and fallback_result.status == 'success' }}"
                    then:
                    - *remember_delivery
      # ======================================================================
      # MOBILE APP
      # ======================================================================
      - if:
          - condition: template
            value_template: "{{ send_ha }}"
        then:
          - action: "{{ sender_script }}"
            continue_on_error: true
            response_variable: mobile_result
            data:
              channel: mobile
              target: "{{ target }}"
              title: "{{ title }}"
              message: "{{ message }}"
              click_url: "{{ link_clean }}"
              group_tag: "{{ notify_group }}"
              color_hex: "{{ color_hex }}"
              subtitle: "{{ ios_subtitle }}"
              sound_name: "{{ 'none' if is_night else 'default' }}"
              is_critical: "{{ level == 'critical' }}"
              attach_file: "{{ attach_url }}"
              skip_trace: "{{ skip_trace }}"
              notif_id: "{{ notif_uid_in }}"
              actions: "{{ actions }}"
          - if: "{{ mobile_result is mapping and mobile_result.status == 'success' }}"
            then:
            - *remember_delivery
      # ======================================================================
      # E-MAIL
      # ======================================================================
      - if:
          - condition: template
            value_template: "{{ send_email }}"
        then:
          - action: "{{ sender_script }}"
            continue_on_error: true
            response_variable: email_result
            data:
              channel: email
              title: "{{ title }}"
              message: "{{ message }}"
              click_url: "{{ web_url }}"
              color_hex: "{{ color_hex }}"
              attach_file: "{{ attach_media }}"
              extra_html: "{{ sdata.get('html', '') }}"
          - if: "{{ email_result is mapping and email_result.status == 'success' }}"
            then:
            - *remember_delivery
          - if:
              - condition: template
                value_template: >
                  {% if email_result is defined and email_result %}
                    {{ email_result.status | default('error', true) != 'success' }}
                  {% else %}true{% endif %}
            then:
              - action: system_log.write
                data:
                  level: warning
                  logger: notification_system
                  message: >-
                    [Dispatcher] E-mail failed; the other channels were served.
      # ======================================================================
      # TEXT-TO-SPEECH
      # Started without waiting (script.turn_on): the text-to-speech script is queued and
      # may take time; the dispatcher must not depend on it.
      # ======================================================================
      - if:
          - condition: template
            value_template: "{{ should_speak }}"
        then:
          - action: script.turn_on
            target:
              entity_id: "{{ tts_script }}"
            data:
              variables:
                message: "{{ title }}. {{ message }}"
                level: "{{ level }}"
