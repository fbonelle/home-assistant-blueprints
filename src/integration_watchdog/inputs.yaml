monitoring:
  name: Integration and entities to watch
  input:
    name:
      selector:
        text: {}
      name: Name in notifications
      default: Watched integration
    entry_id:
      selector:
        config_entry: {}
      name: Configuration of the integration to watch
      description: Choose the account or gateway concerned. Two accounts or two gateways of the same
        integration are set up separately.
    entities:
      selector:
        entity:
          multiple: true
      name: Entities to watch
      description: 'Choose active entities of this integration: for example a temperature, a cover or
        a thermostat. Their state shows when something is wrong.'
    memory:
      selector:
        entity:
          filter:
          - domain: input_text
      name: Text helper that keeps the history
      description: Create a Text helper in Home Assistant, minimum length 0 and maximum 255. It keeps the
        attempts and their state across a restart. Use a different helper for every watched
        configuration.
    policy:
      default: all
      selector:
        select:
          options:
          - label: When every entity is failing
            value: all
          - label: When at least one entity is failing
            value: any
      name: When should the integration be reloaded?
    max_age:
      selector:
        number:
          min: 0
          max: 604800
          step: 1
          mode: box
      default: 0
      name: Maximum delay without new data (seconds)
      description: 0 disables this check. Use it for measurements sent regularly. When the integration
        gives no measurement date, the check relies on the data received by Home Assistant.
    stagger_seconds:
      selector:
        number:
          min: 0
          max: 600
          step: 1
          mode: box
      default: 0
      name: Extra delay before a reload (seconds)
      description: Spreads the reloads of several integrations so that they are not all requested at the
        same moment.
    source_time_entity:
      selector:
        entity: {}
      name: Entity giving the date of the last measurement (optional)
      default: ''
      description: Fill in only when an entity gives the real date of the measurement. The delay without
        new data must then be above 0.
    source_time_attribute:
      selector:
        text: {}
      name: Attribute holding the measurement date (optional)
      default: ''
      description: Leave empty when the date is directly in the state of the entity chosen above.
    uptime_entity:
      name: Home Assistant Uptime sensor
      selector:
        entity:
          filter:
          - domain: sensor
            integration: uptime
    scan_minutes:
      name: Check frequency
      default: /1
      selector:
        select:
          options:
          - label: Every minute
            value: /1
          - label: Every 2 minutes
            value: /2
          - label: Every 5 minutes
            value: /5
          - label: Every 10 minutes
            value: /10
    fault_seconds:
      name: Minimum failure duration before a reload (seconds)
      default: 300
      selector:
        number:
          min: 30
          max: 86400
          step: 1
          mode: box
    include_unknown:
      name: Count the « unknown » state as a failure
      description: The unknown state means that Home Assistant does not know the value. This option
        triggers a reload when that state lasts long enough. It never confirms a recovery.
      default: false
      selector:
        boolean: {}
    startup_seconds:
      name: Wait after Home Assistant start-up (seconds)
      default: 600
      selector:
        number:
          min: 60
          max: 86400
          step: 1
          mode: box
      description: Gives the integrations time to connect before a reload is attempted.
recovery:
  name: Reloads and number of attempts
  input:
    observation_only:
      name: Observe without reloading the integration
      default: false
      selector:
        boolean: {}
    logging_enabled:
      name: Record events in the logs
      default: true
      description: integration_watchdog logger. The watchdog sets its level itself (info, or debug with
        detailed logs); no configuration is needed.
      selector:
        boolean: {}
    detailed_logging:
      name: Enable detailed logs
      default: false
      description: Adds a line at every check. Keep it for diagnosis; the messages do not contain the
        sensor values.
      selector:
        boolean: {}
    excluded_instances:
      name: Configurations to exclude
      default: []
      selector:
        object:
          multiple: true
          fields:
            entry_id:
              label: Configuration to exclude
              required: true
              selector:
                config_entry: {}
    max_attempts:
      name: Maximum number of attempts for one failure
      default: 3
      selector:
        number:
          min: 1
          max: 10
          step: 1
          mode: box
      description: Once this limit is reached, reloads stop and a notification is sent. The counter is
        reset after a lasting recovery or a manual action.
    max_daily:
      name: Maximum number of attempts over the last 24 hours
      default: 6
      selector:
        number:
          min: 1
          max: 6
          step: 1
          mode: box
      description: 'This limit still applies after a new failure or a normal Home Assistant restart.
        Maximum: 6 attempts, to keep the history in a single Text helper.'
    recovery_seconds:
      name: Time given to the integration to recover after a reload (seconds)
      default: 600
      selector:
        number:
          min: 60
          max: 3600
          step: 1
          mode: box
      description: Must be at least equal to the recovery confirmation delay.
    stable_seconds:
      name: Normal operation time before confirmation (seconds)
      default: 180
      selector:
        number:
          min: 60
          max: 3600
          step: 1
          mode: box
      description: Every watched entity must stay available during this time. A new unknown or unavailable
        state starts this wait again.
    incident_reset_seconds:
      name: Normal operation time before the attempts are reset (seconds)
      default: 1800
      selector:
        number:
          min: 60
          max: 86400
          step: 1
          mode: box
      description: This delay avoids resetting the counter after a very short improvement. The limit over
        the last 24 hours is kept.
    retry_seconds:
      name: Wait before a new attempt (seconds)
      default: 300
      selector:
        number:
          min: 60
          max: 86400
          step: 1
          mode: box
    max_backoff:
      name: Maximum wait between two attempts (seconds)
      default: 3600
      selector:
        number:
          min: 60
          max: 86400
          step: 1
          mode: box
      description: The wait grows after every failure, up to this value.
    reload_timeout:
      name: Delay before an alert when a reload does not finish (seconds)
      default: 180
      selector:
        number:
          min: 30
          max: 3600
          step: 1
          mode: box
      description: An alert is sent when the reload has not finished after this delay. The reload is not
        cancelled; watching resumes as soon as it finishes, and no other reload is started for this
        integration in the meantime.
    native_timeout:
      name: Delay before an alert when Home Assistant is already reconnecting the integration (seconds)
      default: 1800
      selector:
        number:
          min: 60
          max: 86400
          step: 1
          mode: box
      description: The watchdog lets Home Assistant carry on reconnecting and only reports a wait that
        lasts too long.
    additional_conditions:
      name: Extra conditions allowing reloads
      description: Checks and alerts go on when these conditions prevent a new reload.
      default: []
      selector:
        condition: {}
notifications:
  name: Notifications
  input:
    failure_actions:
      name: Actions when an intervention is needed
      description: 'Default: a notification in Home Assistant. Variables available to customise the
        message: entry_id, integration_title, reason, attempts_used, daily_attempts, failed_entities,
        status. A notification that fails is retried at a later check.'
      selector:
        action: {}
      default:
      - action: persistent_notification.create
        data:
          notification_id: integration_watchdog_{{ entry_id }}
          title: 'Integration to check: {{ integration_title }}'
          message: '{{ reason }}

            Attempts for this failure: {{ attempts_used }}; over the last 24 h: {{ daily_attempts
            }}.

            Failing entities: {{ failed_entities | join(", ") }}.'
    success_actions:
      name: Actions after recovery
      description: By default, clears the failure notification. The same variables as for the alert are
        available.
      selector:
        action: {}
      default:
      - action: persistent_notification.dismiss
        data:
          notification_id: integration_watchdog_{{ entry_id }}
    configuration_error_actions:
      name: Actions when the watchdog configuration is wrong
      description: 'Default: a notification explaining the settings to fix. Available variable:
        configuration_errors.'
      selector:
        action: {}
      default:
      - action: persistent_notification.create
        data:
          notification_id: integration_watchdog_configuration_{{ owner_id }}
          title: Integration watchdog unavailable
          message: '{{ configuration_errors | join("\n") }}'
    configuration_resolved_actions:
      name: Actions when the configuration is correct
      description: 'By default, clears the configuration alert. These actions run at every valid check:
        they must be quick and safe to run several times.'
      selector:
        action: {}
      default:
      - action: persistent_notification.dismiss
        data:
          notification_id: integration_watchdog_configuration_{{ owner_id }}
