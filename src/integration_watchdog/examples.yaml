# Fictional examples: replace the instances and entities before use.
# Three examples; other instances are added with the same form.
- id: integration_watchdog_netatmo
  alias: Watchdog — Netatmo
  use_blueprint:
    path: local/integration_watchdog.yaml
    input:
      name: Netatmo
      entry_id: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa1
      entities:
      - sensor.netatmo_temperature
      - sensor.netatmo_co2
      memory: input_text.watchdog_netatmo
      policy: all
      max_age: 1800
      recovery_seconds: 900
      stagger_seconds: 0
      uptime_entity: sensor.uptime
