blueprint:
  name: Surveillance des piles et batteries
  description: >-
    Signale tout de suite chaque pile ou batterie qui passe sous le seuil, chaque appareil devenu muet et chaque alerte
    « pile faible », puis envoie un récapitulatif à l’heure choisie. Téléphones, montres, ordinateurs et
    onduleurs sont exclus par défaut (intégrations mobile_app, icloud, icloud3, nut et fabricant Apple).
    Une liste de tâches locale réservée à cette automatisation, sans limite de taille, mémorise les
    appareils signalés : une pile n’est pas signalée à nouveau tant qu’elle n’a pas été remplacée. Cocher
    un élément de la liste le retire du récapitulatif jusqu’au remplacement.
    Menu → Exécuter les actions envoie le récapitulatif immédiatement.
    Guide : https://github.com/fbonelle/home-assistant-blueprints/blob/main/docs/battery_watch.md
  domain: automation
  homeassistant:
    min_version: 2026.10.0
  source_url: https://github.com/fbonelle/home-assistant-blueprints/blob/main/blueprints/automation/battery_watch/surveillance_piles.yaml
  author: fbonelle
  input:
    detection:
      name: Détection
      input:
        memory:
          name: Liste de tâches réservée à cette automatisation
          description: >-
            Ajouter l’intégration « Liste de tâches locale » et créer une liste dédiée. Chaque appareil
            signalé y devient un élément, retiré automatiquement après remplacement de la pile. Cocher un
            élément indique que la pile est prise en compte : il quitte le récapitulatif, sans nouvelle alerte.
            Les éléments ajoutés à la main sont ignorés.
          selector:
            entity:
              filter:
              - domain: todo
                integration: local_todo
        threshold:
          name: Seuil de pile faible
          description: Un niveau strictement inférieur à ce seuil déclenche une alerte.
          default: 20
          selector:
            number: {min: 1, max: 100, step: 1, unit_of_measurement: '%', mode: box}
        recovery_margin:
          name: Marge de retour à la normale
          description: >-
            Un appareil signalé n’est considéré comme réparé qu’au-dessus du seuil plus cette marge. Évite
            de nouvelles alertes quand une pile oscille autour du seuil.
          default: 5
          selector:
            number: {min: 0, max: 50, step: 1, unit_of_measurement: '%', mode: box}
        unavailable_hours:
          name: Délai avant de signaler un appareil muet
          description: >-
            Une pile vide rend souvent l’appareil indisponible au lieu d’annoncer un niveau bas. Au-delà de ce
            délai d’indisponibilité, l’appareil est signalé. Le délai écarte les coupures passagères d’une
            passerelle. 0 désactive cette règle.
          default: 6
          selector:
            number: {min: 0, max: 168, step: 1, unit_of_measurement: h, mode: box}
        include_binary:
          name: Prendre en compte les alertes « pile faible » des appareils
          description: Capteurs binaires de classe batterie, signalés lorsqu’ils passent à « on ».
          default: true
          selector: {boolean: {}}
        scan_minutes:
          name: Fréquence de vérification
          default: /5
          selector:
            select:
              options:
              - {value: /1, label: Toutes les minutes}
              - {value: /5, label: Toutes les 5 minutes}
              - {value: /15, label: Toutes les 15 minutes}
              - {value: /30, label: Toutes les 30 minutes}
    exclusions:
      name: Appareils exclus
      collapsed: true
      input:
        excluded_integrations:
          name: Intégrations exclues
          description: >-
            Leurs appareils sont rechargés au quotidien. Le domaine est lu sur la configuration de chaque
            entité, ce qui couvre aussi les entités qu’une intégration ne recense plus.
          default: [mobile_app, icloud, icloud3, nut]
          selector:
            select:
              multiple: true
              custom_value: true
              options:
              - {value: mobile_app, label: Application mobile (mobile_app)}
              - {value: icloud, label: Apple iCloud (icloud)}
              - {value: icloud3, label: iCloud3 (icloud3)}
              - {value: nut, label: Onduleurs NUT (nut)}
        excluded_manufacturers:
          name: Fabricants exclus
          description: Comparaison sans tenir compte des majuscules.
          default: [Apple]
          selector:
            select:
              multiple: true
              custom_value: true
              options: [Apple]
        excluded_entities:
          name: Entités exclues
          default: []
          selector:
            entity:
              multiple: true
              filter:
              - domain: [sensor, binary_sensor]
                device_class: battery
        excluded_devices:
          name: Appareils exclus
          default: []
          selector:
            device:
              multiple: true
        excluded_labels:
          name: Étiquettes exclues
          description: Les entités et appareils portant l’une de ces étiquettes sont ignorés.
          default: []
          selector:
            label:
              multiple: true
    notifications:
      name: Notifications
      input:
        immediate:
          name: Signaler immédiatement chaque nouvel appareil
          default: true
          selector: {boolean: {}}
        alert_actions:
          name: Actions d’alerte immédiate
          description: >-
            Exécutées lorsqu’au moins un appareil vient d’être détecté. Variables disponibles :
            battery_title, battery_message (nouveaux appareils, une ligne chacun), battery_new,
            battery_all (appareils non cochés) et battery_acknowledged (appareils cochés), listes de
            dictionnaires e, n, r, v, h ; battery_count.
          default: []
          selector: {action: {}}
        summary_enabled:
          name: Envoyer un récapitulatif
          default: true
          selector: {boolean: {}}
        summary_time:
          name: Heure du récapitulatif
          default: '09:00:00'
          selector: {time: {}}
        summary_weekdays:
          name: Jours du récapitulatif
          default: [mon, tue, wed, thu, fri, sat, sun]
          selector:
            select:
              multiple: true
              options:
              - {value: mon, label: Lundi}
              - {value: tue, label: Mardi}
              - {value: wed, label: Mercredi}
              - {value: thu, label: Jeudi}
              - {value: fri, label: Vendredi}
              - {value: sat, label: Samedi}
              - {value: sun, label: Dimanche}
        summary_when_empty:
          name: Envoyer aussi le récapitulatif lorsque tout va bien
          default: false
          selector: {boolean: {}}
        summary_actions:
          name: Actions du récapitulatif
          description: >-
            Mêmes variables ; battery_message liste alors tous les appareils à vérifier.
          default: []
          selector: {action: {}}
        persistent_notification:
          name: Tenir à jour une notification persistante
          description: Mise à jour à chaque changement de la liste, retirée lorsque plus rien n’est à vérifier.
          default: true
          selector: {boolean: {}}
        notification_conditions:
          name: Conditions supplémentaires pour envoyer les alertes et le récapitulatif
          description: La mémoire et la notification persistante restent à jour même si ces conditions échouent.
          default: []
          selector: {condition: {}}
        logging:
          name: Journaliser les détections
          description: Niveau INFO, journal battery_watch.
          default: false
          selector: {boolean: {}}
mode: queued
max: 10
max_exceeded: silent
triggers:
- trigger: time_pattern
  minutes: !input scan_minutes
  id: scan
- trigger: time
  at: !input summary_time
  id: summary
- trigger: state
  entity_id: !input memory
  id: list
variables:
  memory_entity: !input memory
  threshold: !input threshold
  recovery_margin: !input recovery_margin
  unavailable_hours: !input unavailable_hours
  include_binary: !input include_binary
  excluded_integrations: !input excluded_integrations
  excluded_manufacturers: !input excluded_manufacturers
  excluded_entities: !input excluded_entities
  excluded_devices: !input excluded_devices
  excluded_labels: !input excluded_labels
  immediate: !input immediate
  summary_enabled: !input summary_enabled
  summary_weekdays: !input summary_weekdays
  summary_when_empty: !input summary_when_empty
  persistent_notification: !input persistent_notification
  logging: !input logging
actions:
# Sans déclencheur (Menu → Exécuter les actions), le récapitulatif est envoyé immédiatement.
- variables:
    mode_run: >-
      {% if trigger is not defined or trigger.id is not defined or trigger.id is none %}manual
      {% else %}{{ trigger.id }}{% endif %}
    notification_id: '{{ "battery_watch_" ~ sha256(this.entity_id)[:12] }}'
    errors: '@template:validation'
- if: '{{ errors | count > 0 }}'
  then:
  - action: persistent_notification.create
    data:
      notification_id: '{{ notification_id }}'
      title: Surveillance des piles et batteries — configuration
      message: '{{ errors | join("\n") }}'
  - action: system_log.write
    data:
      logger: battery_watch
      level: warning
      message: '{{ this.entity_id }} : {{ errors | join(" ") }}'
  - stop: Configuration invalide ; mémoire inchangée.
- action: todo.get_items
  target: {entity_id: '{{ memory_entity }}'}
  data:
    status: [needs_action, completed]
  response_variable: memory_items
- variables:
    listed: '{{ memory_items[memory_entity]["items"] | default([], true) }}'
- variables:
    scan: '@template:scan'
- if: '{{ scan.removals | count > 0 }}'
  then:
  - action: todo.remove_item
    target: {entity_id: '{{ memory_entity }}'}
    data: {item: '{{ scan.removals }}'}
- repeat:
    for_each: '{{ scan.new }}'
    sequence:
    - action: todo.add_item
      target: {entity_id: '{{ memory_entity }}'}
      data:
        item: '{{ repeat.item.summary }}'
        description: 'battery_watch:{{ repeat.item.e }}'
- repeat:
    for_each: '{{ scan.renames }}'
    sequence:
    - action: todo.update_item
      target: {entity_id: '{{ memory_entity }}'}
      data:
        item: '{{ repeat.item.uid }}'
        rename: '{{ repeat.item.summary }}'
- variables:
    changed: '{{ (scan.new | count + scan.renames | count + scan.removals | count) > 0 }}'
    battery_all: '{{ scan["items"] }}'
    battery_acknowledged: '{{ scan.acknowledged }}'
    battery_new: '{{ scan.new }}'
    battery_count: '{{ scan["items"] | count }}'
    weekday: "{{ ['mon','tue','wed','thu','fri','sat','sun'][now().weekday()] }}"
    lines_source: '{{ scan["items"] }}'
- variables:
    summary_text: '@template:message'
    lines_source: '{{ battery_new }}'
- variables:
    new_text: '@template:message'
- if: '{{ logging and battery_new | count > 0 }}'
  then:
  - action: system_log.write
    data:
      logger: battery_watch
      level: info
      message: '{{ this.entity_id }} : {{ battery_new | map(attribute="e") | join(", ") }}'
# Le déclencheur « list » couvre un élément coché ou décoché à la main : la notification est actualisée.
- if: '{{ persistent_notification and (changed or mode_run != "scan") }}'
  then:
  - if: '{{ battery_count > 0 }}'
    then:
    - action: persistent_notification.create
      data:
        notification_id: '{{ notification_id }}'
        title: 'Piles et batteries à vérifier ({{ battery_count }})'
        message: '{{ summary_text }}'
    else:
    - action: persistent_notification.dismiss
      data: {notification_id: '{{ notification_id }}'}
- if:
  - condition: template
    value_template: '{{ immediate and battery_new | count > 0 }}'
  - condition: and
    conditions: !input notification_conditions
  then:
  - variables:
      battery_title: '🔋 Pile ou batterie à remplacer ({{ battery_new | count }})'
      battery_message: '{{ new_text }}'
  - sequence: !input alert_actions
- if:
  - condition: template
    value_template: >-
      {{ mode_run == 'manual' or (mode_run == 'summary' and summary_enabled and weekday in summary_weekdays) }}
  - condition: template
    value_template: '{{ battery_count > 0 or summary_when_empty }}'
  - condition: and
    conditions: !input notification_conditions
  then:
  - variables:
      battery_title: >-
        {{ 'Piles et batteries à vérifier (' ~ battery_count ~ ')' if battery_count > 0 else 'Piles et batteries : rien à signaler' }}
      battery_message: '{{ summary_text if battery_count > 0 else "Aucune pile ni batterie à remplacer." }}'
  - sequence: !input summary_actions
