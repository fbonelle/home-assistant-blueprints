blueprint:
  name: Battery watch
  description: >-
    Reports at once every battery that drops below the threshold, every device that went
    silent and every « low battery » alert, then sends a summary at the chosen time. Phones,
    watches, computers and UPS units are excluded by default (mobile_app, icloud, icloud3 and
    nut integrations, and the Apple manufacturer). A local to-do list used by this automation
    only, with no size limit, remembers the reported devices: a battery is not reported again
    until it has been replaced. Checking an item of the list removes it from the summary until
    the replacement. Menu → Run actions sends the summary immediately.
    Guide: https://github.com/fbonelle/home-assistant-blueprints/blob/main/docs/battery_watch.en.md
  domain: automation
  homeassistant:
    min_version: '@min_version'  # tools/versioning.py (MIN_HA)
  source_url: https://github.com/fbonelle/home-assistant-blueprints/blob/main/blueprints/automation/battery_watch/battery_watch.yaml
  author: fbonelle
  input:
    detection:
      name: Detection
      input:
        memory:
          name: To-do list used by this automation only
          description: >-
            Add the « Local To-do » integration and create a dedicated list. Every reported device
            becomes an item, removed automatically once the battery is replaced. Checking an item
            means the battery is being handled: it leaves the summary, with no new alert. Items added
            by hand are ignored.
          selector:
            entity:
              filter:
              - domain: todo
                integration: local_todo
        threshold:
          name: Low battery threshold
          description: A level strictly below this threshold raises an alert.
          default: 20
          selector:
            number: {min: 1, max: 100, step: 1, unit_of_measurement: '%', mode: box}
        recovery_margin:
          name: Recovery margin
          description: >-
            A reported device counts as fixed only above the threshold plus this margin. Avoids new
            alerts when a battery level wavers around the threshold.
          default: 5
          selector:
            number: {min: 0, max: 50, step: 1, unit_of_measurement: '%', mode: box}
        unavailable_hours:
          name: Delay before reporting a silent device
          description: >-
            An empty battery often makes the device unavailable instead of reporting a low level. Beyond
            this delay of unavailability, the device is reported. The delay rules out short outages of a
            gateway. 0 disables this rule.
          default: 6
          selector:
            number: {min: 0, max: 168, step: 1, unit_of_measurement: h, mode: box}
        include_binary:
          name: Include the devices' « low battery » alerts
          description: Binary sensors of the battery class, reported when they turn « on ».
          default: true
          selector: {boolean: {}}
        scan_minutes:
          name: Check frequency
          default: /5
          selector:
            select:
              options:
              - {value: /1, label: Every minute}
              - {value: /5, label: Every 5 minutes}
              - {value: /15, label: Every 15 minutes}
              - {value: /30, label: Every 30 minutes}
    exclusions:
      name: Excluded devices
      collapsed: true
      input:
        excluded_integrations:
          name: Excluded integrations
          description: >-
            Their devices are charged daily. The domain is read from the configuration of every
            entity, which also covers entities that an integration no longer lists.
          default: [mobile_app, icloud, icloud3, nut]
          selector:
            select:
              multiple: true
              custom_value: true
              options:
              - {value: mobile_app, label: Mobile app (mobile_app)}
              - {value: icloud, label: Apple iCloud (icloud)}
              - {value: icloud3, label: iCloud3 (icloud3)}
              - {value: nut, label: NUT UPS units (nut)}
        excluded_manufacturers:
          name: Excluded manufacturers
          description: Compared case-insensitively.
          default: [Apple]
          selector:
            select:
              multiple: true
              custom_value: true
              options: [Apple]
        excluded_entities:
          name: Excluded entities
          default: []
          selector:
            entity:
              multiple: true
              filter:
              - domain: [sensor, binary_sensor]
                device_class: battery
        excluded_devices:
          name: Excluded devices
          default: []
          selector:
            device:
              multiple: true
        excluded_labels:
          name: Excluded labels
          description: Entities and devices carrying one of these labels are ignored.
          default: []
          selector:
            label:
              multiple: true
    notifications:
      name: Notifications
      input:
        immediate:
          name: Report every new device immediately
          default: true
          selector: {boolean: {}}
        alert_actions:
          name: Immediate alert actions
          description: >-
            Run when at least one device has just been detected. Available variables:
            battery_title, battery_message (new devices, one line each), battery_new, battery_all
            (unchecked devices) and battery_acknowledged (checked devices), lists of mappings
            e, n, r, v, h; battery_count.
          default: []
          selector: {action: {}}
        summary_enabled:
          name: Send a summary
          default: true
          selector: {boolean: {}}
        summary_time:
          name: Summary time
          default: '09:00:00'
          selector: {time: {}}
        summary_weekdays:
          name: Summary days
          default: [mon, tue, wed, thu, fri, sat, sun]
          selector:
            select:
              multiple: true
              options:
              - {value: mon, label: Monday}
              - {value: tue, label: Tuesday}
              - {value: wed, label: Wednesday}
              - {value: thu, label: Thursday}
              - {value: fri, label: Friday}
              - {value: sat, label: Saturday}
              - {value: sun, label: Sunday}
        summary_when_empty:
          name: Also send the summary when everything is fine
          default: false
          selector: {boolean: {}}
        summary_actions:
          name: Summary actions
          description: >-
            Same variables; battery_message then lists every device to check.
          default: []
          selector: {action: {}}
        persistent_notification:
          name: Keep a persistent notification up to date
          description: Updated at every change of the list, removed when nothing is left to check.
          default: true
          selector: {boolean: {}}
        notification_conditions:
          name: Extra conditions for sending the alerts and the summary
          description: The memory and the persistent notification stay up to date even when these conditions fail.
          default: []
          selector: {condition: {}}
        logging:
          name: Log detections
          description: INFO level, battery_watch logger.
          default: false
          selector: {boolean: {}}
mode: queued
max: 10
max_exceeded: silent
triggers:
- trigger: time_pattern
  minutes: !input scan_minutes
  id: scan
- trigger: time
  at: !input summary_time
  id: summary
- trigger: state
  entity_id: !input memory
  id: list
variables:
  memory_entity: !input memory
  threshold: !input threshold
  recovery_margin: !input recovery_margin
  unavailable_hours: !input unavailable_hours
  include_binary: !input include_binary
  excluded_integrations: !input excluded_integrations
  excluded_manufacturers: !input excluded_manufacturers
  excluded_entities: !input excluded_entities
  excluded_devices: !input excluded_devices
  excluded_labels: !input excluded_labels
  immediate: !input immediate
  summary_enabled: !input summary_enabled
  summary_weekdays: !input summary_weekdays
  summary_when_empty: !input summary_when_empty
  persistent_notification: !input persistent_notification
  logging: !input logging
actions:
# Without a trigger (Menu → Run actions), the summary is sent immediately.
- variables:
    mode_run: >-
      {% if trigger is not defined or trigger.id is not defined or trigger.id is none %}manual
      {% else %}{{ trigger.id }}{% endif %}
    notification_id: '{{ "battery_watch_" ~ sha256(this.entity_id)[:12] }}'
    errors: '@template:validation'
- if: '{{ errors | count > 0 }}'
  then:
  - action: persistent_notification.create
    data:
      notification_id: '{{ notification_id }}'
      title: Battery watch — configuration
      message: '{{ errors | join("\n") }}'
  - action: system_log.write
    data:
      logger: battery_watch
      level: warning
      message: '{{ this.entity_id }}: {{ errors | join(" ") }}'
  - stop: Invalid configuration; memory unchanged.
- action: todo.get_items
  target: {entity_id: '{{ memory_entity }}'}
  data:
    status: [needs_action, completed]
  response_variable: memory_items
- variables:
    listed: '{{ memory_items[memory_entity]["items"] | default([], true) }}'
- variables:
    scan: '@template:scan'
- if: '{{ scan.removals | count > 0 }}'
  then:
  - action: todo.remove_item
    target: {entity_id: '{{ memory_entity }}'}
    data: {item: '{{ scan.removals }}'}
- repeat:
    for_each: '{{ scan.new }}'
    sequence:
    - action: todo.add_item
      target: {entity_id: '{{ memory_entity }}'}
      data:
        item: '{{ repeat.item.summary }}'
        description: 'battery_watch:{{ repeat.item.e }}'
- repeat:
    for_each: '{{ scan.renames }}'
    sequence:
    - action: todo.update_item
      target: {entity_id: '{{ memory_entity }}'}
      data:
        item: '{{ repeat.item.uid }}'
        rename: '{{ repeat.item.summary }}'
- variables:
    changed: '{{ (scan.new | count + scan.renames | count + scan.removals | count) > 0 }}'
    battery_all: '{{ scan["items"] }}'
    battery_acknowledged: '{{ scan.acknowledged }}'
    battery_new: '{{ scan.new }}'
    battery_count: '{{ scan["items"] | count }}'
    weekday: "{{ ['mon','tue','wed','thu','fri','sat','sun'][now().weekday()] }}"
    lines_source: '{{ scan["items"] }}'
- variables:
    summary_text: '@template:message'
    lines_source: '{{ battery_new }}'
- variables:
    new_text: '@template:message'
- if: '{{ logging and battery_new | count > 0 }}'
  then:
  - action: system_log.write
    data:
      logger: battery_watch
      level: info
      message: '{{ this.entity_id }}: {{ battery_new | map(attribute="e") | join(", ") }}'
# The « list » trigger covers an item checked or unchecked by hand: the notification is refreshed.
- if: '{{ persistent_notification and (changed or mode_run != "scan") }}'
  then:
  - if: '{{ battery_count > 0 }}'
    then:
    - action: persistent_notification.create
      data:
        notification_id: '{{ notification_id }}'
        title: 'Batteries to check ({{ battery_count }})'
        message: '{{ summary_text }}'
    else:
    - action: persistent_notification.dismiss
      data: {notification_id: '{{ notification_id }}'}
- if:
  - condition: template
    value_template: '{{ immediate and battery_new | count > 0 }}'
  - condition: and
    conditions: !input notification_conditions
  then:
  - variables:
      battery_title: '🔋 Battery to replace ({{ battery_new | count }})'
      battery_message: '{{ new_text }}'
  - sequence: !input alert_actions
- if:
  - condition: template
    value_template: >-
      {{ mode_run == 'manual' or (mode_run == 'summary' and summary_enabled and weekday in summary_weekdays) }}
  - condition: template
    value_template: '{{ battery_count > 0 or summary_when_empty }}'
  - condition: and
    conditions: !input notification_conditions
  then:
  - variables:
      battery_title: >-
        {{ 'Batteries to check (' ~ battery_count ~ ')' if battery_count > 0 else 'Batteries: nothing to report' }}
      battery_message: '{{ summary_text if battery_count > 0 else "No battery to replace." }}'
  - sequence: !input summary_actions
