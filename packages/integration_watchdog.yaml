# Version 1.0.0 — fichier de configuration commun à installer une seule fois.
script:
  surveillance_ecrire_memoire:
    alias: Surveillance — Enregistrer l’historique
    description: Service interne de comparaison-écriture. Ne pas appeler manuellement. Une écriture concurrente
      est refusée ; aucun écrasement d’un état plus récent.
    mode: queued
    max: 1000
    max_exceeded: warning
    fields:
      memory_entity: &id001
        name: Assistant Texte de la surveillance
        required: true
        selector:
          entity:
            filter:
            - domain: input_text
      expected:
        required: true
        selector:
          text:
            multiline: false
      value:
        required: true
        selector:
          text:
            multiline: false
      guard_off:
        default: ''
        selector:
          text:
            multiline: false
    sequence:
    - variables:
        result:
          ok: false
          conflict: true
    - if: '{{ states(memory_entity) == expected and (guard_off | default('''') == '''' or is_state(guard_off,''off''))
        }}'
      then:
      - action: input_text.set_value
        target:
          entity_id: '{{ memory_entity }}'
        data:
          value: '{{ value }}'
      - variables:
          result: '{{ dict(ok=(states(memory_entity) == value),conflict=false) }}'
    - stop: Résultat de persistance
      response_variable: result
  surveillance_recharger_instance:
    alias: Surveillance — Relancer une intégration
    description: Exécution interne après admission. Un seul lancement par réservation. La fin est persistée avant
      son événement de réveil ; une fin ne prouve pas le rétablissement.
    mode: parallel
    max: 50
    max_exceeded: warning
    fields:
      memory_entity: *id001
      entry_id:
        required: true
        selector:
          text:
            multiline: false
      owner_id:
        required: true
        selector:
          text:
            multiline: false
      entry_key:
        required: true
        selector:
          text:
            multiline: false
      reservation:
        required: true
        selector:
          text:
            multiline: false
    sequence:
    - variables:
        raw: '{{ states(memory_entity) }}'
        record: '{{ states(memory_entity)[4:] | from_json({}) if states(memory_entity).startswith(''iw3:'') else
          {} }}'
    - condition: template
      value_template: '{{ record is mapping and record.get(''o'') == owner_id and record.get(''e'') == entry_key
        and record.get(''p'',0) == reservation and reservation | int(0) > 0 }}'
    - condition: template
      value_template: '{{ record.f == 1 }}'
    - action: script.surveillance_ecrire_memoire
      data:
        memory_entity: '{{ memory_entity }}'
        expected: '{{ raw }}'
        value: iw3:{{ dict(record,f=2) | to_json }}
        guard_off: ''
      response_variable: write_result
    - condition: template
      value_template: '{{ write_result is mapping and write_result.get("ok",false) }}'
    - if: '{{ config_entry_attr(entry_id,''state'') == ''loaded'' and config_entry_attr(entry_id,''disabled_by'')
        is none and not config_entry_attr(entry_id,''pref_disable_polling'') and issues is defined and (''homeassistant'',''config_entry_reauth_''
        ~ config_entry_attr(entry_id,''domain'') ~ ''_'' ~ entry_id) not in issues() }}'
      then:
      - action: homeassistant.reload_config_entry
        data:
          entry_id: '{{ entry_id }}'
        continue_on_error: true
    - variables:
        finished_at: '{{ as_timestamp(now()) | round(0,''ceil'') | int }}'
    - repeat:
        count: 5
        sequence:
        - variables:
            raw: '{{ states(memory_entity) }}'
            record: '{{ states(memory_entity)[4:] | from_json({}) if states(memory_entity).startswith(''iw3:'')
              else {} }}'
        - if: '{{ record is mapping and record.get(''o'') == owner_id and record.get(''e'') == entry_key and record.get(''p'')
            == reservation and record.get(''f'') == 2 }}'
          then:
          - action: script.surveillance_ecrire_memoire
            data:
              memory_entity: '{{ memory_entity }}'
              expected: '{{ raw }}'
              value: iw3:{{ dict(record,f=finished_at) | to_json }}
              guard_off: ''
            response_variable: write_result
    - event: integration_watchdog_completed
      event_data:
        entry_id: '{{ entry_id }}'
        memory_entity: '{{ memory_entity }}'
        owner_id: '{{ owner_id }}'
        reservation: '{{ reservation }}'
  surveillance_confirmer_fin:
    alias: Surveillance — Confirmer la fin d’une relance
    mode: single
    fields:
      memory: *id001
    sequence:
    - variables:
        memory_entity: '{{ memory }}'
        raw: '{{ states(memory) }}'
        record: '{{ states(memory)[4:] | from_json({}) if states(memory).startswith(''iw3:'') else {} }}'
    - condition: template
      value_template: '{{ record is mapping and record.get(''p'',0) > 0 and record.get(''f'',0) <= 2 }}'
    - action: script.surveillance_ecrire_memoire
      data:
        memory_entity: '{{ memory_entity }}'
        expected: '{{ raw }}'
        value: iw3:{{ dict(record,f=(as_timestamp(now()) | round(0,'ceil') | int)) | to_json }}
        guard_off: script.surveillance_recharger_instance
      response_variable: write_result
    - condition: template
      value_template: '{{ write_result is mapping and write_result.get("ok",false) }}'
    - event: integration_watchdog_wake
      event_data:
        memory_entity: '{{ memory_entity }}'
  surveillance_rearmer_incident:
    alias: Surveillance — Réinitialiser les tentatives pour une panne
    mode: parallel
    max: 50
    fields:
      memory: *id001
    sequence:
    - event: integration_watchdog_rearm
      event_data:
        memory_entity: '{{ memory }}'
automation:
- id: surveillance_admission
  alias: Surveillance admission
  mode: queued
  max: 1000
  max_exceeded: warning
  triggers:
  - trigger: event
    event_type: integration_watchdog_request
  actions:
  - variables:
      entry_id: '{{ trigger.event.data.entry_id }}'
      memory_entity: '{{ trigger.event.data.memory_entity }}'
      owner_id: '{{ trigger.event.data.owner_id }}'
      entry_key: '{{ trigger.event.data.entry_key }}'
      reservation: '{{ trigger.event.data.reservation }}'
      max_attempts: '{{ trigger.event.data.max_attempts }}'
      max_daily: '{{ trigger.event.data.max_daily }}'
  - variables:
      raw: '{{ states(memory_entity) }}'
      record: '{{ states(memory_entity)[4:] | from_json({}) if states(memory_entity).startswith(''iw3:'') else {}
        }}'
  - condition: template
    value_template: '{{ record is mapping and record.get(''o'') == owner_id and record.get(''e'') == entry_key and
      record.get(''p'',0) == reservation and reservation | int(0) > 0 }}'
  - condition: template
    value_template: '{{ record.f == 0 }}'
  - variables:
      conflicts: |-
        {% set ns=namespace(ids=[]) %}
        {% for s in states.input_text %}{% if s.entity_id != memory_entity and s.state.startswith('iw3:') %}
        {% set m=s.state[4:]|from_json({}) %}{% if m is mapping and m.get('e') == entry_key %}{% set ns.ids=ns.ids+[s.entity_id] %}{% endif %}
        {% endif %}{% endfor %}{{ ns.ids }}
  - variables:
      capacity: '{{ states(''script.surveillance_recharger_instance'') in [''on'',''off''] and state_attr(''script.surveillance_recharger_instance'',''mode'')
        == ''parallel'' and state_attr(''script.surveillance_recharger_instance'',''current'') | int(9999) < state_attr(''script.surveillance_recharger_instance'',''max'')
        | int(0) }}'
      admitted_at: '{{ as_timestamp(now()) | int }}'
  - variables:
      history: '{{ record.a | select(''gt'',admitted_at-86400) | list }}'
  - variables:
      allowed: '{{ conflicts | count == 0 and capacity and max_attempts is number and max_daily is number and 1
        <= max_attempts <= 10 and 1 <= max_daily <= 6 and record.i < max_attempts and history | count < max_daily
        and config_entry_attr(entry_id,''state'') == ''loaded'' and config_entry_attr(entry_id,''disabled_by'')
        is none and not config_entry_attr(entry_id,''pref_disable_polling'') and issues is defined and (''homeassistant'',''config_entry_reauth_''
        ~ config_entry_attr(entry_id,''domain'') ~ ''_'' ~ entry_id) not in issues() }}'
  - if: '{{ allowed }}'
    then:
    - action: script.surveillance_ecrire_memoire
      data:
        memory_entity: '{{ memory_entity }}'
        expected: '{{ raw }}'
        value: iw3:{{ dict(record,f=1,i=record.i+1,a=history+[admitted_at]) | to_json }}
        guard_off: ''
      response_variable: write_result
    - if: '{{ write_result is mapping and write_result.get("ok",false) }}'
      then:
      - action: script.turn_on
        target:
          entity_id: script.surveillance_recharger_instance
        data:
          variables:
            entry_id: '{{ entry_id }}'
            memory_entity: '{{ memory_entity }}'
            owner_id: '{{ owner_id }}'
            entry_key: '{{ entry_key }}'
            reservation: '{{ reservation }}'
    else:
    - action: script.surveillance_ecrire_memoire
      data:
        memory_entity: '{{ memory_entity }}'
        expected: '{{ raw }}'
        value: iw3:{{ dict(record,p=0,f=0,n=admitted_at+60,s=('duplicate' if conflicts | count > 0 else 'deferred'))
          | to_json }}
        guard_off: ''
      response_variable: write_result
  - event: integration_watchdog_completed
    event_data:
      entry_id: '{{ entry_id }}'
      memory_entity: '{{ memory_entity }}'
      owner_id: '{{ owner_id }}'
      reservation: '{{ reservation }}'
- id: surveillance_journaux
  alias: Surveillance journaux
  mode: queued
  max: 1000
  triggers:
  - trigger: event
    event_type: integration_watchdog_log
  actions:
  - action: system_log.write
    continue_on_error: true
    data:
      logger: integration_watchdog
      level: '{{ trigger.event.data.level if trigger.event.data.level in [''debug'',''info'',''warning''] else ''warning''
        }}'
      message: '{{ trigger.event.data.message }}'
logger:
  logs:
    integration_watchdog: debug
system_log: {}
