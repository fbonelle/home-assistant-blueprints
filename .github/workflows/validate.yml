name: Blueprint validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-tests:
    # « tested »: version pinned in requirements-test.txt, the one of the blueprint versions.
    # « minimum »: latest patch of the homeassistant.min_version month (tools/versioning.py),
    # so that the stated requirement stays true.
    name: Native tests (${{ matrix.release }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        release: [tested, minimum]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-test.txt
      - name: Install the development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install the minimum Home Assistant version and the dependencies of its integrations
        if: matrix.release == 'minimum'
        run: |
          python -m pip install "homeassistant~=$(python tools/versioning.py min)"
          python -m pip install $(python tools/ha_release.py integration-requirements)
      - name: Check the YAML build
        if: matrix.release == 'tested'
        run: |
          python tools/build.py
          git diff --exit-code -- blueprints examples
      - name: Run the isolated native tests
        run: python -m pytest -q
