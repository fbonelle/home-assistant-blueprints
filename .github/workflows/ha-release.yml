# Follows the public Home Assistant releases (tools/ha_release.py).
#
# Every day, compares the latest public Home Assistant release on PyPI (betas and release
# candidates excluded) with the version pinned for the tests. When it is newer: pins that
# version and the dependencies of its integrations used by the tests, moves every family to
# <version>.0, completes the changelog, regenerates the blueprints and runs the whole test
# suite. When everything passes, the result is published on main and the failure issues of
# earlier releases are closed; otherwise an issue is opened (one per release) and nothing
# is changed.
#
# The tests run in this workflow before anything is published: a commit pushed with the
# workflow token does not trigger the validation workflow.
name: Follow Home Assistant releases
on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: ha-release
  cancel-in-progress: false
jobs:
  follow:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Look for a new public release
        id: check
        run: python3 tools/ha_release.py check
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.check.outputs.new == 'true'
        with:
          python-version: ${{ steps.check.outputs.python }}
      - name: Pin the new release and update the blueprint versions
        if: steps.check.outputs.new == 'true'
        env:
          RELEASE: ${{ steps.check.outputs.version }}
          PYTHON: ${{ steps.check.outputs.python }}
        run: python tools/ha_release.py apply "$RELEASE" "$PYTHON"
      - name: Install the development dependencies
        if: steps.check.outputs.new == 'true'
        run: python -m pip install -r requirements-dev.txt
      - name: Align the dependencies of the integrations used by the tests
        if: steps.check.outputs.new == 'true'
        run: |
          python tools/ha_release.py sync-requirements
          python -m pip install -r requirements-test.txt
      - name: Regenerate the blueprints and check that the build is stable
        if: steps.check.outputs.new == 'true'
        run: |
          python tools/build.py
          git add -A
          python tools/build.py
          git diff --exit-code
      - name: Run the isolated native tests
        if: steps.check.outputs.new == 'true'
        run: python -m pytest -q
      - name: Validate the sliding minimum before publishing
        if: steps.check.outputs.new == 'true'
        run: |
          python -m venv "$RUNNER_TEMP/ha-minimum"
          "$RUNNER_TEMP/ha-minimum/bin/python" -m pip install -r requirements-tooling.txt "homeassistant==$(python tools/versioning.py min)"
          "$RUNNER_TEMP/ha-minimum/bin/python" -m pip install $("$RUNNER_TEMP/ha-minimum/bin/python" tools/ha_release.py integration-requirements)
          "$RUNNER_TEMP/ha-minimum/bin/python" -m pip check
          "$RUNNER_TEMP/ha-minimum/bin/python" -m pytest -q
      - name: Publish on main
        if: steps.check.outputs.new == 'true'
        env:
          RELEASE: ${{ steps.check.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "Validated with Home Assistant $RELEASE"
          git push origin HEAD:main
      - name: Close the failure issues of earlier releases
        if: steps.check.outputs.new == 'true'
        # The versions are already published: a failure here must not open a failure issue.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ steps.check.outputs.version }}
        run: |
          prefix='Validation failed with Home Assistant '
          gh issue list --state open --search "\"$prefix\" in:title" --json number,title \
            --jq ".[] | select(.title | startswith(\"$prefix\")) | .number" |
          while read -r number; do
            gh issue close "$number" --comment "Home Assistant $RELEASE passes every test: versions published on main."
          done
      - name: Report the failure in an issue
        if: failure() && steps.check.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ steps.check.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Validation failed with Home Assistant $RELEASE"
          open=$(gh issue list --state open --search "\"$title\" in:title" --json title \
                 --jq "[.[] | select(.title == \"$title\")] | length")
          if [ "$open" = "0" ]; then
            gh issue create --title "$title" --body "The build or the tests failed with Home Assistant $RELEASE; no version was changed.

          Details: $RUN_URL

          The workflow retries every day until a newer release passes."
          fi
