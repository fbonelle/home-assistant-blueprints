# Updates of the development dependencies and of the GitHub actions.
#
# Home Assistant and the dependencies of its integrations (ical) are excluded: the
# « Follow Home Assistant releases » workflow updates them, after all tests pass, together
# with the blueprint versions.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: 'GitHub Actions:'
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    ignore:
      - dependency-name: homeassistant
      - dependency-name: ical
    groups:
      test-tools:
        patterns: ['*']
    commit-message:
      prefix: 'Test dependencies:'
